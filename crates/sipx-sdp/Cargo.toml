[package]
name = "sipx-sdp"
description = "SDP session descriptions (RFC 8866) and offer/answer negotiation (RFC 3264)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
rand.workspace = true
bytes.workspace = true
thiserror.workspace = true
# RFC 8122 fingerprints. RustCrypto, and `subtle` so a fingerprint comparison does not hand an
# attacker who can offer certificates a byte-at-a-time oracle for how far a forged one matched.
sha1.workspace = true
sha2.workspace = true
subtle.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
proptest.workspace = true

[lints]
workspace = true

# docs.rs builds default features; `scripts/build-docs.sh` builds `--all-features`. Without this the
# two front doors document different APIs, and the one a reader lands on from crates.io is the one
# missing the optional half — for `sipx-media` that is the only `Handshake` implementation (`A-8`).
[package.metadata.docs.rs]
all-features = true
