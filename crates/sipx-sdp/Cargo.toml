[package]
name = "sipx-sdp"
description = "SDP session descriptions (RFC 8866) and offer/answer negotiation (RFC 3264)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["sdes-keys"]
## Generating RFC 4568 SDES master keys. On by default, and every native consumer keeps it.
## Parsing, comparing and answering an `a=crypto` line is not behind it — only minting a key is,
## because that is the crate's one and only draw on an operating-system entropy source, and
## `rand` refuses to compile for `wasm32-unknown-unknown`. The browser-audio profile never
## carries `a=crypto` at all (`docs/specs/webrtc-audio.md` §4.5), so the kernel that drops this
## feature loses nothing it is allowed to do.
sdes-keys = ["dep:rand"]

[dependencies]
rand = { workspace = true, optional = true }
bytes.workspace = true
thiserror.workspace = true
# RFC 8122 fingerprints. RustCrypto, and `subtle` so a fingerprint comparison does not hand an
# attacker who can offer certificates a byte-at-a-time oracle for how far a forged one matched.
sha1.workspace = true
sha2.workspace = true
subtle.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
proptest.workspace = true

[lints]
workspace = true

# docs.rs builds default features; `scripts/build-docs.sh` builds `--all-features`. Without this the
# two front doors document different APIs, and the one a reader lands on from crates.io is the one
# missing the optional half — for `sipx-media` that is the only `Handshake` implementation (`A-8`).
[package.metadata.docs.rs]
all-features = true
