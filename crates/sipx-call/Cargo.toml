[package]
name = "sipx-call"
description = "Call framework: answer and dial calls with playback, recording, DTMF and transfer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Opus (RFC 6716/7587) for the calls this crate places and answers. Off by default: it links
# libopus, and the default codec set stays the G.711 pair — mandatory-to-implement and pure
# Rust. Enabling it does not change what a call offers; it makes `Codecs::Opus` selectable.
opus = ["sipx-media/opus"]

[dependencies]
rand.workspace = true
sipx-sip.workspace = true
sipx-sdp.workspace = true
sipx-rtp.workspace = true
sipx-audio.workspace = true
sipx-media.workspace = true
sipx-transport.workspace = true
bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "fs", "macros"] }

[dev-dependencies]
sipx-rtp.workspace = true
bytes.workspace = true
sipx-testkit.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
pretty_assertions.workspace = true

[lints]
workspace = true

# docs.rs builds default features; `scripts/build-docs.sh` builds `--all-features`. Without this the
# two front doors document different APIs, and the one a reader lands on from crates.io is the one
# missing the optional half — for `sipx-media` that is the only `Handshake` implementation (`A-8`).
[package.metadata.docs.rs]
all-features = true
