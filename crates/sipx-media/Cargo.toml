[package]
name = "sipx-media"
description = "Media sessions: RTP/RTCP sockets bound to negotiated SDP, with NAT handling"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
## Opus (RFC 6716). Pulls in a C dependency through `sipx-audio`; off by default so the stack
## stays pure Rust unless somebody asks for the codec.
opus = ["sipx-audio/opus"]

[dependencies]
rand.workspace = true
sipx-sdp.workspace = true
sipx-rtp.workspace = true
sipx-audio.workspace = true
bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["net", "rt", "sync", "time", "macros"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
pretty_assertions.workspace = true

[lints]
workspace = true
