[package]
name = "sipx-media"
description = "Media sessions: RTP/RTCP sockets bound to negotiated SDP with NAT handling, bridging and conferencing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
## Opus (RFC 6716). Pulls in a C dependency through `sipx-audio`; off by default so the stack
## stays pure Rust unless somebody asks for the codec.
opus = ["sipx-audio/opus"]
## DTLS-SRTP (RFC 5764). Pulls in OpenSSL; off by default so the stack stays pure Rust unless
## somebody needs keying that does not trust the signalling path. Everything DTLS-SRTP *decides*
## — the fingerprint check, the profile, the key split, the demultiplexing — is in `dtls` either
## way; this feature supplies only the handshake.
dtls = ["dep:openssl"]

[dependencies]
rand.workspace = true
sipx-sdp.workspace = true
sipx-rtp.workspace = true
sipx-audio.workspace = true
# The STUN header, `is_stun` and the transaction ID ICE's connectivity checks are built on
# (docs/specs/ice.md §11 and §15, which puts reflexive gathering here "over
# `sipx_transport::stun`" for the same reason: one Binding client, not two).
#
# Spelled out rather than `workspace = true`, and that is the only reason the version is
# repeated here: what is reused is RFC 5389's header, not a SIP transport, so this must come
# with `default-features = false` — otherwise every user of `sipx-media` inherits rustls, a
# WebSocket stack and a DNS client to borrow twenty bytes of header layout. Cargo refuses
# `default-features = false` on a workspace dependency that does not set it, and setting it in
# the workspace table would turn the transports off for the five crates that want them.
# A release that bumps the workspace version and forgets this line fails loudly in
# `cargo publish`, not quietly.
sipx-transport = { path = "../sipx-transport", version = "1.0.0-beta.2", default-features = false }
# `MESSAGE-INTEGRITY` is HMAC-SHA1 (RFC 5389 §15.4; RFC 8445 cites RFC 5389, not RFC 8489, so
# there is no SHA-256 variant), and `subtle` compares the received tag without leaking through
# timing how far a forgery matched — the same pairing `sipx_sdp::fingerprint` and
# `sipx_rtp::srtp` already use, and for the same reason. All three are already in this crate's
# transitive graph through `sipx-rtp`, so naming them directly adds nothing to a build.
hmac.workspace = true
sha1.workspace = true
subtle.workspace = true
bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["net", "rt", "sync", "time", "macros"] }
openssl = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
pretty_assertions.workspace = true

[lints]
workspace = true

# docs.rs builds default features; `scripts/build-docs.sh` builds `--all-features`. Without this the
# two front doors document different APIs, and the one a reader lands on from crates.io is the one
# missing the optional half — for `sipx-media` that is the only `Handshake` implementation (`A-8`).
[package.metadata.docs.rs]
all-features = true
