[package]
name = "sipx-transport"
description = "Async SIP transports: UDP, TCP, TLS, WebSocket, with RFC 3263 resolution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["udp", "tcp", "dns", "tls", "ws", "wss"]
udp = []
## A real DNS client behind the RFC 3263 resolver trait.
dns = ["dep:hickory-resolver"]
tcp = []
## TLS over TCP (SIPS).
tls = ["tcp", "dep:tokio-rustls", "dep:rustls-pki-types", "dep:rustls-native-certs"]
## SIP over WebSocket (RFC 7118).
ws = ["tcp", "dep:tokio-tungstenite", "dep:futures-util"]
wss = ["ws", "tls"]

[dependencies]
sipx-sip.workspace = true
bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["net", "rt", "sync", "time", "io-util", "macros"] }
rand.workspace = true
rustls-native-certs = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
hickory-resolver = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
tokio-util.workspace = true

[dev-dependencies]
rcgen.workspace = true
sipx-sip.workspace = true
hickory-resolver.workspace = true
sipx-testkit.workspace = true
# test-util gives the paused clock the timer-queue tests need: they assert on ordering and
# cancellation, which would otherwise mean sleeping for real.
tokio = { workspace = true, features = ["full", "test-util"] }
pretty_assertions.workspace = true

[lints]
workspace = true

# docs.rs builds default features; `scripts/build-docs.sh` builds `--all-features`. Without this the
# two front doors document different APIs, and the one a reader lands on from crates.io is the one
# missing the optional half — for `sipx-media` that is the only `Handshake` implementation (`A-8`).
[package.metadata.docs.rs]
all-features = true
