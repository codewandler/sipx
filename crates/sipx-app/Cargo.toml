[package]
name = "sipx-app"
description = "SIP application host with webhook, session, and realtime audio bindings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# The harness schedules on the kernel's own timer queue, generic over its instant since `X-21` —
# which is what lets it run on virtual time with no clock and no runtime.
sipx-transport.workspace = true
# The host process (`X-38`). These are the stack's public API as this application uses it, and that
# use is the definition of the reachable-from-a-call surface — `scripts/check-app-surface.py` reads
# this dependency closure rather than a list somebody keeps. Adding one here widens the surface on
# purpose; it is not a detail.
sipx-call.workspace = true
sipx-sip.workspace = true
sipx-app-protocol = { workspace = true, features = ["call"] }
sipx-audio.workspace = true
sipx-media.workspace = true
# RFC 3261 §11: a call listener must answer an OPTIONS, and what answers one is a user agent — the
# `Allow` list it sends is the one list saying what this stack does, so the host answers through it
# rather than building a 200 of its own that would drift.
sipx-ua = { workspace = true, features = ["runtime"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
# HTTP, signing, and their wire concerns stop at this leaf application.
reqwest.workspace = true
hmac.workspace = true
sha2.workspace = true
bytes.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
# RFC 4648 §4, which is how `docs/specs/openai-realtime.md` §4.1 carries a call's G.711 frames
# inside JSON events. The workspace's own encoder rather than a second one written here: audio
# that decoded differently on two hosts would be a silent corruption, and this is the alphabet
# every other consumer in the tree already reads.
base64.workspace = true

[dev-dependencies]
# The stand-in realtime peer of `A-21` is the counterparty every bridge vector runs against.
# Path-only so Cargo omits unpublished test support from the normalized registry manifest.
sipx-testkit = { path = "../sipx-testkit" }
# Only the tests read the peer's recorded events back; the bridge itself writes and reads JSON
# through `sipx_app_protocol::json`, which is the workspace's own codec.
serde_json.workspace = true
# The product-path vector starts the shipped `sipx-host` binary and reaps it after its bounded
# loopback call. Production does not spawn processes; this feature belongs to the test only.
tokio = { workspace = true, features = ["process"] }

[lints]
workspace = true

# docs.rs builds default features; `scripts/build-docs.sh` builds `--all-features`. Without this the
# two front doors document different APIs, and the one a reader lands on from crates.io is the one
# missing the optional half — for `sipx-media` that is the only `Handshake` implementation (`A-8`).
[package.metadata.docs.rs]
all-features = true
