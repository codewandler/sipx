[package]
name = "sipx-ua"
description = "SIP user agent: client and server roles, dialogs, digest authentication, registration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["runtime"]
# The parts that drive a socket: `agent`, `flows`, and the error type that wraps a transport
# failure. Off by default for nobody — this is on unless a caller asks for the digest primitives
# alone, which is the whole reason the seam exists.
runtime = ["dep:tokio", "dep:sipx-transport"]

[dependencies]
sipx-sip.workspace = true
sipx-transport = { workspace = true, optional = true }
bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true
rand.workspace = true
md-5.workspace = true
sha2.workspace = true
# Server-side digest: HMAC keys the nonce so a server recognises its own without a table, and
# `subtle` compares a digest without leaking how far a guess matched through timing.
hmac.workspace = true
subtle.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"], optional = true }

[dev-dependencies]
sipx-testkit.workspace = true
sipx-transport.workspace = true
tokio = { workspace = true, features = ["full"] }
pretty_assertions.workspace = true

[lints]
workspace = true
