[package]
name = "sipx-sip"
description = "Sans-IO SIP core: messages, parser and transactions (RFC 3261)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# A dev-dependency cycle: sipx-testkit depends on this crate. Cargo permits it, and the
# alternative — a second copy of the corpus — is worse.
sipx-testkit.workspace = true
pretty_assertions.workspace = true
proptest.workspace = true

[lints]
workspace = true

# docs.rs builds default features; `scripts/build-docs.sh` builds `--all-features`. Without this the
# two front doors document different APIs, and the one a reader lands on from crates.io is the one
# missing the optional half — for `sipx-media` that is the only `Handshake` implementation (`A-8`).
[package.metadata.docs.rs]
all-features = true
