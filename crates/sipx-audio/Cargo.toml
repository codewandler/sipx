[package]
name = "sipx-audio"
description = "Telephony audio: G.711 µ-law and A-law, L16, linear PCM conversion and resampling, WAV I/O, and Opus behind the `opus` feature"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
## Opus support. Pulls in a C dependency; off by default so the stack stays pure Rust.
opus = ["dep:opus"]

[dependencies]
bytes.workspace = true
thiserror.workspace = true
opus = { workspace = true, optional = true }

[dev-dependencies]
pretty_assertions.workspace = true
proptest.workspace = true

[lints]
workspace = true

# docs.rs builds default features; `scripts/build-docs.sh` builds `--all-features`. Without this the
# two front doors document different APIs, and the one a reader lands on from crates.io is the one
# missing the optional half — for `sipx-media` that is the only `Handshake` implementation (`A-8`).
[package.metadata.docs.rs]
all-features = true
