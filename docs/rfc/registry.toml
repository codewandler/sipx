[[rfc]]
number = 3550
title = "RTP: A Transport Protocol for Real-Time Applications"
layer = "media"
status = "implemented"
evidence = [
  "crates/sipx-rtp/src/packet.rs",
  "crates/sipx-rtp/src/rtcp.rs",
