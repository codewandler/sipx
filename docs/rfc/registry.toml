[[rfc]]
number = 4733
title = "RTP Payload for DTMF Digits, Telephony Tones, and Telephony Signals"
layer = "media"
status = "implemented"
evidence = [
  "crates/sipx-rtp/src/dtmf.rs",
  "crates/sipx-call/src/call.rs",
  "crates/sipx-call/tests/call.rs",
]
note = "Events 0-15, with the payload type read from the negotiation rather than assumed. End retransmissions share the event's timestamp, which is the part that is usually wrong. Reachable from a call: `Call::send_digit`, `send_digits` and `recv_digit` are public, and `call.rs`'s tests carry `1234#` across a live call and assert the digit leaves on the payload type the answer named rather than on 101."

[[rfc]]
number = 6716
title = "Definition of the Opus Audio Codec"
layer = "media"
status = "implemented"
evidence = [
  "crates/sipx-audio/src/opus.rs",
  "crates/sipx-call/src/call.rs",
  "crates/sipx-call/tests/opus.rs",
]
note = "Encode and decode, and **a call can now select it** — `M-30` built the selection `M-13` left out, which is what `X-33` demoted this row for lacking. `Codecs` is the choice: `DialOptions::with_codecs` on the offering side, `answer_with`, `answer_ringing_with`, `answer_replacing_with`, `Invitation::answer_with` and `ring_early_with` on the answering side, and `Call` carries the set so a re-INVITE does not narrow to G.711 mid-call. `sipx-call/tests/opus.rs` places a call with Opus selected and asserts 111 in the offer with its `a=rtpmap`, both ends settling on `Codec::Opus`, and 300 ms of a 48 kHz tone arriving sample-for-sample — a count only an Opus encode and decode can produce, since a G.711 read of an Opus packet yields a sample per byte. Behind `sipx-call`'s `opus` feature, **off by default**, because it links a C library through `sipx-audio`; the default set stays the mandatory-to-implement G.711 pair, so the codec cannot become the default by accident. One deliberate limit, and one plain gap. Deliberate: negotiation refuses to settle outside the selected set, so an Opus offer reaching a G.711 call is answered G.711 rather than silently upgraded, never quietly better than what was asked for. The gap: **the `sipx` binary cannot select Opus by any route** — `sipx-cli` takes no flag for it, and declares no `[features]` of its own, so it could not forward `sipx-call/opus` even if a flag existed. The codec is reachable from the library and not from the binary."

[[rfc]]
number = 7587
title = "RTP Payload Format for the Opus Speech and Audio Codec"
layer = "media"
status = "implemented"
evidence = [
  "crates/sipx-audio/src/opus.rs",
  "crates/sipx-media/tests/opus.rs",
  "crates/sipx-call/src/call.rs",
  "crates/sipx-call/tests/opus.rs",
]
note = "The payload format, and **a call now puts it on the wire** — `X-33` demoted this row because nothing above `sipx-media`'s own tests could, and `M-30` built the selection that can. Implemented and tested: the 48000 RTP clock whatever the sample rate (§7), the mandatory `opus/48000/2` rtpmap regardless of the channel count actually sent, mono audio which is §7.1's `stereo=0` default, and matching by encoding name rather than by payload number — a format is read from its `a=rtpmap`, so 111 is Opus only because the description said so, and the number the far end assigned travels with the codec on `Config::payload_type` instead of being reassumed. `sipx-call/tests/opus.rs` carries live Opus packets across a call in both `Codecs::Opus` directions of the negotiation. **No `a=fmtp` for Opus, in either direction**: `maxaveragebitrate`, `useinbandfec`, `usedtx`, `maxplaybackrate`, `cbr` and the `stereo` pair are §7.1's optional parameters, and sipx neither offers them nor reads one a peer offered — so a peer that asks for a bitrate ceiling or in-band FEC is not refused, it is simply not accommodated. Everything the format *requires* is here; everything it lets a receiver ask for is not."

[[rfc]]
number = 3711
title = "The Secure Real-time Transport Protocol (SRTP)"
layer = "media"
status = "partial"
spec = "docs/specs/srtp.md"
roles = ["uac", "uas"]
evidence = [
  "crates/sipx-rtp/src/srtp.rs",
  "crates/sipx-media/tests/srtp.rs",
  "crates/sipx-call/tests/secure_media.rs",
  "crates/sipx-cli/tests/interop_srtp.rs",
]
note = "The default transform, AES_CM_128_HMAC_SHA1_80, for RTP and RTCP, with the replay window and rollover inference. Key derivation and the keystream are checked against the RFC's own Appendix B vectors, and the session authentication key against §5.2's n_a rather than against §B.3's 94-octet example — `M-25` found it keyed with the latter. Both roles reach it on a live call, keyed by RFC 4568: in `secure_media.rs` each end asserts the call negotiated SRTP, and audio crosses the encrypted stream from the calling end to the answering one — one direction, which is the encrypt path on one side and the decrypt path on the other. `interop_srtp.rs` covers both directions against a peer that keyed the session independently, but it is `#[ignore]`d and runs only in the interop matrix, not in the local gate. `X-30` added those two citations, because until then this row claimed both roles from `sipx-rtp` alone and would have read the same had no call ever keyed a stream. Only one transform: no AES-192/256, no f8, no null cipher, and no rekeying (the key derivation rate is fixed at zero). SRTCP has no replay list, which §3.4 asks for over the SRTCP index."

[[rfc]]
number = 4568
title = "SDP Security Descriptions for Media Streams (SDES)"
layer = "media"
status = "partial"
spec = "docs/specs/srtp.md"
roles = ["uac", "uas"]
evidence = [
  "crates/sipx-sdp/src/crypto.rs",
  "crates/sipx-sdp/src/answer.rs",
  "crates/sipx-media/src/session.rs",
  "crates/sipx-call/src/call.rs",
  "crates/sipx-sdp/tests/srtp_negotiation.rs",
  "crates/sipx-call/tests/secure_media.rs",
  "crates/sipx-call/tests/update.rs",
]
note = "`a=crypto` offered and answered, and **only over a secure signalling path** — §7.1 makes that a condition of use, and `Crypto::offer` returns nothing without it rather than leaving the check to every caller. §5.1.2's tag and suite are echoed from the attribute actually accepted (`M-26`), and §6.1's published `inline` parameter is asserted against `Crypto::parse` rather than against sipx's own output. §5.1.3's check — offered suite, accompanying tag, and a key — is `Crypto::verify_answer`, and `SrtpKeys::from_answer` makes it the only way an answer becomes keys. `M-29` put a live call on it: `sipx-call` verifies the answer to its own offer, and a refusal ends the call through `Error::Sdp` naming the tag that came back rather than keying media on two halves nobody agreed on. So both of §5.1's MUSTs now hold on a call and not only in the crates below it. `S-25` closed the one place the refusal was reported nowhere: an answer arriving in a reliable provisional (RFC 3262 §5) is checked the same way, and a refusal now withdraws the invitation with a CANCEL (RFC 3261 §9.1) and returns the same `Error::Sdp`, instead of leaving a caller that never receives a 2xx to time out with no reason. **Partial**, and for what the RFC defines beyond that exchange: no MKI, no key lifetimes, no session parameters, and no `RTP/SAVPF`. See `docs/specs/srtp.md` §12.3."

[[rfc]]
number = 5764
title = "DTLS Extension to Establish Keys for SRTP"
layer = "media"
status = "partial"
spec = "docs/specs/srtp.md"
evidence = [
  "crates/sipx-media/src/dtls/mod.rs",
  "crates/sipx-media/src/dtls/openssl.rs",
  "crates/sipx-media/tests/dtls_srtp.rs",
]
note = "**Missing: a call. No role is reachable from `sipx-call`**, which is why this row lists none — `dial` and `answer` key with SDES or with nothing, `dtls::establish` has no caller outside `sipx-media`'s own tests, and no sipx call has ever performed this handshake. What *is* implemented and tested, in the crate: the `use_srtp` extension with the AES_CM_128_HMAC_SHA1_80 profile, §5.1.2's demultiplexing of DTLS from RTP and STUN on one port, and §4.2's key derivation — the exported block split client key, server key, client salt, server salt, asserted against the RFC's literal offsets rather than against the two ends agreeing with each other. The handshake is OpenSSL, behind the off-by-default `dtls` feature; everything the RFC decides is compiled either way. The gap is `M-28`; `docs/specs/srtp.md` §12.8 states it."

[[rfc]]
number = 5763
title = "Framework for Establishing an SRTP Security Context Using DTLS"
layer = "media"
status = "partial"
spec = "docs/specs/srtp.md"
evidence = [
  "crates/sipx-sdp/src/answer.rs",
  "crates/sipx-media/src/dtls/mod.rs",
]
note = "**Missing: a call. No role is reachable from `sipx-call`**, which is why this row lists none — every offer path calls `Capabilities::with_srtp`, which is SDES, and `Capabilities::with_dtls_srtp` has no caller outside `sipx-sdp`'s own tests. An application cannot ask for this keying, so no INVITE sipx sends carries `UDP/TLS/RTP/SAVP` and no offer of one is ever answered with a fingerprint. What *is* implemented and tested, in `sipx-sdp`: the SDP half as a pure offer/answer — `UDP/TLS/RTP/SAVP` offered and answered, `a=fingerprint` and `a=setup` negotiated with the offerer sending `actpass` (§5) and the answerer taking `active` so its ClientHello opens the NAT it is behind. A DTLS offer with no fingerprint is declined rather than answered, since there would be nothing to authenticate the handshake against. The gap is `M-28`; `docs/specs/srtp.md` §12.8 states it."

[[rfc]]
number = 8122
title = "Connection-Oriented Media Transport over TLS in SDP"
layer = "media"
status = "partial"
spec = "docs/specs/srtp.md"
evidence = [
  "crates/sipx-sdp/src/fingerprint.rs",
  "crates/sipx-media/src/dtls/mod.rs",
]
note = "**Missing: a call. No role is reachable from `sipx-call`**, which is why this row lists none — the fingerprint this RFC defines is only ever carried by the DTLS-SRTP keying of RFC 5763 and 5764, and no call selects that keying. `sipx-call` renders `a=fingerprint` when `Capabilities::dtls` is set, and the only way to set it is `Capabilities::with_dtls_srtp`, which has no caller outside `sipx-sdp`'s own tests — so the branch is dead and §6.2's check runs in no call sipx has ever placed. `X-30` removed the roles and lowered the status; `M-28` had already done the same to 5763 and 5764 for the same reason, and named only those two. What *is* implemented and tested, in `sipx-sdp`: `a=fingerprint` at media and session level, uppercase hex per §5's UHEX rule, and §6.2's comparison itself — a certificate that does not match yields an error rather than keys. MD5 and MD2 are refused at the parser, which is where §5's prohibition on acting on them belongs. The digest length must match the hash named, so a truncated one cannot verify a prefix. The gap is `M-28`; `docs/specs/srtp.md` §12.8 states it."

[[rfc]]
number = 4145
title = "TCP-Based Media Transport in SDP"
layer = "media"
status = "partial"
evidence = ["crates/sipx-sdp/src/fingerprint.rs"]
note = "`a=setup` only, which is the part RFC 5763 §5 borrows to decide who opens the DTLS connection. `sipx-call` renders it, but only inside the branch guarded by `Capabilities::dtls()`, so **no call sipx places emits `a=setup`** — the same dead branch as RFC 8122's `a=fingerprint`, and the reason this row is `partial` rather than cited at the call layer. The `a=connection` attribute and TCP media transport itself are not implemented: sipx carries media over UDP."

[[rfc]]
number = 8445
title = "Interactive Connectivity Establishment (ICE)"
layer = "media"
status = "partial"
evidence = [
  "crates/sipx-media/src/ice/agent.rs",
  "crates/sipx-media/src/ice/checklist.rs",
  "crates/sipx-media/src/ice/candidate.rs",
  "crates/sipx-media/src/ice/stun.rs",
  "crates/sipx-media/src/ice/gather.rs",
  "crates/sipx-media/src/ice/driver.rs",
  "crates/sipx-media/tests/ice.rs",
]
note = "**Missing: a call. No role is reachable from `sipx-call`**, which is why this row lists none — `MediaSession::gather` and `start_with_ice` have no caller outside `sipx-media`, so no INVITE sipx sends carries a `candidate` and no offer of one is ever answered with connectivity checks. `M-22` built the agent and found this; `M-27` is the story that wires it, and `X-30` removed the roles the row kept claiming in the meantime. What *is* implemented and tested, in the crate: a full agent, driven on the port media already uses. Host and server-reflexive gathering (§5.1.1), §5.1.2.1's priorities and §5.1.1.3's foundations, checklists with §6.1.2.6's freezing and §6.1.2.5's limit, §7's checks over a STUN profile anchored to RFC 5769's bytes, §7.3.1.1's role-conflict table row by row, regular nomination (§8.1.1), and §11's Binding Indication keepalives on selected pairs — with a nominated pair replacing symmetric RTP for the stream that has one. Not implemented: ICE restart (§9), which the agent accepts on an input but which nothing offers or detects in SDP (`M-23`); relayed candidates, which need a TURN client and RFC 8656 (`M-24`); and the lite role (§2.2, §6.2, §8.2), deferred with the reason in `docs/specs/ice.md` §12 — interoperating with a lite peer is implemented and is not deferred. Aggressive nomination is deprecated by §4 and is deliberately absent rather than optional."

[[rfc]]
number = 8839
title = "SDP Offer/Answer Procedures for ICE"
layer = "media"
status = "partial"
evidence = [
  "crates/sipx-sdp/src/ice.rs",
  "crates/sipx-media/src/ice/negotiate.rs",
  "crates/sipx-media/src/ice/gather.rs",
  "crates/sipx-media/tests/ice.rs",
]
note = "**Missing: a call. No role is reachable from `sipx-call`**, which is why this row lists none — the offer and answer procedures below are exercised by `sipx-media`'s own tests and by nothing above them, so no call has ever put a `candidate` on the wire. The gap is RFC 8445's and is tracked as `M-27`; `X-30` removed the roles. What *is* implemented and tested: §5's attribute grammar — `candidate`, `remote-candidates`, `ice-ufrag`, `ice-pwd`, `ice-pacing`, `ice-options`, `ice-lite`, `ice-mismatch` — with §5.1's priority range checked on parse, because the value the grammar admits and the range forbids is the one that overflows RFC 8445 §6.1.2.3's pair priority. §4.2's initial offer and answer are generated with `a=ice-options:ice2` and a default destination that is the highest-priority candidate, and §5.3's `ice-mismatch` is reported in the answer when the offer's default destination for a component matched none of its candidates, with RFC 3264's procedures used for that stream instead. A peer offering no `candidate` attribute gets symmetric RTP and no ICE at all (§6). Not implemented: §4.4.1.1.1's restart offer and answer (`M-23`), and `remote-candidates` is parsed but never generated for a Completed stream (§5.2). Trickle ICE (RFC 8838/8840) is a separate offer/answer model and is out of scope."

