  "crates/sipx-cli/tests/cli.rs",
]
note = "One secure audio stream uses RTP/SAVPF, mandatory RTP/RTCP multiplexing, one ICE-nominated component, DTLS-SRTP and the required audio formats in both call roles. Partial because the broader feedback, congestion, header-extension, multi-stream and video requirements are not implemented as a general WebRTC media engine."

