[[rfc]]
number = 9001
title = "Using TLS to Secure QUIC"
layer = "security"
status = "none"
evidence = []
note = "Would carry the certificate policy of `docs/specs/sip-tls.md` unchanged. Its §9.2 is why the spec refuses 0-RTT for requests."

[[rfc]]
number = 6455
title = "The WebSocket Protocol"
layer = "transport"
status = "implemented"
evidence = ["crates/sipx-transport/src/ws.rs"]
note = "Through `tokio-tungstenite`. sipx owns the subprotocol negotiation and the framing rules that RFC 7118 layers on top."

[[rfc]]
number = 5389
title = "Session Traversal Utilities for NAT (STUN)"
layer = "transport"
status = "partial"
roles = ["uac"]
evidence = ["crates/sipx-transport/src/stun.rs"]
note = "A Binding client, as much as RFC 5626 §4.4.2's keep-alive needs: a request with no attributes, and a response read for XOR-MAPPED-ADDRESS. Decoding is verified against the vectors RFC 5769 publishes, including the padded attribute that trips a decoder ignoring §15's alignment rule. No MESSAGE-INTEGRITY, no FINGERPRINT, no credentials, and no server role — ICE (RFC 8445) needs the full protocol, not more attributes on this."

[[rfc]]
number = 5626
title = "Managing Client-Initiated Connections in SIP (Outbound)"
layer = "transport"
status = "partial"
roles = ["uac"]
headers = ["FlowTimer"]
evidence = [
  "crates/sipx-ua/src/outbound.rs",
  "crates/sipx-ua/src/flows.rs",
  "crates/sipx-transport/src/stun.rs",
  "crates/sipx-ua/tests/outbound.rs",
  "crates/sipx-transport/tests/keepalive.rs",
]
note = "The UA side. `+sip.instance` and `reg-id` on REGISTER, `outbound` offered, `Require: outbound` on the 2xx read as acceptance (§6), `ob` on a dialog-forming Contact (§4.3), one registration per outbound proxy with each flow failing independently, §4.5's backoff, and §4.4 keep-alives — CRLF for connection-oriented flows, STUN Binding for UDP, including §4.4.2's rule that a changed reflexive address is a failed flow. Not implemented: the *registrar* side (flow tokens in Path, §5), which is what makes the mechanism useful to the network rather than to the client."

[[rfc]]
number = 3327
title = "SIP Extension Header Field for Registering Non-Adjacent Contacts (Path)"
layer = "transport"
status = "implemented"
headers = ["Path"]
evidence = [
  "crates/sipx-sip/src/headers/address.rs",
  "crates/sipx-ua/src/registrar.rs",
]
note = "Parsed with route-header list semantics, offered as `Supported: path` on every REGISTER, and the returned path vector kept with the binding. Not turned into a route set for outbound requests: §5.1 says a UA ignores it, and `Service-Route` (RFC 3608) is the header for that."

[[rfc]]
number = 3608
title = "SIP Extension Header Field for Service Route Discovery During Registration"
layer = "transport"
status = "implemented"
headers = ["ServiceRoute"]
evidence = [
  "crates/sipx-sip/src/headers/address.rs",
  "crates/sipx-ua/src/registrar.rs",
  "crates/sipx-call/tests/service_route.rs",
]
note = "Parsed with route-header list semantics and order preserved (§6.1), stored against the registration and replaced on every 2xx — so a response with no Service-Route clears it, which is what §6.1 requires. Exercised as a pre-loaded Route set on outgoing initial requests via `DialOptions::with_service_route`, not attached behind the caller's back. A hop missing the `;lr` §5 requires is reported rather than dropped."

[[rfc]]
number = 8599
title = "Push Notification with SIP"
layer = "transport"
status = "partial"
roles = ["uac"]
headers = ["FeatureCaps"]
evidence = [
  "crates/sipx-sip/src/push.rs",
  "crates/sipx-ua/src/push.rs",
  "crates/sipx-ua/src/registrar.rs",
  "crates/sipx-ua/tests/push.rs",
]
note = "The UA half only. `pn-provider`, `pn-param` and `pn-prid` go on the REGISTER's `Contact` as the URI parameters §8.7 registers them as; the `sip.pns`, `sip.pnsreg` and `sip.pnspurr` feature-capability indicators (§8.2) are read out of `Feature-Caps` (RFC 6809 §4) so a client can tell whether the registrar supports the push service it named; 555 (§8.1) is surfaced as its own outcome rather than a generic failure; and a push leads to §4.1.3's binding-refresh REGISTER *before* the pending request is expected — `UserAgent::woken` is that ordering as a type. The push service itself is a trait sipx ships no implementation of, and `pn-purr` is read and carried but not matched against stored bindings — matching is for the party that stores them, which is §5.6's proxy role and not played here. **Not the registrar or proxy half**: minting the PURR (§4.2), the push-bucket hold of §5.6, and sending the push itself are out of scope."

[[rfc]]
number = 7339
title = "SIP Overload Control"
layer = "transport"
status = "none"
evidence = []
note = "sipx answers 503 when its application queue is full, which is the behaviour 7339 exists to improve on."

[[rfc]]
number = 7415
title = "SIP Rate Control"
layer = "transport"
status = "none"
evidence = []
note = "The rate-based half of overload control. Depends on 7339."

# ---------------------------------------------------------------------------------------------
# Core: transactions, dialogs, negotiation
# ---------------------------------------------------------------------------------------------

[[rfc]]
number = 6026
title = "Correct Transaction Handling for 2xx Responses to INVITE"
layer = "core"
status = "implemented"
roles = ["uac", "uas"]
evidence = ["crates/sipx-sip/src/transaction/client.rs", "crates/sipx-sip/src/transaction/server.rs"]
note = "The Accepted state. Without this a 2xx retransmission is absorbed by a transaction that should already have ended."

[[rfc]]
number = 2543
title = "SIP: Session Initiation Protocol (obsoleted by 3261)"
layer = "core"
status = "partial"
evidence = ["crates/sipx-sip/src/transaction/key.rs"]
note = "Not implemented as a protocol. The transaction key falls back to 2543-style matching for a request whose branch lacks the magic cookie, because such requests still arrive."

[[rfc]]
number = 3264
title = "An Offer/Answer Model with SDP"
layer = "core"
status = "implemented"
roles = ["uac", "uas"]
evidence = ["crates/sipx-sdp/src/answer.rs"]
note = "A pure function from offer and capabilities to answer. The offerer's format order is preserved, which is what stops two endpoints transcoding for no reason."

[[rfc]]
number = 3262
title = "Reliability of Provisional Responses in SIP (100rel)"
layer = "core"
status = "implemented"
headers = ["RAck", "RSeq"]
evidence = [
  "crates/sipx-sip/src/rel.rs",
  "crates/sipx-call/src/rel.rs",
  "crates/sipx-call/tests/reliable_provisional.rs",
]
note = "Offered in Supported, honoured in Require. A reliable provisional carries RSeq and is retransmitted from T1 with no T2 cap until PRACK or 64*T1; PRACK carries RAck and is answered 2xx, or 481 when it matches nothing. A peer that requires 100rel while it is off gets 420 with Unsupported. An offer arriving in the provisional is answered in the PRACK, and an offer arriving in the INVITE may be answered in the provisional (ring_early), which is what makes an early-dialog renegotiation by UPDATE legal."

[[rfc]]
number = 3311
title = "The SIP UPDATE Method"
layer = "core"
status = "implemented"
methods = ["UPDATE"]
headers = ["Allow", "RetryAfter"]
evidence = [
  "crates/sipx-sip/src/update.rs",
  "crates/sipx-call/src/update.rs",
  "crates/sipx-call/src/rel.rs",
  "crates/sipx-call/src/call.rs",
  "crates/sipx-call/tests/update.rs",
  "crates/sipx-call/tests/dispatch.rs",
]
note = "Sent and received in an early dialog and a confirmed one. Allow lists UPDATE on the INVITE, its provisional and 2xx responses, and on in-dialog requests (§4). §5.2's three refusals are three answers: 500 with a random Retry-After for a second UPDATE before the first is answered, 491 for glare, 500 with Retry-After when an answer is owed; an unusable description is 488 and the dialog survives. All three now have wire tests: the first two are reached through a per-call inbox holding the peer's next request while an exchange of ours was abandoned part-way, which is what C-4's dispatcher makes ordinary. An early dialog is renegotiable only after the INVITE offer is answered in a reliable provisional (RFC 3262 §5), which ring_early does."

[[rfc]]
number = 4028
title = "Session Timers in SIP"
layer = "core"
status = "implemented"
headers = ["SessionExpires", "MinSe"]
evidence = [
  "crates/sipx-sip/src/session.rs",
  "crates/sipx-call/src/call.rs",
  "crates/sipx-call/tests/session_timer.rs",
]
note = "Negotiated on the INVITE and its 2xx, Table 2 election, 422 with Min-SE below the floor, and a local BYE when no refresh arrives. The refresh is an UPDATE with no body when the peer's Allow lists the method and a re-INVITE otherwise (§7.4)."

[[rfc]]
number = 6665
title = "SIP-Specific Event Notification"
layer = "core"
status = "partial"
roles = ["uas"]
headers = ["Event", "SubscriptionState", "AllowEvents"]
evidence = [
  "crates/sipx-sip/src/event.rs",
  "crates/sipx-ua/src/subscribe.rs",
  "crates/sipx-call/src/transfer.rs",
]
note = "The notifier side: a subscription store keyed on dialog *and* package (§4.4.1), establish/refresh/unsubscribe with §4.2.1.1's shorten-never-lengthen rule, expiry, termination that is final — a terminated subscription produces no further notification and cannot be refreshed back to life — and 489 for an unserved package. `Subscription-State` and its reasons are typed, and the implicit subscription a REFER creates is expressed in those terms rather than beside them. Not implemented: the *subscriber* side, so sipx serves subscriptions and does not place them; and no event packages ship yet (`S-17`, `S-18`)."

[[rfc]]
number = 3841
title = "Caller Preferences for SIP"
layer = "core"
status = "syntax"
headers = ["AcceptContact", "RejectContact", "RequestDisposition"]
evidence = ["crates/sipx-sip/src/name.rs"]
note = "The headers parse and round-trip. Nothing acts on a preference."

[[rfc]]
number = 3326
title = "The Reason Header Field for SIP"
layer = "core"
status = "syntax"
headers = ["Reason"]
evidence = ["crates/sipx-sip/src/name.rs"]
note = "Parsed and preserved. sipx does not populate it on CANCEL or BYE."

