# The RFCs sipx tracks, and how far each one is actually implemented.
#
# Two rules keep this honest.
#
# **This file is the source, `docs/compliance.md` is generated from it.** A hand-maintained
# table drifts from the code within a month and then reads as a claim rather than a
# measurement.
#
# **Claims are checked.** `scripts/rfc-report.py --check` verifies that every header and method
# an entry names is actually known to the parser, and that every file it cites as evidence
# exists. It cannot verify that behaviour is correct — the tests do that — but it can stop an
# entry saying "implemented" about a header the code has never heard of.
#
# The list is deliberately bounded. It is what sipx already touches plus what it has decided to
# aim at; it is not every SIP-related RFC, and it never will be. Some update or obsolete others,
# some define alternatives, some are confined to trust domains sipx does not operate in.
#
# status:
#   implemented — behaviour is present and tested for the roles listed
#   partial     — some of the normative behaviour, with `note` saying which part is missing
#   syntax      — the parser represents it; nothing acts on it
#   none        — tracked as a target, not started
#   n/a         — obsoleted, or a notation rather than a behaviour

# ---------------------------------------------------------------------------------------------
# Wire: can the bytes be represented at all?
# ---------------------------------------------------------------------------------------------

[[rfc]]
number = 3261
title = "SIP: Session Initiation Protocol"
layer = "wire"
status = "partial"
roles = ["uac", "uas"]
headers = ["Via", "From", "To", "CallId", "CSeq", "Contact", "MaxForwards", "Route", "RecordRoute"]
methods = ["INVITE", "ACK", "BYE", "CANCEL", "REGISTER", "OPTIONS"]
evidence = ["crates/sipx-sip/src/parser.rs", "crates/sipx-sip/src/transaction/mod.rs"]
note = "Parser, all four transaction machines, dialogs, UAC and UAS. No proxy role: sipx does not fork, and Record-Route is read rather than written."

[[rfc]]
number = 4475
title = "SIP Torture Test Messages"
layer = "wire"
status = "implemented"
roles = ["uac", "uas"]
evidence = ["crates/sipx-testkit/src/rfc4475.rs", "crates/sipx-sip/tests/rfc4475_corpus.rs"]
note = "The whole corpus, recovered bit-exactly from the RFC's own archive and classified by which layer must object to each message."

[[rfc]]
number = 5118
title = "SIP Torture Test Messages for IPv6"
layer = "wire"
status = "none"
evidence = []
note = "The IPv6 counterpart of 4475. sipx parses IPv6 hosts but has never been asserted against this corpus."

[[rfc]]
number = 3986
title = "Uniform Resource Identifier: Generic Syntax"
layer = "wire"
status = "partial"
evidence = ["crates/sipx-sip/src/uri.rs"]
note = "The SIP and SIPS subset. Percent-encoding and the reserved sets are handled; the general grammar is not."

[[rfc]]
number = 3966
title = "The tel URI for Telephone Numbers"
layer = "wire"
status = "syntax"
evidence = ["crates/sipx-sip/src/uri.rs"]
note = "Represented and round-tripped. Nothing normalises or routes on a tel URI."

[[rfc]]
number = 2606
title = "Reserved Top Level DNS Names"
layer = "wire"
status = "implemented"
evidence = ["crates/sipx-transport/src/ws.rs"]
note = "`.invalid` for the sent-by a WebSocket client invents, which RFC 7118 §5.2 requires never to resolve."

# ---------------------------------------------------------------------------------------------
# Transport: how a message travels, and how the far end is found
# ---------------------------------------------------------------------------------------------

[[rfc]]
number = 3263
title = "SIP: Locating SIP Servers"
layer = "transport"
status = "implemented"
roles = ["uac"]
evidence = ["crates/sipx-transport/src/resolve.rs", "crates/sipx-transport/src/dns.rs"]
note = "NAPTR, SRV and A/AAAA, with the candidate list tried in order. The verification name survives resolution."

[[rfc]]
number = 2782
title = "A DNS RR for specifying the location of services (SRV)"
layer = "transport"
status = "implemented"
evidence = ["crates/sipx-transport/src/resolve.rs"]
note = "Priority then the weighted shuffle, asserted against a seeded distribution rather than eyeballed."

[[rfc]]
number = 3581
title = "An Extension to SIP for Symmetric Response Routing"
layer = "transport"
status = "implemented"
roles = ["uac", "uas"]
evidence = ["crates/sipx-transport/src/nat.rs"]
note = "`rport` observed and echoed, with quote-aware parameter surgery so the value replaces the flag rather than following it."

[[rfc]]
number = 5923
title = "Connection Reuse in SIP"
layer = "transport"
status = "partial"
evidence = ["crates/sipx-transport/src/tcp.rs"]
note = "A response returns over the connection its request arrived on, and the pool distinguishes inbound from outbound. The `alias` parameter is not implemented."

[[rfc]]
number = 7118
title = "The WebSocket Protocol as a Transport for SIP"
layer = "transport"
status = "implemented"
roles = ["uac", "uas"]
evidence = ["crates/sipx-transport/src/ws.rs", "crates/sipx-transport/tests/ws.rs"]
note = "Subprotocol negotiation, one message per frame, and the invented sent-by. Verified against Kamailio's WebSocket module."

[[rfc]]
number = 9000
title = "QUIC: A UDP-Based Multiplexed and Secure Transport"
layer = "transport"
status = "none"
evidence = []
note = "Specified, not implemented: `docs/specs/sip-quic.md` fixes the mapping. There is no RFC for SIP over QUIC, so every choice in that spec is ours and interoperates with nothing else."

[[rfc]]
number = 9001
title = "Using TLS to Secure QUIC"
layer = "security"
status = "none"
evidence = []
note = "Would carry the certificate policy of `docs/specs/sip-tls.md` unchanged. Its §9.2 is why the spec refuses 0-RTT for requests."

[[rfc]]
number = 6455
title = "The WebSocket Protocol"
layer = "transport"
status = "implemented"
evidence = ["crates/sipx-transport/src/ws.rs"]
note = "Through `tokio-tungstenite`. sipx owns the subprotocol negotiation and the framing rules that RFC 7118 layers on top."

[[rfc]]
number = 5626
title = "Managing Client-Initiated Connections in SIP (Outbound)"
layer = "transport"
status = "none"
evidence = []
note = "Flow tokens, `reg-id` and redundant registrations. Needed before a registrar can route back to a NATed client reliably."

[[rfc]]
number = 3327
title = "SIP Extension Header Field for Registering Non-Adjacent Contacts (Path)"
layer = "transport"
status = "implemented"
headers = ["Path"]
evidence = [
  "crates/sipx-sip/src/headers/address.rs",
  "crates/sipx-ua/src/registrar.rs",
]
note = "Parsed with route-header list semantics, offered as `Supported: path` on every REGISTER, and the returned path vector kept with the binding. Not turned into a route set for outbound requests: §5.1 says a UA ignores it, and `Service-Route` (RFC 3608) is the header for that."

[[rfc]]
number = 8599
title = "Push Notification with SIP"
layer = "transport"
status = "none"
evidence = []
note = "How a mobile client that is not holding a connection gets woken. Depends on 5626."

[[rfc]]
number = 7339
title = "SIP Overload Control"
layer = "transport"
status = "none"
evidence = []
note = "sipx answers 503 when its application queue is full, which is the behaviour 7339 exists to improve on."

[[rfc]]
number = 7415
title = "SIP Rate Control"
layer = "transport"
status = "none"
evidence = []
note = "The rate-based half of overload control. Depends on 7339."

# ---------------------------------------------------------------------------------------------
# Core: transactions, dialogs, negotiation
# ---------------------------------------------------------------------------------------------

[[rfc]]
number = 6026
title = "Correct Transaction Handling for 2xx Responses to INVITE"
layer = "core"
status = "implemented"
roles = ["uac", "uas"]
evidence = ["crates/sipx-sip/src/transaction/client.rs", "crates/sipx-sip/src/transaction/server.rs"]
note = "The Accepted state. Without this a 2xx retransmission is absorbed by a transaction that should already have ended."

[[rfc]]
number = 2543
title = "SIP: Session Initiation Protocol (obsoleted by 3261)"
layer = "core"
status = "partial"
evidence = ["crates/sipx-sip/src/transaction/key.rs"]
note = "Not implemented as a protocol. The transaction key falls back to 2543-style matching for a request whose branch lacks the magic cookie, because such requests still arrive."

[[rfc]]
number = 3264
title = "An Offer/Answer Model with SDP"
layer = "core"
status = "implemented"
roles = ["uac", "uas"]
evidence = ["crates/sipx-sdp/src/answer.rs"]
note = "A pure function from offer and capabilities to answer. The offerer's format order is preserved, which is what stops two endpoints transcoding for no reason."

[[rfc]]
number = 3262
title = "Reliability of Provisional Responses in SIP (100rel)"
layer = "core"
status = "syntax"
headers = ["RAck", "RSeq"]
evidence = ["crates/sipx-sip/src/name.rs"]
note = "The headers parse. Nothing sends PRACK or retransmits a reliable provisional."

[[rfc]]
number = 3311
title = "The SIP UPDATE Method"
layer = "core"
status = "syntax"
methods = ["UPDATE"]
evidence = ["crates/sipx-sip/src/message.rs"]
note = "The method is represented. Renegotiation uses re-INVITE only."

[[rfc]]
number = 4028
title = "Session Timers in SIP"
layer = "core"
status = "implemented"
headers = ["SessionExpires", "MinSe"]
evidence = [
  "crates/sipx-sip/src/session.rs",
  "crates/sipx-call/src/call.rs",
  "crates/sipx-call/tests/session_timer.rs",
]
note = "Negotiated on the INVITE and its 2xx, Table 2 election, refresh by re-INVITE, 422 with Min-SE below the floor, and a local BYE when no refresh arrives. UPDATE is not used for the refresh."

[[rfc]]
number = 6665
title = "SIP-Specific Event Notification"
layer = "core"
status = "partial"
headers = ["Event", "SubscriptionState", "AllowEvents"]
evidence = ["crates/sipx-call/src/transfer.rs", "crates/sipx-call/src/call.rs"]
note = "The implicit subscription a REFER creates, including its termination. There is no SUBSCRIBE, no general event package framework and no subscription store."

[[rfc]]
number = 3841
title = "Caller Preferences for SIP"
layer = "core"
status = "syntax"
headers = ["AcceptContact", "RejectContact", "RequestDisposition"]
evidence = ["crates/sipx-sip/src/name.rs"]
note = "The headers parse and round-trip. Nothing acts on a preference."

[[rfc]]
number = 3326
title = "The Reason Header Field for SIP"
layer = "core"
status = "syntax"
headers = ["Reason"]
evidence = ["crates/sipx-sip/src/name.rs"]
note = "Parsed and preserved. sipx does not populate it on CANCEL or BYE."

# ---------------------------------------------------------------------------------------------
# Security: transport security, authentication, identity
# ---------------------------------------------------------------------------------------------

[[rfc]]
number = 2617
title = "HTTP Authentication: Basic and Digest Access Authentication"
layer = "security"
status = "implemented"
roles = ["uac"]
headers = ["Authorization", "WwwAuthenticate", "ProxyAuthenticate", "ProxyAuthorization"]
evidence = ["crates/sipx-ua/src/auth.rs"]
note = "Checked against the worked example the RFC publishes for itself, rather than against sipx's own idea of the answer."

[[rfc]]
number = 7616
title = "HTTP Digest Access Authentication"
layer = "security"
status = "implemented"
roles = ["uac"]
evidence = ["crates/sipx-ua/src/auth.rs"]
note = "MD5, SHA-256 and their session variants, checked against the §3.9.1 worked example rather than against sipx's own arithmetic. See RFC 8760 for SHA-512-256."

[[rfc]]
number = 8760
title = "The SIP Digest Access Authentication Scheme"
layer = "security"
status = "implemented"
roles = ["uac"]
evidence = ["crates/sipx-ua/src/auth.rs"]
note = "SHA-512-256 and SHA-512-256-sess, and multiple challenges resolved by strength rather than by the server's order — §2.4's `unless a local policy dictates otherwise`, taken because §3 names the downgrade attack that ordering enables. `topmost_supported` is the literal rule for callers that want it."

[[rfc]]
number = 5922
title = "Domain Certificates in SIP"
layer = "security"
status = "implemented"
roles = ["uac", "uas"]
evidence = ["crates/sipx-transport/src/tls.rs", "docs/specs/sip-tls.md"]
note = "The identity checked is the host from the URI, never the name resolution produced. There is no way to disable verification."

[[rfc]]
number = 6125
title = "Representation and Verification of Service Identity in TLS"
layer = "security"
status = "implemented"
evidence = ["crates/sipx-transport/tests/tls.rs"]
note = "Through rustls. §6.4.4 in particular: a certificate with a non-matching SAN is refused rather than falling back to the CN."

[[rfc]]
number = 8446
title = "The Transport Layer Security (TLS) Protocol Version 1.3"
layer = "security"
status = "implemented"
evidence = ["crates/sipx-transport/src/tls.rs"]
note = "Through rustls, preferred over 1.2."

[[rfc]]
number = 8996
title = "Deprecating TLS 1.0 and TLS 1.1"
layer = "security"
status = "implemented"
evidence = ["docs/specs/sip-tls.md"]
note = "1.2 is the floor and is not configurable downward."

[[rfc]]
number = 4474
title = "Enhancements for Authenticated Identity Management in SIP"
layer = "security"
status = "syntax"
headers = ["Identity", "IdentityInfo"]
evidence = ["crates/sipx-sip/src/name.rs"]
note = "Headers only, and obsoleted by 8224. Tracked because the header names still arrive on the wire."

[[rfc]]
number = 8224
title = "Authenticated Identity Management in SIP (STIR)"
layer = "security"
status = "none"
evidence = []
note = "The replacement for 4474. Signing and verifying caller identity."

[[rfc]]
number = 8225
title = "PASSporT: Personal Assertion Token"
layer = "security"
status = "none"
evidence = []
note = "The token 8224 carries."

# ---------------------------------------------------------------------------------------------
# Media: describing it, carrying it, encoding it
# ---------------------------------------------------------------------------------------------

[[rfc]]
number = 8866
title = "SDP: Session Description Protocol"
layer = "media"
status = "implemented"
evidence = ["crates/sipx-sdp/src/parse.rs", "crates/sipx-sdp/src/session.rs"]
note = "A real AST with round-tripping, rather than string manipulation over the body."

[[rfc]]
number = 4566
title = "SDP: Session Description Protocol (obsoleted by 8866)"
layer = "media"
status = "n/a"
evidence = []
note = "Superseded. Listed so a reader looking for it knows where it went."

[[rfc]]
number = 3550
title = "RTP: A Transport Protocol for Real-Time Applications"
layer = "media"
status = "implemented"
evidence = ["crates/sipx-rtp/src/packet.rs", "crates/sipx-rtp/src/rtcp.rs"]
note = "RTP and RTCP, including sender and receiver reports and the §A.8 interarrival jitter recurrence — which is not a variance, and is usually implemented as one."

[[rfc]]
number = 3551
title = "RTP Profile for Audio and Video Conferences"
layer = "media"
status = "partial"
evidence = ["crates/sipx-media/src/session.rs"]
note = "The static payload types sipx carries: 0 and 8. The rest of the profile is not implemented."

[[rfc]]
number = 4733
title = "RTP Payload for DTMF Digits, Telephony Tones, and Telephony Signals"
layer = "media"
status = "implemented"
evidence = ["crates/sipx-rtp/src/dtmf.rs"]
note = "Events 0-15, with the payload type read from the negotiation rather than assumed. End retransmissions share the event's timestamp, which is the part that is usually wrong."

[[rfc]]
number = 6716
title = "Definition of the Opus Audio Codec"
layer = "media"
status = "implemented"
evidence = ["crates/sipx-audio/src/opus.rs"]
note = "Behind the `opus` feature, off by default because it links a C library."

[[rfc]]
number = 7587
title = "RTP Payload Format for the Opus Speech and Audio Codec"
layer = "media"
status = "implemented"
evidence = ["crates/sipx-audio/src/opus.rs", "crates/sipx-media/tests/opus.rs"]
note = "The 48000 RTP clock whatever the sample rate, and negotiation by encoding name rather than by payload type number."

[[rfc]]
number = 3711
title = "The Secure Real-time Transport Protocol (SRTP)"
layer = "media"
status = "partial"
roles = ["uac", "uas"]
evidence = ["crates/sipx-rtp/src/srtp.rs", "crates/sipx-media/tests/srtp.rs"]
note = "The default transform, AES_CM_128_HMAC_SHA1_80, for RTP and RTCP, with the replay window and rollover inference. Key derivation and the keystream are checked against the RFC's own Appendix B vectors. Only one transform: no AES-192/256, no f8, no null cipher, and no rekeying (the key derivation rate is fixed at zero)."

[[rfc]]
number = 4568
title = "SDP Security Descriptions for Media Streams (SDES)"
layer = "media"
status = "partial"
roles = ["uac", "uas"]
evidence = ["crates/sipx-sdp/src/crypto.rs", "crates/sipx-sdp/tests/srtp_negotiation.rs"]
note = "`a=crypto` offered and answered, and **only over a secure signalling path** — §7.1 makes that a condition of use, and `Crypto::offer` returns nothing without it rather than leaving the check to every caller. No MKI, no key lifetimes, no session parameters."

[[rfc]]
number = 5764
title = "DTLS Extension to Establish Keys for SRTP"
layer = "media"
status = "none"
evidence = []
note = "The keying WebRTC uses. Depends on 3711."

[[rfc]]
number = 8445
title = "Interactive Connectivity Establishment (ICE)"
layer = "media"
status = "none"
evidence = []
note = "sipx uses symmetric RTP, which handles the common NAT case and not the hard one."

# ---------------------------------------------------------------------------------------------
# Services: what is built on top
# ---------------------------------------------------------------------------------------------

[[rfc]]
number = 3515
title = "The SIP Refer Method"
layer = "services"
status = "implemented"
roles = ["uac", "uas"]
headers = ["ReferTo"]
methods = ["REFER", "NOTIFY"]
evidence = ["crates/sipx-call/src/transfer.rs", "crates/sipx-call/tests/transfer.rs"]
note = "Blind transfer, with the outcome reported by NOTIFY and the implicit subscription terminated. A 202 is modelled as `Trying`, never as success."

[[rfc]]
number = 3891
title = "The SIP Replaces Header"
layer = "services"
status = "implemented"
roles = ["uas"]
headers = ["Replaces"]
evidence = ["crates/sipx-call/src/transfer.rs", "crates/sipx-call/tests/attended.rs"]
note = "Matched on Call-ID and both tags. Matching on the Call-ID alone is a call-hijack primitive, and the refusal is the same 481 whichever field was wrong."

[[rfc]]
number = 3892
title = "The SIP Referred-By Mechanism"
layer = "services"
status = "partial"
headers = ["ReferredBy"]
evidence = ["crates/sipx-call/src/transfer.rs"]
note = "Sent and surfaced to the application. The signed `Referred-By` token is not implemented, so the identity is a claim rather than a proof."

[[rfc]]
number = 4488
title = "Suppression of SIP REFER Method Implicit Subscription"
layer = "services"
status = "none"
evidence = []
note = "`Refer-Sub: false`, for a transferor that does not want the NOTIFYs."

[[rfc]]
number = 3428
title = "SIP Extension for Instant Messaging"
layer = "services"
status = "syntax"
methods = ["MESSAGE"]
evidence = ["crates/sipx-sip/src/message.rs"]
note = "The method is represented and nothing handles it."

[[rfc]]
number = 6086
title = "SIP INFO Method and Package Framework"
layer = "services"
status = "syntax"
methods = ["INFO"]
evidence = ["crates/sipx-sip/src/message.rs"]
note = "The method is represented. sipx sends DTMF as RFC 4733 rather than as INFO."

[[rfc]]
number = 3903
title = "SIP Extension for Event State Publication"
layer = "services"
status = "syntax"
methods = ["PUBLISH"]
evidence = ["crates/sipx-sip/src/message.rs"]
note = "The method is represented. Depends on 6665 for anything further."

[[rfc]]
number = 3856
title = "A Presence Event Package for SIP"
layer = "services"
status = "none"
evidence = []
note = "Depends on a real 6665 implementation."

[[rfc]]
number = 3680
title = "A SIP Event Package for Registrations"
layer = "services"
status = "none"
evidence = []
note = "Depends on 6665 and on a registrar."

[[rfc]]
number = 4235
title = "An INVITE-Initiated Dialog Event Package for SIP"
layer = "services"
status = "none"
evidence = []
note = "Depends on 6665. What a busy-lamp field subscribes to."

[[rfc]]
number = 5627
title = "Obtaining and Using GRUUs in SIP"
layer = "services"
status = "none"
evidence = []
note = "A URI that reaches one specific instance of a registered user. Depends on 3327 and 5626."

[[rfc]]
number = 7044
title = "An Extension to SIP for Request History Information"
layer = "services"
status = "none"
evidence = []
note = "`History-Info`, for a call that was forwarded and needs to say by whom."

[[rfc]]
number = 7865
title = "SDP Recording Metadata"
layer = "services"
status = "none"
evidence = []
note = "The metadata half of SIPREC."

[[rfc]]
number = 7866
title = "Session Recording Protocol"
layer = "services"
status = "none"
evidence = []
note = "Recording as a protocol rather than as a file written locally."
