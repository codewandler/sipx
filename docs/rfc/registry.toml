[[rfc]]
number = 3711
title = "The Secure Real-time Transport Protocol (SRTP)"
layer = "media"
status = "partial"
spec = "docs/specs/srtp.md"
roles = ["uac", "uas"]
evidence = ["crates/sipx-rtp/src/srtp.rs", "crates/sipx-media/tests/srtp.rs"]
note = "The default transform, AES_CM_128_HMAC_SHA1_80, for RTP and RTCP, with the replay window and rollover inference. Key derivation and the keystream are checked against the RFC's own Appendix B vectors, and the session authentication key against §5.2's n_a rather than against §B.3's 94-octet example — `M-25` found it keyed with the latter. Only one transform: no AES-192/256, no f8, no null cipher, and no rekeying (the key derivation rate is fixed at zero). SRTCP has no replay list, which §3.4 asks for over the SRTCP index."

[[rfc]]
number = 4568
title = "SDP Security Descriptions for Media Streams (SDES)"
layer = "media"
status = "partial"
spec = "docs/specs/srtp.md"
roles = ["uac", "uas"]
evidence = [
  "crates/sipx-sdp/src/crypto.rs",
  "crates/sipx-sdp/src/answer.rs",
  "crates/sipx-media/src/session.rs",
  "crates/sipx-sdp/tests/srtp_negotiation.rs",
]
note = "`a=crypto` offered and answered, and **only over a secure signalling path** — §7.1 makes that a condition of use, and `Crypto::offer` returns nothing without it rather than leaving the check to every caller. §5.1.2's tag and suite are echoed from the attribute actually accepted (`M-26`), and §6.1's published `inline` parameter is asserted against `Crypto::parse` rather than against sipx's own output. §5.1.3's check — offered suite, accompanying tag, and a key — is `Crypto::verify_answer`, and `SrtpKeys::from_answer` makes it the only way an answer becomes keys, so a mismatch is a typed failure and not a stream that quietly drops to unencrypted. **Still missing:** `sipx-call` has not yet been moved onto `SrtpKeys::from_answer`, so a live call's answer is paired without the check until that wiring lands; and no MKI, no key lifetimes, no session parameters. See `docs/specs/srtp.md` §12.3."

[[rfc]]
number = 5764
title = "DTLS Extension to Establish Keys for SRTP"
layer = "media"
status = "implemented"
spec = "docs/specs/srtp.md"
roles = ["uac", "uas"]
evidence = [
  "crates/sipx-media/src/dtls/mod.rs",
  "crates/sipx-media/src/dtls/openssl.rs",
  "crates/sipx-media/tests/dtls_srtp.rs",
]
note = "The `use_srtp` extension with the AES_CM_128_HMAC_SHA1_80 profile, §5.1.2's demultiplexing of DTLS from RTP and STUN on one port, and §4.2's key derivation — the exported block split client key, server key, client salt, server salt, asserted against the RFC's literal offsets rather than against the two ends agreeing with each other. The handshake is OpenSSL, behind the off-by-default `dtls` feature; everything the RFC decides is compiled either way."

[[rfc]]
number = 5763
title = "Framework for Establishing an SRTP Security Context Using DTLS"
layer = "media"
status = "implemented"
spec = "docs/specs/srtp.md"
roles = ["uac", "uas"]
evidence = [
  "crates/sipx-sdp/src/answer.rs",
  "crates/sipx-media/src/dtls/mod.rs",
]
note = "The SDP half: `UDP/TLS/RTP/SAVP` offered and answered, `a=fingerprint` and `a=setup` negotiated with the offerer sending `actpass` (§5) and the answerer taking `active` so its ClientHello opens the NAT it is behind. A DTLS offer with no fingerprint is declined rather than answered, since there would be nothing to authenticate the handshake against."

[[rfc]]
number = 8122
title = "Connection-Oriented Media Transport over TLS in SDP"
layer = "media"
status = "implemented"
spec = "docs/specs/srtp.md"
roles = ["uac", "uas"]
evidence = [
  "crates/sipx-sdp/src/fingerprint.rs",
  "crates/sipx-media/src/dtls/mod.rs",
]
note = "`a=fingerprint` at media and session level, uppercase hex per §5's UHEX rule, and §6.2's mandatory check — a certificate that does not match yields an error rather than keys. MD5 and MD2 are refused at the parser, which is where §5's prohibition on acting on them belongs. The digest length must match the hash named, so a truncated one cannot verify a prefix."

[[rfc]]
number = 4145
title = "TCP-Based Media Transport in SDP"
layer = "media"
status = "partial"
evidence = ["crates/sipx-sdp/src/fingerprint.rs"]
note = "`a=setup` only, which is the part RFC 5763 §5 borrows to decide who opens the DTLS connection. The `a=connection` attribute and TCP media transport itself are not implemented: sipx carries media over UDP."

[[rfc]]
number = 8445
title = "Interactive Connectivity Establishment (ICE)"
layer = "media"
status = "partial"
roles = ["uac", "uas"]
evidence = [
  "crates/sipx-media/src/ice/agent.rs",
  "crates/sipx-media/src/ice/checklist.rs",
  "crates/sipx-media/src/ice/candidate.rs",
  "crates/sipx-media/src/ice/stun.rs",
  "crates/sipx-media/src/ice/gather.rs",
  "crates/sipx-media/src/ice/driver.rs",
  "crates/sipx-media/tests/ice.rs",
]
note = "A full agent, driven on the port media already uses. Host and server-reflexive gathering (§5.1.1), §5.1.2.1's priorities and §5.1.1.3's foundations, checklists with §6.1.2.6's freezing and §6.1.2.5's limit, §7's checks over a STUN profile anchored to RFC 5769's bytes, §7.3.1.1's role-conflict table row by row, regular nomination (§8.1.1), and §11's Binding Indication keepalives on selected pairs — with a nominated pair replacing symmetric RTP for the stream that has one. Not implemented: ICE restart (§9), which the agent accepts on an input but which nothing offers or detects in SDP (`M-23`); relayed candidates, which need a TURN client and RFC 8656 (`M-24`); and the lite role (§2.2, §6.2, §8.2), deferred with the reason in `docs/specs/ice.md` §12 — interoperating with a lite peer is implemented and is not deferred. Aggressive nomination is deprecated by §4 and is deliberately absent rather than optional."

[[rfc]]
number = 8839
title = "SDP Offer/Answer Procedures for ICE"
layer = "media"
status = "partial"
roles = ["uac", "uas"]
evidence = [
  "crates/sipx-sdp/src/ice.rs",
  "crates/sipx-media/src/ice/negotiate.rs",
  "crates/sipx-media/src/ice/gather.rs",
  "crates/sipx-media/tests/ice.rs",
]
note = "§5's attribute grammar — `candidate`, `remote-candidates`, `ice-ufrag`, `ice-pwd`, `ice-pacing`, `ice-options`, `ice-lite`, `ice-mismatch` — with §5.1's priority range checked on parse, because the value the grammar admits and the range forbids is the one that overflows RFC 8445 §6.1.2.3's pair priority. §4.2's initial offer and answer are generated with `a=ice-options:ice2` and a default destination that is the highest-priority candidate, and §5.3's `ice-mismatch` is reported in the answer when the offer's default destination for a component matched none of its candidates, with RFC 3264's procedures used for that stream instead. A peer offering no `candidate` attribute gets symmetric RTP and no ICE at all (§6). Not implemented: §4.4.1.1.1's restart offer and answer (`M-23`), and `remote-candidates` is parsed but never generated for a Completed stream (§5.2). Trickle ICE (RFC 8838/8840) is a separate offer/answer model and is out of scope."

# ---------------------------------------------------------------------------------------------
# Services: what is built on top
# ---------------------------------------------------------------------------------------------

[[rfc]]
number = 3515
title = "The SIP Refer Method"
layer = "services"
status = "implemented"
roles = ["uac", "uas"]
headers = ["ReferTo"]
methods = ["REFER", "NOTIFY"]
evidence = ["crates/sipx-call/src/transfer.rs", "crates/sipx-call/tests/transfer.rs"]
note = "Blind transfer, with the outcome reported by NOTIFY and the implicit subscription terminated. A 202 is modelled as `Trying`, never as success."

[[rfc]]
number = 3891
title = "The SIP Replaces Header"
layer = "services"
status = "implemented"
roles = ["uas"]
headers = ["Replaces"]
evidence = ["crates/sipx-call/src/transfer.rs", "crates/sipx-call/tests/attended.rs"]
note = "Matched on Call-ID and both tags. Matching on the Call-ID alone is a call-hijack primitive, and the refusal is the same 481 whichever field was wrong."

[[rfc]]
number = 3892
title = "The SIP Referred-By Mechanism"
layer = "services"
status = "partial"
headers = ["ReferredBy"]
evidence = ["crates/sipx-call/src/transfer.rs"]
note = "Sent and surfaced to the application. The signed `Referred-By` token is not implemented, so the identity is a claim rather than a proof."

[[rfc]]
number = 4488
title = "Suppression of SIP REFER Method Implicit Subscription"
layer = "services"
status = "implemented"
roles = ["uac", "uas"]
headers = ["ReferSub"]
evidence = ["crates/sipx-call/src/transfer.rs"]
note = "`Refer-Sub: false` on the REFER *and* echoed in the 2xx, because §3 makes it a request and an agreement rather than a declaration — a transferor that assumed agreement would stop watching for notifications the transferee is still sending."

[[rfc]]
number = 3428
title = "SIP Extension for Instant Messaging"
layer = "services"
status = "syntax"
methods = ["MESSAGE"]
evidence = ["crates/sipx-sip/src/message.rs"]
note = "The method is represented and nothing handles it."

[[rfc]]
number = 6086
title = "SIP INFO Method and Package Framework"
layer = "services"
status = "syntax"
methods = ["INFO"]
evidence = ["crates/sipx-sip/src/message.rs"]
note = "The method is represented. sipx sends DTMF as RFC 4733 rather than as INFO."

[[rfc]]
number = 3903
title = "SIP Extension for Event State Publication"
layer = "services"
status = "implemented"
roles = ["uas"]
methods = ["PUBLISH"]
evidence = ["crates/sipx-ua/src/presence.rs"]
note = "Soft state with entity tags: initial publication, refresh, modify and remove read from what is present (§4.1), a fresh `SIP-ETag` on every acceptance (§6 step 6), and 412 for a tag the compositor does not hold (§6 step 3) — including one whose state expired, which must not be accepted as a new publication. Expiry is judged on the clock rather than on whether a sweep has run, so the answer is not a race. Composition policy is deliberately absent: a second publication for one presentity replaces the first, and merging several publishers is a policy question for whoever has one."

[[rfc]]
number = 3856
title = "A Presence Event Package for SIP"
layer = "services"
status = "partial"
roles = ["uas"]
evidence = ["crates/sipx-ua/src/presence.rs"]
note = "The `presence` package serves PIDF documents published through RFC 3903. Watcher information (RFC 3857) and the `presence.winfo` template are not implemented."

[[rfc]]
number = 3863
title = "Presence Information Data Format (PIDF)"
layer = "services"
status = "implemented"
evidence = ["crates/sipx-ua/src/presence.rs"]
note = "A typed document rather than a string template: tuples with an id, a `basic` status of open or closed, an optional contact with a priority clamped to §4.1.4's range, and an optional note. XML metacharacters are escaped, because one unescaped `&` in a SIP URI makes the whole document unparseable and a watcher then sees nothing at all. RFC 4480's richer vocabulary is a different document and is not implemented."

[[rfc]]
number = 3680
title = "A SIP Event Package for Registrations"
layer = "services"
status = "partial"
roles = ["uas"]
evidence = ["crates/sipx-ua/src/packages.rs"]
note = "`reginfo` documents with per-contact state and the event that changed it — registered, refreshed, expired, unregistered, with the last two kept apart because why a contact went is what a display says. Same limit as 4235: the documents exist, the join to a live registrar does not, and sipx is not a registrar."

[[rfc]]
number = 4235
title = "An INVITE-Initiated Dialog Event Package for SIP"
layer = "services"
status = "partial"
roles = ["uas"]
evidence = ["crates/sipx-ua/src/packages.rs"]
note = "`dialog-info` documents with the five states of §3.7.1, the full-then-partial discipline of §4.1, and a version counter scoped per subscription rather than per resource. What is not here is the join to a live dialog store — the package produces documents, and wiring them to running calls is the application's, because a package reaching into the call layer would reverse the workspace's dependency direction."

[[rfc]]
number = 5627
title = "Obtaining and Using GRUUs in SIP"
layer = "services"
status = "partial"
roles = ["uac", "uas"]
evidence = [
  "crates/sipx-sip/src/gruu.rs",
  "crates/sipx-ua/src/gruu.rs",
  "crates/sipx-ua/src/registrar.rs",
  "crates/sipx-ua/tests/gruu.rs",
]
note = "The UA side, for both roles: `Supported: gruu` and `+sip.instance` on REGISTER (§4.1) under the same instance identity RFC 5626 registers with, `pub-gruu` and `temp-gruu` read off the binding that names this instance and discarded with it (§4.2), a GRUU in the Contact of dialog-forming and target-refresh requests (§4.4), and §4.5's `gr` recognition — which is a comparison of its own because §5.4 notes a public GRUU is URI-equivalent to the AOR. The choice between public and temporary is the application's and asking for a temporary one never silently yields the public one, since §5.4's unlinkability is not something the other can stand in for. **Not the registrar role**: minting GRUUs, the temporary-GRUU construction of §5.4 and the 480 of §5.2 are §5's, and sipx is not a registrar."

[[rfc]]
