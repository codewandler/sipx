evidence = ["crates/sipx-rtp/src/packet.rs", "crates/sipx-rtp/src/rtcp.rs"]
note = "RTP and RTCP, including sender and receiver reports and the §A.8 interarrival jitter recurrence — which is not a variance, and is usually implemented as one."

[[rfc]]
number = 3551
title = "RTP Profile for Audio and Video Conferences"
layer = "media"
status = "partial"
evidence = ["crates/sipx-media/src/session.rs"]
note = "The static payload types sipx carries: 0 and 8. The rest of the profile is not implemented."

[[rfc]]
number = 4733
title = "RTP Payload for DTMF Digits, Telephony Tones, and Telephony Signals"
layer = "media"
status = "implemented"
evidence = ["crates/sipx-rtp/src/dtmf.rs"]
