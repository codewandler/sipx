layer = "transport"
status = "implemented"
roles = ["uac"]
evidence = ["crates/sipx-transport/src/resolve.rs", "crates/sipx-transport/src/dns.rs"]
note = "NAPTR, SRV and A/AAAA, with the candidate list tried in order. The verification name survives resolution."

[[rfc]]
number = 2782
title = "A DNS RR for specifying the location of services (SRV)"
layer = "transport"
status = "implemented"
evidence = ["crates/sipx-transport/src/resolve.rs"]
