[[rfc]]
number = 5923
title = "Connection Reuse in SIP"
layer = "transport"
status = "partial"
evidence = ["crates/sipx-transport/src/tcp.rs"]
note = "A response returns over the connection its request arrived on, and the pool distinguishes inbound from outbound. The `alias` parameter is not implemented."

[[rfc]]
number = 7118
title = "The WebSocket Protocol as a Transport for SIP"
layer = "transport"
status = "implemented"
roles = ["uac", "uas"]
evidence = [
  "crates/sipx-transport/src/ws.rs",
  "crates/sipx-transport/tests/ws.rs",
  "crates/sipx-call/tests/wss.rs",
  "crates/sipx-call/examples/browser_audio_proof.rs",
  "crates/sipx-cli/src/signalling.rs",
  "crates/sipx-cli/tests/cli.rs",
]
note = "Subprotocol negotiation, one message per frame, and the invented sent-by. A target names the resource the handshake asks for, since RFC 7118 fixes neither that nor the port. Both roles reach it on live calls: `wss.rs` runs INVITE, 200, ACK, audio and BYE with every SIP message inside a WebSocket frame inside TLS; `P-8` additionally selects WS and WSS through the shipped diagnostic phone and proves both commands over real sockets. The browser-audio proof repeats both roles over authenticated WSS against a native browser, including dialing back over the browser's exact authenticated inbound connection."

[[rfc]]
number = 9000
title = "QUIC: A UDP-Based Multiplexed and Secure Transport"
layer = "transport"
status = "implemented"
evidence = ["crates/sipx-transport/src/quic.rs", "crates/sipx-transport/tests/quic.rs"]
note = "QUIC v1 through quinn: authenticated connections, bounded bidirectional streams, migration and transport PING. The SIP mapping itself is experimental and specified by sipx because no RFC defines SIP over QUIC; bare-peer vectors check its stream framing rather than trusting two sipx endpoints to agree."

[[rfc]]
number = 9001
title = "Using TLS to Secure QUIC"
layer = "security"
status = "implemented"
evidence = [
  "crates/sipx-transport/src/tls.rs",
  "crates/sipx-transport/src/quic.rs",
  "crates/sipx-transport/tests/quic.rs",
]
note = "QUIC reuses the one rustls certificate policy used by TLS and WSS, requires ALPN `sip/2`, and configures both ends to refuse 0-RTT request data. Tests distinguish wrong host, unknown issuer and wrong/no ALPN before any SIP is delivered."

[[rfc]]
number = 6455
title = "The WebSocket Protocol"
layer = "transport"
status = "implemented"
evidence = ["crates/sipx-transport/src/ws.rs"]
note = "Through `tokio-tungstenite`. sipx owns the subprotocol negotiation and the framing rules that RFC 7118 layers on top."

[[rfc]]
number = 5389
title = "Session Traversal Utilities for NAT (STUN)"
layer = "transport"
status = "partial"
roles = ["uac"]
evidence = ["crates/sipx-transport/src/stun.rs"]
note = "A Binding client, as much as RFC 5626 §4.4.2's keep-alive needs: a request with no attributes, and a response read for XOR-MAPPED-ADDRESS. Decoding is verified against the vectors RFC 5769 publishes, including the padded attribute that trips a decoder ignoring §15's alignment rule. No MESSAGE-INTEGRITY, no FINGERPRINT, no credentials, and no server role — ICE (RFC 8445) needs the full protocol, not more attributes on this."

[[rfc]]
number = 5626
title = "Managing Client-Initiated Connections in SIP (Outbound)"
layer = "transport"
status = "partial"
roles = ["uac"]
headers = ["FlowTimer"]
evidence = [
  "crates/sipx-ua/src/outbound.rs",
  "crates/sipx-ua/src/flows.rs",
  "crates/sipx-transport/src/stun.rs",
  "crates/sipx-ua/tests/outbound.rs",
  "crates/sipx-transport/tests/keepalive.rs",
  "crates/sipx-cli/src/register.rs",
  "crates/sipx-cli/tests/cli.rs",
]
note = "Reachable since `S-29`, **and only in part**: `sipx register --outbound` builds the config, so a REGISTER carries `+sip.instance` (§4.1) and `reg-id` (§4.2), offers the `outbound` option tag, and the command reports whether the registrar accepted the flow — `Require: outbound` on the 2xx read as acceptance (§6). That registration is the whole of what has a caller above `sipx-ua`, and it is all this row's `uac` claims; the row `X-37` demoted for having no caller has one for exactly that much. Implemented and tested inside the crate but **still reached by nothing above it**: `ob` on a dialog-forming Contact (§4.3, `UserAgent::dialog_contact`); §4.4's keep-alives — CRLF for connection-oriented flows, STUN Binding for UDP, including §4.4.2's rule that a changed reflexive address is a failed flow (`UserAgent::keepalive_after`); and one registration per outbound proxy with each flow failing independently under §4.5's backoff (`Flows`, `Attempt`). The CLI registers exactly one flow per invocation, so that last half has no caller by construction rather than by oversight — holding a flow open across a long-lived registration is the keep-alive loop's question, which `S-29` left open. Not implemented at all: the *registrar* side (flow tokens in Path, §5), which is what makes the mechanism useful to the network rather than to the client."

[[rfc]]
number = 3327
title = "SIP Extension Header Field for Registering Non-Adjacent Contacts (Path)"
layer = "transport"
status = "implemented"
headers = ["Path"]
evidence = [
  "crates/sipx-sip/src/headers/address.rs",
  "crates/sipx-ua/src/registrar.rs",
]
note = "Parsed with route-header list semantics, offered as `Supported: path` on every REGISTER, and the returned path vector kept with the binding. Not turned into a route set for outbound requests: §5.1 says a UA ignores it, and `Service-Route` (RFC 3608) is the header for that."

[[rfc]]
number = 3608
title = "SIP Extension Header Field for Service Route Discovery During Registration"
layer = "transport"
status = "implemented"
headers = ["ServiceRoute"]
evidence = [
  "crates/sipx-sip/src/headers/address.rs",
  "crates/sipx-ua/src/registrar.rs",
  "crates/sipx-call/tests/service_route.rs",
]
note = "Parsed with route-header list semantics and order preserved (§6.1), stored against the registration and replaced on every 2xx — so a response with no Service-Route clears it, which is what §6.1 requires. Exercised as a pre-loaded Route set on outgoing initial requests via `DialOptions::with_service_route`, not attached behind the caller's back. A hop missing the `;lr` §5 requires is reported rather than dropped."

[[rfc]]
number = 8599
title = "Push Notification with SIP"
layer = "transport"
status = "partial"
roles = ["uac"]
headers = ["FeatureCaps"]
evidence = [
  "crates/sipx-sip/src/push.rs",
  "crates/sipx-ua/src/push.rs",
  "crates/sipx-ua/src/registrar.rs",
  "crates/sipx-ua/tests/push.rs",
  "crates/sipx-cli/src/register.rs",
  "crates/sipx-cli/tests/cli.rs",
]
note = "Reachable since `S-29`: `sipx register --push-provider … --push-prid …` puts the §4.1.2 parameters on the `Contact` URI and reports whether the registrar named the same service (§8.2), and `--wake` drives `UserAgent::woken` — the row `X-37` demoted for having no caller has one. The UA half only. `pn-provider`, `pn-param` and `pn-prid` go on the REGISTER's `Contact` as the URI parameters §8.7 registers them as; the `sip.pns`, `sip.pnsreg` and `sip.pnspurr` feature-capability indicators (§8.2) are read out of `Feature-Caps` (RFC 6809 §4) so a client can tell whether the registrar supports the push service it named; 555 (§8.1) is surfaced as its own outcome rather than a generic failure; and a push leads to §4.1.3's binding-refresh REGISTER *before* the pending request is expected — `UserAgent::woken` is that ordering as a type. The push service itself is a trait sipx ships no implementation of, and `pn-purr` is read and carried but not matched against stored bindings — matching is for the party that stores them, which is §5.6's proxy role and not played here. **Not the registrar or proxy half**: minting the PURR (§4.2), the push-bucket hold of §5.6, and sending the push itself are out of scope."

[[rfc]]
number = 7339
title = "SIP Overload Control"
layer = "transport"
status = "partial"
roles = ["uac", "uas"]
headers = ["Via"]
spec = "docs/specs/sip-transport.md"
evidence = [
  "crates/sipx-sip/src/headers/via.rs",
  "crates/sipx-transport/src/overload.rs",
  "crates/sipx-transport/tests/overload.rs",
  "crates/sipx-transport/tests/backpressure.rs",
]
note = "The UAC behavior is explicit through `Config::overload.advertise`, off by default because RFC 7339 §2 scopes the requirements to entities supporting the extension. Once enabled it advertises `loss,rate` on every request, accepts feedback only from responses matched to its live client transactions, keeps sequenced per-peer validity state within a configured finite LRU bound, applies seeded loss control with a local two-category policy hook, and rejects locally with a counter; a finite count/concurrency/cleanup load witness drives that endpoint path. The UAS selects an offered algorithm on every response, including transaction-generated 100 Trying, reports explicit control-off state normally, and retains active feedback on queue-full 503 and application responses for the detector's stated lifetime. Missing: recognition of `oc-seq` wraparound and a load estimator beyond the bounded queue's concrete overload signal."

[[rfc]]
number = 7415
title = "SIP Rate Control"
layer = "transport"
status = "partial"
roles = ["uac", "uas"]
headers = ["Via"]
spec = "docs/specs/sip-transport.md"
evidence = [
  "crates/sipx-transport/src/overload.rs",
  "crates/sipx-transport/tests/overload.rs",
]
note = "With `Config::overload.advertise` enabled, the UAC offers and obeys `rate` with the RFC leaky bucket, driver-supplied time, and configurable `TAU1`/`TAU2` thresholds that preserve protected traffic after ordinary traffic is blocked; the UAS can report a configured requests-per-second limit from its queue-overload path. Missing: autonomous periodic server rate estimation/allocation and the optional randomized rate algorithm."

# ---------------------------------------------------------------------------------------------
# Core: transactions, dialogs, negotiation
# ---------------------------------------------------------------------------------------------

[[rfc]]
number = 6026
title = "Correct Transaction Handling for 2xx Responses to INVITE"
layer = "core"
status = "implemented"
roles = ["uac", "uas"]
evidence = ["crates/sipx-sip/src/transaction/client.rs", "crates/sipx-sip/src/transaction/server.rs"]
note = "The Accepted state. Without this a 2xx retransmission is absorbed by a transaction that should already have ended."

[[rfc]]
number = 2543
title = "SIP: Session Initiation Protocol (obsoleted by 3261)"
layer = "core"
status = "partial"
evidence = ["crates/sipx-sip/src/transaction/key.rs"]
note = "Not implemented as a protocol. The transaction key falls back to 2543-style matching when a branch lacks the magic cookie. Server-side that is for requests that still arrive from such senders; client-side it is only reachable by an application that supplies its own cookieless `Via`, since the transport brands ours with `z9hG4bK`. The two fall back differently, as RFC 3261 §17.2.3 and §17.1.3 do: the client key drops the Request-URI and the `To` tag, which a response cannot reproduce, so a legacy client transaction matches its own responses instead of hanging until Timer F."

[[rfc]]
number = 3264
title = "An Offer/Answer Model with SDP"
layer = "core"
status = "implemented"
roles = ["uac", "uas"]
evidence = [
  "crates/sipx-sdp/src/answer.rs",
  "crates/sipx-call/src/call/offer_answer.rs",
  "crates/sipx-call/tests/call.rs",
  "docs/specs/call-initial-offer.md",
]
note = "A pure function from offer and capabilities to answer. The offerer's format order is preserved, which is what stops two endpoints transcoding for no reason — and the set the application selected is applied *during* that walk rather than to its result, so an offer leading with a codec sipx was not asked to use settles further down the list instead of failing (`M-30`). §6.1's answered format list and the codec the media session is actually built with are held to agree by a table of offers rather than by a comment saying they must (`M-31`): the payload type negotiation settles on has to appear in the answer, and a stream negotiation refuses has to be one the answer rejected with port 0. An initial offer for which every media stream is rejected does not establish an empty call: the answerer sends 488 through the INVITE transaction and preserves `NoCommonCodec` locally. `docs/specs/sdp-format-identity.md` §4.4 states the format property, and `docs/specs/call-initial-offer.md` states the initial-call refusal boundary."

[[rfc]]
number = 3262
title = "Reliability of Provisional Responses in SIP (100rel)"
layer = "core"
status = "implemented"
headers = ["RAck", "RSeq"]
evidence = [
  "crates/sipx-sip/src/rel.rs",
  "crates/sipx-call/src/rel.rs",
  "crates/sipx-call/tests/reliable_provisional.rs",
]
note = "Offered in Supported, honoured in Require. A reliable provisional carries RSeq and is retransmitted from T1 with no T2 cap until PRACK or 64*T1; PRACK carries RAck and is answered 2xx, or 481 when it matches nothing. A peer that requires 100rel while it is off gets 420 with Unsupported. An offer arriving in the provisional is answered in the PRACK, and an offer arriving in the INVITE may be answered in the provisional (ring_early), which is what makes an early-dialog renegotiation by UPDATE legal."

[[rfc]]
number = 3960
title = "Early Media and Ringing Tone Generation in SIP"
layer = "media"
status = "partial"
roles = ["uac", "uas"]
spec = "docs/specs/call-early-media.md"
evidence = [
  "crates/sipx-call/src/call/mod.rs",
  "crates/sipx-call/src/rel.rs",
  "crates/sipx-call/tests/reliable_provisional.rs",
]
note = "The §3 gateway model is implemented in both roles: a reliable provisional completes the INVITE's offer/answer, starts bidirectional media on the early dialog, signals the application to replace its local ringing tone, and hands that same running session to the confirmed call. A refusal or abandoned branch drops its session. Partial because §3.1's selection among simultaneous forked early streams remains application policy and the §4 application-server model / RFC 3959 early-session disposition is not implemented."

[[rfc]]
number = 3311
title = "The SIP UPDATE Method"
layer = "core"
status = "implemented"
roles = ["uac", "uas"]
methods = ["UPDATE"]
headers = ["Allow", "RetryAfter"]
evidence = [
  "crates/sipx-sip/src/update.rs",
  "crates/sipx-call/src/update.rs",
  "crates/sipx-call/src/rel.rs",
  "crates/sipx-call/src/call/reinvite.rs",
  "crates/sipx-call/src/call/hold.rs",
  "crates/sipx-call/tests/update.rs",
  "crates/sipx-call/tests/dispatch.rs",
]
note = "Sent and received by both roles, in an early dialog and a confirmed one — §5.1's 'either caller or callee'. Naming the roles is deliberate: until S-22 this note opened in the passive voice and so claimed for both ends something only the answering end could do, because the caller's early dialog was unreachable. The answering side sends and receives through ring_early and Ringing; the calling side through dial_early and Dialing, which hands back the early dialog instead of consuming it inside dial. Both run one implementation of §5.1 and §5.2 (sipx-call's update::offer and update::receive), so the two roles cannot drift apart. Allow lists UPDATE on the INVITE, its provisional and 2xx responses, and on in-dialog requests (§4). §5.2's three refusals are three answers: 500 with a random Retry-After for a second UPDATE before the first is answered, 491 for glare, 500 with Retry-After when an answer is owed; an unusable description is 488 and the dialog survives. All three have wire tests: the first two are reached through a per-call inbox holding the peer's next request while an exchange of ours was abandoned part-way, which is what C-4's dispatcher makes ordinary. An early dialog is renegotiable only after the INVITE offer is answered in a reliable provisional (RFC 3262 §5) — ring_early does that as UAS, and as UAC Dialing adopts an answer only out of a reliable provisional and reports it as has_early_session."

[[rfc]]
number = 4028
title = "Session Timers in SIP"
layer = "core"
status = "implemented"
headers = ["SessionExpires", "MinSe"]
evidence = [
  "crates/sipx-sip/src/session.rs",
  "crates/sipx-call/src/call/timers.rs",
  "crates/sipx-call/src/snapshot.rs",
  "crates/sipx-call/tests/dialog_persistence.rs",
  "crates/sipx-call/tests/session_timer.rs",
]
note = "Negotiated on the INVITE and its 2xx, Table 2 election, 422 with Min-SE below the floor, and a local BYE when no refresh arrives. The refresh is an UPDATE with no body when the peer's Allow lists the method and a re-INVITE otherwise (§7.4). A durable confirmed-dialog snapshot retains only the remaining duration; restore rebases a positive remainder on explicit fresh time, surfaces a due refresh or expiry when it is zero, and rejects contradictory or overflowing values rather than silently renewing the interval."

[[rfc]]
number = 6665
title = "SIP-Specific Event Notification"
layer = "core"
status = "partial"
roles = ["uac", "uas"]
headers = ["Event", "SubscriptionState", "AllowEvents"]
evidence = [
  "crates/sipx-sip/src/event.rs",
  "crates/sipx-ua/src/subscribe.rs",
  "crates/sipx-call/src/notifier.rs",
  "crates/sipx-call/tests/notifier.rs",
  "crates/sipx-ua/src/event_client.rs",
