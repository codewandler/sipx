[[rfc]]
number = 8866
title = "SDP: Session Description Protocol"
layer = "media"
status = "implemented"
evidence = [
  "crates/sipx-sdp/src/parse.rs",
  "crates/sipx-sdp/src/session.rs",
  "crates/sipx-sdp/src/rtpmap.rs",
  "crates/sipx-call/src/call/offer_answer.rs",
]
note = "A real AST with round-tripping, rather than string manipulation over the body. Every call goes through it: `call.rs` builds the offer and parses and answers the peer's, on the INVITE, on a re-INVITE and on an UPDATE. §6.6's `a=rtpmap` is read in exactly one place (`rtpmap.rs`), which decides format identity once — the encoding name case-insensitively, the clock rate and the channel count **by value**, with an omitted channel count meaning one. It was decided twice until `M-31`, textually where the answer was built and numerically where the codec was chosen, so an offer carrying `a=rtpmap:0 PCMU/08000` was answered A-law and then played back through µ-law: audible garbage rather than silence, with nothing reporting an error. A clock rate that is empty, is not a decimal digit string, or overflows a `u32` is a typed error and a non-match, never a panic. `docs/specs/sdp-format-identity.md` is normative for the rule and lists the vectors."

