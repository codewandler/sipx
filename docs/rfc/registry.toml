[[rfc]]
number = 6716
title = "Definition of the Opus Audio Codec"
layer = "media"
status = "implemented"
evidence = ["crates/sipx-audio/src/opus.rs"]
note = "Behind the `opus` feature, off by default because it links a C library."

[[rfc]]
number = 7587
title = "RTP Payload Format for the Opus Speech and Audio Codec"
layer = "media"
status = "implemented"
evidence = ["crates/sipx-audio/src/opus.rs", "crates/sipx-media/tests/opus.rs"]
