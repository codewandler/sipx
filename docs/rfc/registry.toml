  "crates/sipx-call/src/call/offer_answer.rs",
  "crates/sipx-call/examples/browser_audio_proof.rs",
  "tests/browser-audio/peer.js",
]
note = "Both initial-call roles offer, answer and act on media-level `a=rtcp-mux`. Agreement gives one socket owner and one ICE component that classify RTP/SRTP from RTCP/SRTCP before cryptographic processing, and reports leave from and return to the RTP port. An initial ICE offer may retain component 2 and an explicit `a=rtcp` destination for fallback; a mux answer emits component 1 alone. The named browser profile likewise accepts a bounded component-2 fallback in a remote initial offer, discards it before ICE checklist construction, and proves that protected media still uses one nominated component; a mux answer carrying component 2 remains a refusal. Payload types 64 through 95 are refused, rejected media cannot settle mux, and an in-dialog mode change is a typed refusal before ICE or media state changes. Partial because SIP forking's simultaneous mux/non-mux branches, multicast modes and header-compression interactions are not implemented."

[[rfc]]
number = 5764
title = "DTLS Extension to Establish Keys for SRTP"
layer = "media"
status = "partial"
spec = "docs/specs/srtp.md"
roles = ["uac", "uas"]
evidence = [
  "crates/sipx-media/src/dtls/mod.rs",
  "crates/sipx-media/src/dtls/openssl.rs",
  "crates/sipx-media/tests/dtls_srtp.rs",
  "crates/sipx-call/src/call/mod.rs",
  "crates/sipx-call/tests/secure_media.rs",
  "crates/sipx-cli/src/media.rs",
  "crates/sipx-cli/tests/cli.rs",
  "crates/sipx-cli/tests/interop_srtp.rs",
  "crates/sipx-call/examples/browser_audio_proof.rs",
]
note = "Both call roles are reachable when the application explicitly selects `Keying::DtlsSrtp` and the off-by-default `dtls` feature supplies OpenSSL. The diagnostic phone maps `--media-security dtls-srtp` to that policy for dial and answer, reports the negotiated keying from the running calls, and carries audio between the two command processes; a build without the feature refuses before signalling and never substitutes SDES or cleartext. The initial offer and answer carry `UDP/TLS/RTP/SAVP`, a fresh certificate fingerprint and the negotiated setup role; the final response and UAC ACK leave before the handshake begins. The verified exporter output reaches `Config::srtp` on the same bound media socket, and a live call test carries encrypted audio in both roles. The browser-audio profile composes ICE and DTLS-SRTP on one nominated component; the native-browser proof observes DTLS and SRTP in both roles and changes one signalled fingerprint while retaining the real certificate to prove that mismatch installs no usable media path. The separate independent-peer case is `interop_srtp.rs`. `M-41` widened the `use_srtp` list to the three profiles `sipx-rtp` can key — `SRTP_AEAD_AES_256_GCM` (0x0008), `SRTP_AEAD_AES_128_GCM` (0x0007) and `SRTP_AES128_CM_SHA1_80` (0x0001) — strongest first, with the mandatory-to-implement counter-mode profile kept as the floor rather than dropped. The list is derived from the transform enum rather than written out, the exporter length follows the negotiated profile, and the negotiated transform travels into the session with the keys instead of being inferred there. Partial: reliable early media and rekeying remain refused rather than downgraded, and the counter-mode profile name is still OpenSSL's spelling rather than the registry's (`docs/specs/srtp.md` §12.4)."

[[rfc]]
number = 7714
title = "AES-GCM Authenticated Encryption in SRTP"
layer = "media"
status = "partial"
spec = "docs/specs/srtp.md"
roles = ["uac", "uas"]
evidence = [
  "crates/sipx-rtp/src/srtp/mod.rs",
  "crates/sipx-rtp/src/srtp/rfc7714_vectors.rs",
  "crates/sipx-sdp/src/crypto.rs",
  "crates/sipx-sdp/tests/srtp_negotiation.rs",
  "crates/sipx-media/src/dtls/mod.rs",
  "crates/sipx-media/tests/srtp.rs",
  "crates/sipx-call/src/call/offer_answer.rs",
  "crates/sipx-call/tests/secure_media.rs",
  "crates/sipx-testkit/corpus/rfc7714/rtp-vectors.txt",
  "scripts/import-rfc7714-corpus.sh",
]
note = "The AEAD profiles `AEAD_AES_128_GCM` and `AEAD_AES_256_GCM`, for RTP and RTCP, on both keying paths. §8.1's SRTP IV and §9.1's SRTCP IV are formed from the packet rather than drawn, §8.2's associated-data boundary is the RTP header through any extension, and §9.2's SRTCP layout — cipher first, ESRTCP word last — is implemented as the RFC states it rather than as RFC 3711 §3.4 orders the same fields. §9.3's unencrypted form is read but never sent. The transform is checked against §16 and §17's own vectors, which are **recovered from the RFC** by `scripts/import-rfc7714-corpus.sh` rather than transcribed: it slices the two sections out of the RFC editor's text into `crates/sipx-testkit/corpus/rfc7714/`, and its `--check` mode is a gate step that re-slices and diffs, so a fixture edited to agree with a disagreeing implementation fails before a story can be called done. §14.1's SDES crypto-suite names and §14.2's DTLS-SRTP profiles and identifiers are both carried, ordered strongest first, and selection is by strength rather than by the order a peer listed them in. §12's requirement that an implementation support both key sizes is met. §13.2's 16-octet tag is not truncated. **Partial**, for two things §11 asks for and nothing published can check: the RFC gives no key-derivation vector, so the 96-bit master salt's alignment in the AES_CM PRF input block rests on a reading recorded in `docs/specs/srtp.md` §4.3 and §12.10 rather than on a number, and RFC 6904 header-extension encryption (§8.3) is not implemented under any profile."

[[rfc]]
number = 5763
title = "Framework for Establishing an SRTP Security Context Using DTLS"
layer = "media"
status = "partial"
spec = "docs/specs/srtp.md"
roles = ["uac", "uas"]
evidence = [
  "crates/sipx-sdp/src/answer.rs",
  "crates/sipx-media/src/dtls/mod.rs",
  "crates/sipx-call/src/call/mod.rs",
  "crates/sipx-call/tests/secure_media.rs",
  "crates/sipx-cli/src/media.rs",
  "crates/sipx-cli/tests/cli.rs",
]
note = "Both initial-call roles are implemented. `Keying::DtlsSrtp` is an explicit dial or answer policy, and the diagnostic phone selects it through `--media-security dtls-srtp` in both roles, reports the negotiated result and carries audio between command processes. It emits `UDP/TLS/RTP/SAVP`, `a=fingerprint` and `a=setup`, and retains the matching identity through the handshake. The offerer sends actpass; the answerer prefers active but may select passive from its typed capabilities, and the offerer refuses a missing, unresolved or locally unsupported answer role before starting the complementary handshake. Media-level setup overrides the session-level default in both signalling and the actual handshake. A DTLS `holdconn` offer is a typed refusal before binding or gathering. The answer leaves before an active answerer starts, and the offerer begins only after ACK. A build without the optional handshake feature refuses the selection before signalling and never substitutes SDES or cleartext. Partial because reliable early media and rekeying are not offered through this mechanism."

[[rfc]]
number = 8122
title = "Connection-Oriented Media Transport over TLS in SDP"
layer = "media"
status = "partial"
spec = "docs/specs/srtp.md"
roles = ["uac", "uas"]
evidence = [
  "crates/sipx-sdp/src/fingerprint.rs",
  "crates/sipx-media/src/dtls/mod.rs",
  "crates/sipx-call/src/call/mod.rs",
  "crates/sipx-call/tests/secure_media.rs",
]
note = "Both initial-call roles emit and consume SHA-256 certificate fingerprints through explicit DTLS-SRTP policy, and §6.2's certificate comparison completes before exported keys reach a media session. A mismatch yields no keys. Media- and session-level attributes, digest-length validation, uppercase generation and MD5/MD2 refusal remain covered below the call layer. Partial because this stack implements the fingerprint for UDP DTLS-SRTP, not the connection-oriented TLS media transport named by the RFC title, and early-media DTLS is not exposed."

[[rfc]]
number = 4145
title = "TCP-Based Media Transport in SDP"
layer = "media"
status = "partial"
evidence = ["crates/sipx-sdp/src/fingerprint.rs", "crates/sipx-call/src/call/mod.rs"]
note = "`a=setup` is emitted and acted on by initial DTLS-SRTP calls at media or session level: the offer says actpass, the answer prefers active or selects passive when that is the role available, and the offerer takes the complementary role. Missing, unresolved and locally unsupported answer roles are typed refusals before the handshake; a DTLS `holdconn` offer is refused before answer resources are acquired. The selected role decides which side sends ClientHello and which exporter half protects outbound media. The `a=connection` attribute and TCP media transport itself are not implemented: sipx carries media over UDP."

[[rfc]]
number = 8445
title = "Interactive Connectivity Establishment (ICE)"
layer = "media"
status = "partial"
roles = ["uac", "uas"]
evidence = [
  "crates/sipx-media/src/ice/agent.rs",
  "crates/sipx-media/src/ice/checklist.rs",
  "crates/sipx-media/src/ice/candidate.rs",
  "crates/sipx-media/src/ice/stun.rs",
  "crates/sipx-media/src/ice/gather.rs",
  "crates/sipx-media/src/ice/driver.rs",
  "crates/sipx-media/tests/ice.rs",
  "crates/sipx-call/src/call/ice.rs",
  "crates/sipx-call/tests/ice_call.rs",
  "crates/sipx-cli/src/media.rs",
  "crates/sipx-cli/tests/cli.rs",
  "crates/sipx-call/examples/browser_audio_proof.rs",
  "crates/sipx-sdp/tests/browser_audio_profile.rs",
  "tests/browser-audio/driver.py",
]
note = "Both call roles are reachable through `sipx_call::MediaPolicy`: an application can select host gathering or configure a STUN server for server-reflexive gathering, while the default selects no ICE and preserves symmetric RTP. The diagnostic phone exposes the same choices as `--ice disabled`, `--ice host` and `--ice stun`; its STUN process test makes both host/default destinations unusable, carries audio on the nominated server-reflexive pair and reports that selected path from each running call. The initial offer/answer path gathers on the media port, emits fresh credentials and candidates, accepts the peer description and starts the session with the resulting agent. `ice_call.rs` independently makes both SDP default destinations unusable and proves audio crosses the lower-priority candidate pair only after nomination; it also proves an unavailable configured STUN server degrades to host candidates. The native-browser proof independently observes the same nominated component from browser statistics and sipx, cross-checks the endpoints in reverse, and closes a complete browser answer before nomination to prove the typed no-pair refusal starts neither DTLS nor RTP. Its compatibility case adds a bounded component-2 fallback to the initial offer and requires the selected pair, DTLS keys and protected audio to remain component 1; the unused line is filtered before the answering call constructs the agent's remote description. The underlying full agent implements host and server-reflexive gathering (§5.1.1), §5.1.2.1 priorities and §5.1.1.3 foundations, checklists with §6.1.2.6 freezing and §6.1.2.5's limit, §7 checks over a STUN profile anchored to RFC 5769's bytes, §7.3.1.1 role conflict, regular nomination (§8.1.1), and §11 keepalives on selected pairs. §9's restart is reached from a call (`M-23`): `Call::restart_ice` offers one, a peer's is recognised from its two credentials changing, and both rebuild the checklists with a fresh tiebreaker while the previously selected pair keeps carrying media. A restart re-signals the sockets the session is already running on and does not re-run the STUN transaction — `docs/specs/ice.md` §13.5 records why and what that does not recover. Not implemented: relayed candidates and TURN (`M-24`), and the lite role (§2.2, §6.2, §8.2); interoperating with a lite peer is implemented. Aggressive nomination is deprecated by §4 and deliberately absent."

[[rfc]]
number = 8839
title = "SDP Offer/Answer Procedures for ICE"
layer = "media"
status = "partial"
roles = ["uac", "uas"]
evidence = [
  "crates/sipx-sdp/src/ice.rs",
  "crates/sipx-media/src/ice/negotiate.rs",
  "crates/sipx-media/src/ice/gather.rs",
  "crates/sipx-media/tests/ice.rs",
  "crates/sipx-call/src/call/ice.rs",
  "crates/sipx-call/tests/ice_call.rs",
  "crates/sipx-cli/src/media.rs",
  "crates/sipx-cli/tests/cli.rs",
  "crates/sipx-call/examples/browser_audio_proof.rs",
  "crates/sipx-sdp/tests/browser_audio_profile.rs",
  "tests/browser-audio/peer.js",
]
note = "Both initial-exchange roles are reachable from a call and from the diagnostic phone's direct mapping of `--ice` into that call policy. Its real-process STUN vector drives both offer/answer roles, makes the host/default paths unusable, carries audio on a nominated server-reflexive pair and reports the selected path rather than the requested policy. `MediaPolicy` selected on `DialOptions`, the free answer functions, dispatcher invitations and reliable early answers emits §4.2 credentials, candidates, `ice2` and the highest-priority default destination; it then feeds the peer's answer or offer back into the retained media-port agent. When a muxed initial offer contains a component-2 fallback but the answerer owns component 1 only, the named browser profile bounds and discards that unused line before agent construction; the component-one candidate remains required. A peer offering no candidate gets no ICE attributes, checks or timers and uses symmetric RTP (§6), which remains the default. §5's attribute grammar covers `candidate`, `remote-candidates`, `ice-ufrag`, `ice-pwd`, `ice-pacing`, `ice-options`, `ice-lite` and `ice-mismatch`, with the §5.1 priority range checked on parse. §5.3 mismatch is reported in an answer and falls back to RFC 3264. §4.4 is implemented for later exchanges (`M-23`): a stream doing ICE restates its half in every subsequent offer and answer — hold, resume, codec change, session refresh — and §4.4.1.1.1's restart is both generated and detected from **both** credentials changing. Hold stays `a=sendonly`/`a=inactive` and never `c=0.0.0.0`, which §4.4.1.1.1 would read as a restart. Not implemented: `remote-candidates` is parsed but not generated for a Completed stream (§5.2). Trickle ICE (RFC 8838/8840) is a separate offer/answer model and is out of scope."

[[rfc]]
number = 7874
title = "WebRTC Audio Codec and Processing Requirements"
layer = "media"
status = "partial"
roles = ["uac", "uas"]
spec = "docs/specs/webrtc-audio.md"
evidence = [
