[[rfc]]
number = 6086
title = "SIP INFO Method and Package Framework"
layer = "services"
status = "partial"
roles = ["uac", "uas"]
methods = ["INFO"]
evidence = ["crates/sipx-sip/src/message.rs", "crates/sipx-call/src/extension.rs", "crates/sipx-call/src/call/mod.rs"]
note = "Applications can send and answer bounded INFO requests inside an established dialog, including a bounded digest-authentication retry. INFO package negotiation and package semantics remain application policy; sipx sends DTMF as RFC 4733 rather than as INFO."

[[rfc]]
number = 3903
title = "SIP Extension for Event State Publication"
layer = "services"
status = "implemented"
roles = ["uac", "uas"]
methods = ["PUBLISH"]
headers = ["SipETag", "SipIfMatch"]
evidence = ["crates/sipx-sip/src/name.rs", "crates/sipx-ua/src/presence.rs", "crates/sipx-ua/src/publication_client.rs", "crates/sipx-ua/tests/publication_client.rs", "crates/sipx-call/src/publication.rs", "crates/sipx-call/tests/publication.rs"]
spec = "docs/specs/publication-endpoint.md"
note = "Live UAC and UAS endpoint paths implement bounded RFC 3903 publication soft state. Inbound PUBLISH uses an injected authorization policy and the exact compositor allocation; every accepted create, refresh, modify or remove returns a fresh `SIP-ETag`, stale or cross-resource conditions return 412, and interval policy returns 423. The public outbound publisher retains each granted expiry and fresh entity tag across authenticated conditional operations, never retries 412, and exposes typed terminal state and owned-work counts. Publication is intentionally not a dialog, and applications still own durable or distributed storage, identity policy and projection of published presence into later NOTIFY documents. The dispatcher handles PUBLISH when this service is attached but does not use that optional attachment to change its static OPTIONS advertisement."

[[rfc]]
number = 3856
title = "A Presence Event Package for SIP"
layer = "services"
status = "partial"
roles = ["uas"]
evidence = ["crates/sipx-ua/src/presence.rs", "crates/sipx-call/src/notifier.rs", "crates/sipx-call/tests/notifier.rs"]
note = "The dispatcher serves a bounded inbound `presence` subscription and immediately originates a typed PIDF NOTIFY. The compositor and package document lifecycle remain available as library state. Missing: the live socket notifier is not yet fed by the PUBLISH compositor, and watcher information (RFC 3857) and the `presence.winfo` template are not implemented."

[[rfc]]
number = 3863
title = "Presence Information Data Format (PIDF)"
layer = "services"
status = "implemented"
evidence = ["crates/sipx-ua/src/presence.rs"]
note = "A typed document rather than a string template: tuples with an id, a `basic` status of open or closed, an optional contact with a priority clamped to §4.1.4's range, and an optional note. XML metacharacters are escaped, because one unescaped `&` in a SIP URI makes the whole document unparseable and a watcher then sees nothing at all. RFC 4480's richer vocabulary is a different document and is not implemented."

[[rfc]]
number = 3680
title = "A SIP Event Package for Registrations"
layer = "services"
status = "partial"
roles = ["uac", "uas"]
evidence = ["crates/sipx-ua/src/packages.rs", "crates/sipx-ua/src/reginfo.rs", "crates/sipx-ua/tests/packages.rs", "crates/sipx-ua/tests/reginfo.rs", "crates/sipx-call/src/notifier.rs", "crates/sipx-call/src/subscriber.rs", "crates/sipx-call/tests/notifier.rs", "crates/sipx-call/tests/registration_discovery.rs"]
note = "Both endpoint roles are live. The UAS emits bounded full `reginfo` through the dispatcher. The UAC subscribes through the generic authenticated event runtime and atomically maintains a typed, bounded current-contact set from full and partial documents; `sipx peers --registrar` exposes it with source and observation age. Partial because a version gap is rejected without automatically starting a fresh full-state subscription, and the UAS notifier is not automatically projected from an application registration store."

[[rfc]]
number = 4235
title = "An INVITE-Initiated Dialog Event Package for SIP"
layer = "services"
status = "partial"
roles = ["uas"]
evidence = ["crates/sipx-ua/src/packages.rs", "crates/sipx-ua/tests/packages.rs", "crates/sipx-call/src/notifier.rs", "crates/sipx-call/tests/notifier.rs"]
note = "`dialog-info` documents carry the five states of §3.7.1, full-then-partial discipline and a per-subscription version counter. The dispatcher now serves a bounded inbound `dialog` subscription and originates its full initial document. Missing: the package is not yet projected from the dispatcher's live call table, so subsequent call-state changes are not automatic."

[[rfc]]
number = 5627
title = "Obtaining and Using GRUUs in SIP"
layer = "services"
status = "partial"
roles = ["uac", "uas"]
evidence = [
  "crates/sipx-sip/src/gruu.rs",
  "crates/sipx-ua/src/agent.rs",
  "crates/sipx-ua/src/gruu.rs",
  "crates/sipx-ua/src/registrar.rs",
  "crates/sipx-ua/tests/gruu.rs",
  "crates/sipx-cli/tests/reachable.rs",
  "docs/specs/gruu.md",
]
note = "The UA side, for both roles: `Supported: gruu` and `+sip.instance` on REGISTER (§4.1) under the same instance identity RFC 5626 registers with, `pub-gruu` and `temp-gruu` read off the binding that names this instance and discarded with it (§4.2), a GRUU in the Contact of dialog-forming and target-refresh requests (§4.4), and §4.5's `gr` recognition — which is a comparison of its own because §5.4 notes a public GRUU is URI-equivalent to the AOR. A registered UA refuses an initial INVITE bearing an unowned GRUU with the `404` §6.1 gives an unresolved GRUU, so upstream misrouting cannot establish a call at another instance. The choice between public and temporary is the application's and asking for a temporary one never silently yields the public one, since §5.4's unlinkability is not something the other can stand in for. **Not the registrar or proxy role**: minting GRUUs, the temporary-GRUU construction of §5.4, the 480 of §5.2, and ordinary location-service resolution in §6.1 remain server behavior sipx does not implement."

[[rfc]]
number = 7044
title = "An Extension to SIP for Request History Information"
layer = "services"
status = "partial"
roles = ["uac", "uas"]
headers = ["HistoryInfo", "Privacy", "Supported"]
spec = "docs/specs/sip-history-info.md"
evidence = [
  "crates/sipx-sip/src/headers/history.rs",
  "crates/sipx-ua/src/history.rs",
  "crates/sipx-call/src/call/mod.rs",
  "crates/sipx-call/tests/call.rs",
]
note = "The UA side for both call roles: History-Info is a typed ordered list with hierarchical indices and rc/mp/np target-change references. Initial calls advertise histinfo and index their first target at 1; non-100 responses return the cache and calls retain the received history. `sipx_ua::retarget` preserves received entries, exposes an omitted previous hop with `.0`, appends the forwarding `.1`, and embeds the typed Reason in the previous SIP/SIPS URI; tel targets correctly have no URI-header component. Message- and entry-level history privacy anonymize identifying targets while retaining indices. Partial because sipx is not a proxy and does not build a fork's sibling branches; automatic cache extension from every received 3xx/timeout remains the retargeting caller's explicit status input."

[[rfc]]
number = 7092
title = "A Taxonomy of Session Initiation Protocol (SIP) Back-to-Back User Agents"
layer = "services"
status = "partial"
roles = ["uac", "uas"]
spec = "docs/specs/call-coupling.md"
evidence = [
  "crates/sipx-call/src/coupling/mod.rs",
  "crates/sipx-call/src/coupling/transparent.rs",
  "crates/sipx-sdp/src/relay.rs",
  "crates/sipx-call/tests/coupling.rs",
  "crates/sipx-call/tests/off_media_coupling.rs",
]
note = "The taxonomy is informational rather than a protocol conformance claim. sipx supplies the logical UAS/UAC concatenation as one owner of two dialogs: its owning constructor creates the target initial INVITE from the source offer; a target reliable-provisional offer is relayed to a source reliable provisional and its source PRACK answer is relayed in the held target PRACK; per-leg policy covers every carrier; UPDATE and re-INVITE relay live; glare is refused before forwarding; and a BYE on either confirmed leg ends its peer. Attaching the media bridge gives §3.2.3 media termination with explicit transcoding. §3.1.3 is a distinct owner rather than that coupling without a bridge: it holds two dialogs and no media session, relays each endpoint's own description with only the per-dialog `o=` line replaced, and refuses an unmappable one before the peer leg is told. The live proof is causal — RTP arrives on a socket the test bound and, after a relayed re-INVITE, at the port that re-INVITE named. Partial because the off-media role covers the initial INVITE, UPDATE and re-INVITE carriers only: it forecloses the reliable provisional by not offering 100rel and refuses an offerless INVITE, since both would make it author a description it has no media endpoint for. sipx also holds neither the proxy-B2BUA (§3.1.1) nor the media relay or media-aware roles (§3.2.1, §3.2.2). Both `uac` and `uas` are named because a B2BUA is their logical concatenation, not because sipx ships routing, a registrar or a dial plan."

