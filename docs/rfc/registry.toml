  "crates/sipx-call/examples/browser_audio_proof.rs",
]
note = "The named browser-audio profile requires Opus, PCMU, PCMA, 8 kHz comfort noise and 8 kHz telephone-event in both offer/answer roles, refuses a missing Opus build before I/O, and negotiates Opus on the live CLI path. The native-browser proof runs both SIP roles, reads the negotiated codec independently at both ends, and requires non-silent Opus audio in both directions. Partial because optional audio processing requirements and comfort-noise packet production are not implemented."

[[rfc]]
number = 8825
title = "Overview: Real-Time Protocols for Browser-Based Applications"
layer = "media"
status = "partial"
roles = ["uac", "uas"]
spec = "docs/specs/webrtc-audio.md"
