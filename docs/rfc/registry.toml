  "crates/sipx-call/tests/mute.rs",
]
note = "RTP and RTCP, including sender and receiver reports and the §A.8 interarrival jitter recurrence — which is not a variance, and is usually implemented as one. Reached by every call: `call.rs` asserts the audio one endpoint played arrives sample-for-sample at the other, and `mute.rs` asserts the sent and received packet counts agree with no loss. **The RTCP half is thinner than the row reads**, and `X-33` found it looking for that evidence: a call's `quality()` computes loss and jitter from local reception counters, and the only field that comes from a peer's report is the round trip, which no test at or above `sipx-call` asserts. The report codec itself is tested in `sipx-rtp`."

[[rfc]]
number = 3551
title = "RTP Profile for Audio and Video Conferences"
layer = "media"
status = "partial"
evidence = [
  "crates/sipx-audio/src/l16.rs",
  "crates/sipx-audio/src/g722.rs",
  "crates/sipx-media/src/session.rs",
  "crates/sipx-call/src/media_policy.rs",
]
note = "The static payload types sipx carries are PCMU 0, PCMA 8, G.722 9, and mono 44.1 kHz L16 11. G.722 implements §4.5.2's preserved historical error explicitly: the audio is sampled at 16 kHz while the RTP timestamp clock and the G722/8000 rtpmap stay at 8000, the session layer keeps the two rates apart, and a bare `m=audio … 9` offer with no rtpmap is accepted because the static number identifies the format. The codec is native Rust, selected through the call policy and the diagnostic CLI, and verified bit-exactly against the ITU-T G.722 Appendix II digital test sequences rather than by round-tripping. Mono 8 kHz L16 is offered with an explicit dynamic mapping; stereo type 10 is refused because the public PCM boundary is mono. L16 encode/decode is signed 16-bit network byte order, selected through the call policy, and the negotiated clock is retained independently of the codec. The rest of the profile is not implemented."

[[rfc]]
number = 4733
title = "RTP Payload for DTMF Digits, Telephony Tones, and Telephony Signals"
layer = "media"
status = "implemented"
evidence = [
  "crates/sipx-rtp/src/dtmf.rs",
  "crates/sipx-media/src/session.rs",
  "crates/sipx-call/src/call/mod.rs",
  "crates/sipx-call/tests/call.rs",
  "crates/sipx-cli/tests/cli.rs",
]
note = "Events 0-15, with the payload type read from the negotiation rather than assumed. End retransmissions share the event's timestamp, and receive state absorbs continuation, reordering, duplicates and repeated final reports before producing one duration-bearing event. A bounded media-silence input closes a tone whose final reports were lost; media replacement resets that state. Reachable from both library and automation boundaries: call tests carry `1234#` across a live call and assert a non-101 negotiated payload, while the two-process scenario proof observes ordered typed digits at the remote actor."

[[rfc]]
number = 6716
title = "Definition of the Opus Audio Codec"
layer = "media"
status = "implemented"
evidence = [
  "crates/sipx-audio/src/opus.rs",
  "crates/sipx-call/src/media_policy.rs",
  "crates/sipx-call/src/call/offer_answer.rs",
  "crates/sipx-call/tests/opus.rs",
  "crates/sipx-cli/src/media.rs",
  "crates/sipx-cli/tests/cli.rs",
  "crates/sipx-cli/tests/interop_opus.rs",
]
note = "Encode and decode, and both a library call and the diagnostic phone can select it. `Codecs` is the library choice: `DialOptions::with_codecs` on the offering side, `answer_with`, `answer_ringing_with`, `answer_replacing_with`, `Invitation::answer_with` and `ring_early_with` on the answering side, and `Call` carries the set so a re-INVITE does not narrow to G.711 mid-call. The diagnostic phone maps an ordered `--codec opus` selection directly to the same policy, refuses it before network I/O when the codec feature is absent, and reports the codec read from the established call. `sipx-call/tests/opus.rs` places a call with Opus selected and asserts 111 in the offer with its `a=rtpmap`, both ends settling on `Codec::Opus`, and 300 ms of a 48 kHz tone arriving sample-for-sample — a count only an Opus encode and decode can produce, since a G.711 read of an Opus packet yields a sample per byte. `interop_opus.rs` repeats the live audio proof against an independently implemented codec in both offer/answer roles: each exact Opus-only call sends a distinct 48 kHz signal through the peer's decoder and encoder, then requires non-silent, signal-correlated output from sipx's decoder. A G.711 fallback cannot negotiate and cannot satisfy the dynamic-payload assertion. Behind `sipx-call`'s `opus` feature, **off by default**, because it links a C library through `sipx-audio`; the default set stays the mandatory-to-implement G.711 pair, so the codec cannot become the default by accident. Negotiation refuses to settle outside the selected set, so an Opus offer reaching a G.711 call is answered G.711 rather than silently upgraded, never quietly better than what was asked for."

[[rfc]]
number = 7587
title = "RTP Payload Format for the Opus Speech and Audio Codec"
layer = "media"
status = "implemented"
evidence = [
  "crates/sipx-audio/src/opus.rs",
  "crates/sipx-media/tests/opus.rs",
  "crates/sipx-call/src/media_policy.rs",
  "crates/sipx-call/src/call/offer_answer.rs",
  "crates/sipx-call/tests/opus.rs",
  "crates/sipx-cli/src/media.rs",
  "crates/sipx-cli/tests/cli.rs",
  "crates/sipx-cli/tests/interop_opus.rs",
  "crates/sipx-call/examples/browser_audio_proof.rs",
]
note = "The payload format is reachable from a library call and the diagnostic phone. Implemented and tested: the 48000 RTP clock whatever the sample rate (§7), the mandatory `opus/48000/2` rtpmap regardless of the channel count actually sent, mono audio which is §7.1's `stereo=0` default, and matching by encoding name rather than by payload number — a format is read from its `a=rtpmap`, so 111 is Opus only because the description said so, and the number the far end assigned travels with the codec on `Config::payload_type` instead of being reassumed. `sipx-call/tests/opus.rs` carries live Opus packets across a call in both `Codecs::Opus` directions of the negotiation; `interop_opus.rs` makes the same two roles agree with an independently implemented peer, asserts a dynamic negotiated payload number and the 48000 stream clock, and requires recognisable decoded audio rather than a codec name. The native-browser proof repeats both roles, reads the selected 48 kHz Opus codec from browser statistics and sipx independently, and requires non-silent decoded audio in both directions. The diagnostic phone maps `--codec opus` to the same policy and reports the established codec. **No `a=fmtp` for Opus, in either direction**: `maxaveragebitrate`, `useinbandfec`, `usedtx`, `maxplaybackrate`, `cbr` and the `stereo` pair are §7.1's optional parameters, and sipx neither offers them nor reads one a peer offered — so a peer that asks for a bitrate ceiling or in-band FEC is not refused, it is simply not accommodated. Everything the format *requires* is here; everything it lets a receiver ask for is not."

[[rfc]]
number = 3711
title = "The Secure Real-time Transport Protocol (SRTP)"
layer = "media"
status = "partial"
spec = "docs/specs/srtp.md"
roles = ["uac", "uas"]
evidence = [
  "crates/sipx-rtp/src/srtp/mod.rs",
  "crates/sipx-media/tests/srtp.rs",
  "crates/sipx-call/tests/secure_media.rs",
  "crates/sipx-call/examples/browser_audio_proof.rs",
  "crates/sipx-cli/tests/interop_srtp.rs",
]
note = "The default transform, AES_CM_128_HMAC_SHA1_80, for RTP and RTCP, with separate SRTP and SRTCP replay windows and rollover inference. Key derivation and the keystream are checked against the RFC's own Appendix B vectors, and the session authentication key against §5.2's n_a rather than against §B.3's 94-octet example — `M-25` found it keyed with the latter. Both roles reach it on a live call, keyed by RFC 4568: in `secure_media.rs` each end asserts the call negotiated SRTP, and audio crosses the encrypted stream from the calling end to the answering one — one direction, which is the encrypt path on one side and the decrypt path on the other. `interop_srtp.rs` covers both directions against a peer that keyed the session independently, but it is `#[ignore]`d and runs only in the interop matrix, not in the local gate. `X-30` added those two citations, because until then this row claimed both roles from `sipx-rtp` alone and would have read the same had no call ever keyed a stream. Still no AES-f8, no null cipher, no 32-bit tag, no RFC 6188 counter-mode AES-256 suite, and no rekeying (the key derivation rate is fixed at zero). `M-47` added the §3.4 SRTCP replay list over its explicit index, separate from SRTP's sequence and rollover state, with authentication before either window changes. `M-41` made the protection profile an explicit negotiated value rather than an assumption: `srtp::Profile` is an argument to `Context::new`, every key, salt and tag length is read off it, and a key or salt of another profile's length is refused by name. The counter-mode transform is unchanged and remains the interoperability floor RFC 5764 §4.1.2 requires; what changed is that it is now one of three rather than the only one. See RFC 7714."

[[rfc]]
number = 4568
title = "SDP Security Descriptions for Media Streams (SDES)"
layer = "media"
status = "partial"
spec = "docs/specs/srtp.md"
roles = ["uac", "uas"]
evidence = [
  "crates/sipx-sdp/src/crypto.rs",
  "crates/sipx-sdp/src/answer.rs",
  "crates/sipx-media/src/session.rs",
  "crates/sipx-call/src/call/offer_answer.rs",
  "crates/sipx-sdp/tests/srtp_negotiation.rs",
  "crates/sipx-call/tests/secure_media.rs",
  "crates/sipx-call/tests/update.rs",
]
note = "`a=crypto` offered and answered, and **only over a secure signalling path** — §7.1 makes that a condition of use, and `Crypto::offer` returns nothing without it rather than leaving the check to every caller. §5.1.2's tag and suite are echoed from the attribute actually accepted (`M-26`), and §6.1's published `inline` parameter is asserted against `Crypto::parse` rather than against sipx's own output. §5.1.3's check — offered suite, accompanying tag, and a key — is `Crypto::verify_answer`, and `SrtpKeys::from_answer` makes it the only way an answer becomes keys. `M-29` put a live call on it: `sipx-call` verifies the answer to its own offer, and a refusal ends the call through `Error::Sdp` naming the tag that came back rather than keying media on two halves nobody agreed on. So both of §5.1's MUSTs now hold on a call and not only in the crates below it. `S-25` closed the one place the refusal was reported nowhere: an answer arriving in a reliable provisional (RFC 3262 §5) is checked the same way, and a refusal now withdraws the invitation with a CANCEL (RFC 3261 §9.1) and returns the same `Error::Sdp`, instead of leaving a caller that never receives a 2xx to time out with no reason. **Partial**, and for what the RFC defines beyond that exchange: no MKI, no key lifetimes, no session parameters, and no `RTP/SAVPF`. See `docs/specs/srtp.md` §12.3."

[[rfc]]
number = 5761
title = "Multiplexing RTP Data and Control Packets on a Single Port"
layer = "media"
status = "partial"
spec = "docs/specs/rtcp-mux-setup.md"
roles = ["uac", "uas"]
evidence = [
  "crates/sipx-sdp/src/answer.rs",
