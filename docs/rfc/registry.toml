[[rfc]]
number = 3515
title = "The SIP Refer Method"
layer = "services"
status = "implemented"
roles = ["uac", "uas"]
headers = ["ReferTo"]
methods = ["REFER", "NOTIFY"]
evidence = ["crates/sipx-call/src/transfer.rs", "crates/sipx-call/tests/transfer.rs"]
note = "Blind transfer, with the outcome reported by NOTIFY and the implicit subscription terminated. A 202 is modelled as `Trying`, never as success."

[[rfc]]
number = 3891
title = "The SIP Replaces Header"
layer = "services"
status = "implemented"
roles = ["uas"]
headers = ["Replaces"]
evidence = ["crates/sipx-call/src/transfer.rs", "crates/sipx-call/tests/attended.rs"]
note = "Matched on Call-ID and both tags. Matching on the Call-ID alone is a call-hijack primitive, and the refusal is the same 481 whichever field was wrong."

[[rfc]]
number = 3892
