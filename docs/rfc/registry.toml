# The RFCs sipx tracks, and how far each one is actually implemented.
#
# Two rules keep this honest.
#
# **This file is the source, `docs/compliance.md` is generated from it.** A hand-maintained
# table drifts from the code within a month and then reads as a claim rather than a
# measurement.
#
# **Claims are checked.** `scripts/rfc-report.py --check` verifies that every header and method
# an entry names is actually known to the parser, and that every file it cites as evidence
# exists. It cannot verify that behaviour is correct — the tests do that — but it can stop an
# entry saying "implemented" about a header the code has never heard of.
#
# **The grain is one row per RFC, and the key set is closed.** An entry may carry only the keys
# in `README.md`; anything else — including a finer-grained `[[rfc.requirement]]` row — fails
# the check rather than being silently ignored. Requirement grain was considered and declined
# in `../designs/rfc-registry-grain.md`, which also records what would reopen it.
#
# Format, and what a downstream registry may rely on when it inherits a row: `README.md`.
#
# The list is deliberately bounded. It is what sipx already touches plus what it has decided to
# aim at; it is not every SIP-related RFC, and it never will be. Some update or obsolete others,
# some define alternatives, some are confined to trust domains sipx does not operate in.
#
# status:
#   implemented — behaviour is present and tested for the roles listed
#   partial     — some of the normative behaviour, with `note` saying which part is missing
#   syntax      — the parser represents it; nothing acts on it
#   none        — tracked as a target, not started
#   n/a         — obsoleted, or a notation rather than a behaviour

# ---------------------------------------------------------------------------------------------
# Wire: can the bytes be represented at all?
# ---------------------------------------------------------------------------------------------

[[rfc]]
number = 3261
title = "SIP: Session Initiation Protocol"
layer = "wire"
status = "partial"
roles = ["uac", "uas"]
headers = ["Via", "From", "To", "CallId", "CSeq", "Contact", "MaxForwards", "Route", "RecordRoute"]
methods = ["INVITE", "ACK", "BYE", "CANCEL", "REGISTER", "OPTIONS"]
evidence = [
  "crates/sipx-sip/src/parser.rs",
  "crates/sipx-sip/src/message.rs",
  "crates/sipx-sip/src/uri.rs",
  "crates/sipx-sip/tests/lossless_message_editing.rs",
  "crates/sipx-sip/src/transaction/mod.rs",
  "crates/sipx-call/src/dispatch.rs",
  "crates/sipx-call/src/snapshot.rs",
  "crates/sipx-call/tests/call.rs",
  "crates/sipx-call/tests/cancel.rs",
  "crates/sipx-call/tests/invitation_deadline.rs",
  "crates/sipx-call/tests/dispatch.rs",
  "crates/sipx-ua/src/registrar.rs",
  "crates/sipx-ua/tests/registration_observation.rs",
  "crates/sipx-call/tests/dialog_persistence.rs",
  "crates/sipx-call/src/signalling.rs",
  "crates/sipx-call/tests/signalling.rs",
  "crates/sipx-transport/src/endpoint.rs",
  "crates/sipx-transport/tests/udp.rs",
  "docs/specs/call-initial-offer.md",
]
note = "Parser, all four transaction machines, dialogs, UAC and UAS. No proxy role: sipx does not fork, and Record-Route is read rather than written. Existing SIP/SIPS URI user parts can be replaced through the structured grammar with typed, atomic validation; on parsed URIs only the parser-retained user span changes and every other wire byte remains exact. Request-URI and nested URIs in every typed address field can likewise be replaced through parser-owned spans, and flattened address-list values can be removed across repeated rows without byte search or rebuilding surviving syntax. The call dispatcher answers rather than drops what belongs to no live call: 481 for an orphaned in-dialog request (§12.2.2), 405 with Allow for an unsupported method (§8.2.1), 482 for a merged INVITE (§8.2.2.2), and 200 with the capability list for an in-dialog OPTIONS (§11.2). A syntactically invalid initial session description receives a tagged 400, while a valid initial offer with no acceptable codec receives a tagged 488; both use the existing INVITE server transaction, which owns retransmission and absorbs the non-2xx ACK before the typed local error is returned. Outbound deadline cancellation waits for the provisional-response precondition before creating one CANCEL (§9.1), gives a pre-deadline final response precedence, and ACKs then ends a successful final response that crosses cancellation (§15); the caller owns and measures a distinct finite cleanup allowance. A registering UA retains the top response Via's received/rport pair as a typed, non-authoritative observation; missing or invalid observation data does not alter the successful binding. A confirmed quiescent dialog's §§12.1–12.2 state can be captured in a bounded versioned snapshot and attached to explicit fresh drivers: identifier orientation, route order, refreshed target and independent sequence numbers survive, while transactions, sockets, tasks, clocks, credentials and media keys do not. The bounded signalling responder sends final INVITE responses, validates ACK and remote sequence ordering, accepts or originates BYE, retransmits its final response through Timer H, and joins owned timer work before release. An outbound request above §18.1.1's derived unreliable-transport limit switches from UDP to TCP at the same peer before transaction creation, reports the switch in endpoint counters, and returns a typed cause when the selected TCP path is unavailable; oversized responses retain their §18.2.2 transport."

