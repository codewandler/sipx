note = "sipx implements the overview's separation of signalling, description, ICE, DTLS-SRTP and media ownership for one named audio profile. Partial by design: this is a SIP endpoint profile, not a browser API, full WebRTC stack, data-channel implementation or video session."

[[rfc]]
number = 8827
title = "WebRTC Security Architecture"
layer = "media"
