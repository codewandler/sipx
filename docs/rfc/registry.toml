[[rfc]]
number = 8866
title = "SDP: Session Description Protocol"
layer = "media"
status = "implemented"
evidence = [
  "crates/sipx-sdp/src/parse.rs",
  "crates/sipx-sdp/src/session.rs",
  "crates/sipx-sdp/src/rtpmap.rs",
  "crates/sipx-call/src/call.rs",
]
note = "A real AST with round-tripping, rather than string manipulation over the body. Every call goes through it: `call.rs` builds the offer and parses and answers the peer's, on the INVITE, on a re-INVITE and on an UPDATE. §6.6's `a=rtpmap` is read in exactly one place (`rtpmap.rs`), which decides format identity once — the encoding name case-insensitively, the clock rate and the channel count **by value**, with an omitted channel count meaning one. It was decided twice until `M-31`, textually where the answer was built and numerically where the codec was chosen, so an offer carrying `a=rtpmap:0 PCMU/08000` was answered A-law and then played back through µ-law: audible garbage rather than silence, with nothing reporting an error. A clock rate that is empty, is not a decimal digit string, or overflows a `u32` is a typed error and a non-match, never a panic. `docs/specs/sdp-format-identity.md` is normative for the rule and lists the vectors."

[[rfc]]
number = 4566
title = "SDP: Session Description Protocol (obsoleted by 8866)"
layer = "media"
status = "n/a"
evidence = []
note = "Superseded. Listed so a reader looking for it knows where it went."

[[rfc]]
number = 3550
title = "RTP: A Transport Protocol for Real-Time Applications"
layer = "media"
status = "implemented"
evidence = [
  "crates/sipx-rtp/src/packet.rs",
  "crates/sipx-rtp/src/rtcp.rs",
  "crates/sipx-call/tests/call.rs",
  "crates/sipx-call/tests/mute.rs",
]
note = "RTP and RTCP, including sender and receiver reports and the §A.8 interarrival jitter recurrence — which is not a variance, and is usually implemented as one. Reached by every call: `call.rs` asserts the audio one endpoint played arrives sample-for-sample at the other, and `mute.rs` asserts the sent and received packet counts agree with no loss. **The RTCP half is thinner than the row reads**, and `X-33` found it looking for that evidence: a call's `quality()` computes loss and jitter from local reception counters, and the only field that comes from a peer's report is the round trip, which no test at or above `sipx-call` asserts. The report codec itself is tested in `sipx-rtp`."

[[rfc]]
number = 3551
title = "RTP Profile for Audio and Video Conferences"
layer = "media"
