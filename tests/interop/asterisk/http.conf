; Asterisk serves SIP over WebSocket from its HTTP server, not from the SIP port: the upgrade
; is a GET to `/ws` on this port. That is a legitimate reading of RFC 7118, which says nothing
; about the path — and it is what this peer declares through `SIPX_INTEROP_WS_PORT` and
; `SIPX_INTEROP_WS_PATH` in `profile.sh`, so the shared WebSocket test asks for it here.
;
; 8088 rather than 5060 because the SIP TCP transport already has 5060, and the two servers
; cannot both bind it.

[general]
enabled=yes
bindaddr=0.0.0.0
bindport=8088
tlsenable=yes
tlsbindaddr=0.0.0.0:8089
tlscertfile=/etc/asterisk/tls/server.pem
tlsprivatekey=/etc/asterisk/tls/server.key
