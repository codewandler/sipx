; Asterisk serves SIP over WebSocket from its HTTP server, not from the SIP port: the upgrade
; is a GET to `/ws` on this port. That is a legitimate reading of RFC 7118, which says nothing
; about the path — and it is the reason the WebSocket test in the shared list does not reach
; this peer. See `tests/interop/README.md`, "What the second peer disagreed with".
;
; 8088 rather than 5060 because the SIP TCP transport already has 5060, and the two servers
; cannot both bind it.

[general]
enabled=yes
bindaddr=0.0.0.0
bindport=8088
