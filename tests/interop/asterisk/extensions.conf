; The dialplan the interop calls reach.
;
; One extension, and it echoes. `echo` is chosen over a recorded prompt because it makes the
; media assertion an equality rather than a similarity: what comes back is what went out,
; through a foreign RTP stack and a foreign jitter buffer, with no transcoding step in between
; to blame a difference on. That is `M-3`'s bit-exactness check, relaxed no further than a
; second implementation forces.

[general]
static=yes
writeprotect=yes

[default]
exten => echo,1,Answer()
	same => n,Echo()
	same => n,Hangup()

; A silent answer, for asserting on signalling without media in the way.
exten => quiet,1,Answer()
	same => n,Wait(30)
	same => n,Hangup()
