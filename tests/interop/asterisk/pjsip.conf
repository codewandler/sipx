; Minimal Asterisk SIP configuration for the sipx interop tests.
;
; Deliberately small, and deliberately the same shape as the other peer's: one subscriber,
; digest in the realm `sipx.test`, UDP and TCP on 5060, TLS on 5061. The point of a second peer
; is that the *same* test list runs against an implementation that shares no code with the
; first, so anything peer-specific here would be an assumption smuggled back in.

[global]
type=global
; The realm the challenge carries. Asterisk's default is its own name; naming it after the
; fixture domain is what lets the same credentials and the same test list work unchanged.
realm=sipx.test
; `username` first, so a REGISTER from alice is identified as the alice endpoint and gets
; challenged. `anonymous` last, so an INVITE from a caller with no account still reaches the
; dialplan — the tests place calls without registering first.
endpoint_identifier_order=username,ip,anonymous

; ------------------------------------------------------------------------- transports ----
; UDP and TCP share 5060 and TLS gets 5061, per RFC 3261 §19.1.2 — the same arrangement the
; other peer serves, so `SIPX_INTEROP_ADDR` and `SIPX_INTEROP_TLS_PORT` need no per-peer value.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

; `method` is not left at the default, and the reason is the same trap the other peer sprang:
; the default here is TLS 1.0, which every current client refuses outright — `openssl s_client
; -tls1_2` fails against it too, with `unsupported protocol`. That reads as a sipx handshake bug
; and is not one. `tlsv1_2` sets a *floor* in this library rather than pinning the version, so
; sipx's ClientHello offering 1.3 and 1.2 still negotiates.
[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
method=tlsv1_2
cert_file=/etc/asterisk/tls/server.pem
priv_key_file=/etc/asterisk/tls/server.key

; SIP over WebSocket. Asterisk serves it from its own HTTP server (see http.conf) at the path
; `/ws`, not from the SIP port — so unlike the transports above, this one does need per-peer
; values: `SIPX_INTEROP_WS_PORT` and `SIPX_INTEROP_WS_PATH`, declared in `profile.sh`.
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:5060

; ------------------------------------------------------------------------- subscriber ----
; The same account the other peer serves, so the registration tests need no per-peer knowledge.

[alice]
type=aor
max_contacts=1
remove_existing=yes

[alice]
type=auth
auth_type=userpass
username=alice
password=Circle Of Life

[alice]
type=endpoint
context=default
disallow=all
allow=ulaw,alaw
auth=alice
aors=alice
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

; ------------------------------------------------------------------ calls without an account ----
; Asterisk matches an unidentified request to the endpoint literally named `anonymous`. The call
; tests dial in without registering first, which is what a foreign answerer has to cope with.

[anonymous]
type=endpoint
context=default
disallow=all
allow=ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes

; ------------------------------------------------------------------------ calling sipx ----
; The other direction: an endpoint the peer can originate towards, so a call sipx *answers* is
; a call an independent implementation placed. The contact is a fixed port because a call file
; cannot be told a port the test chose after the container started; the harness exports the same
; number to the test as `SIPX_INTEROP_UA_PORT`.

[sipx-ua]
type=aor
contact=sip:sipx@127.0.0.1:5080

[sipx-ua]
type=endpoint
context=default
disallow=all
allow=ulaw,alaw
aors=sipx-ua
direct_media=no
rtp_symmetric=yes
