# Minimal Kamailio registrar for sipx interop tests.
#
# Deliberately small: it registers, it challenges with digest, and it answers OPTIONS. The
# point is to exercise sipx against a real implementation, not to model a deployment.

#!KAMAILIO

debug=2
log_stderror=yes
fork=yes
children=1

listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060
listen=tls:0.0.0.0:5061
enable_tls=yes

# The WebSocket upgrade is an HTTP GET, and it arrives on the *TCP* port — there is no separate
# WebSocket listener. Without this Kamailio rejects a request with no Content-Length before the
# upgrade is ever considered.
#
# Note what that means for sipx: SIP-over-TCP and SIP-over-WebSocket share port 5060 here. That
# is the ordinary arrangement, and it is why the connection pool cannot be keyed by address
# alone.
tcp_accept_no_cl=yes

loadmodule "jsonrpcs.so"
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "ctl.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "auth.so"
loadmodule "auth_db.so"
loadmodule "db_text.so"
loadmodule "tls.so"
loadmodule "xhttp.so"
loadmodule "websocket.so"

# The certificate is generated by `run.sh` from the same fixture authority the unit tests use,
# so what Kamailio presents here and what sipx checks in `tests/tls.rs` are built the same way.
modparam("tls", "certificate", "/etc/kamailio/tls/server.pem")
modparam("tls", "private_key", "/etc/kamailio/tls/server.key")
modparam("tls", "ca_list", "/etc/kamailio/tls/ca.pem")
# Kamailio does not ask sipx for a certificate: what is under test is sipx checking *its*
# identity, and requiring one here would only add a second thing that could fail.
# `TLSv1.2+`, not the default. Kamailio's default pins the *method* to TLS 1.2, which in
# OpenSSL means refusing a ClientHello that offers 1.3 rather than negotiating down to 1.2 —
# `openssl s_client` fails against it too. sipx offers 1.3 and 1.2, per `sip-tls.md` §3.5, and
# will not stop offering 1.3 to accommodate a server that is misconfigured.
modparam("tls", "tls_method", "TLSv1.2+")
modparam("tls", "verify_certificate", 0)
modparam("tls", "require_certificate", 0)

modparam("usrloc", "db_mode", 0)
modparam("auth_db", "db_url", "text:///etc/kamailio/dbtext")
modparam("auth_db", "calculate_ha1", yes)
modparam("auth_db", "password_column", "password")
modparam("auth_db", "load_credentials", "")

# RFC 7118: the WebSocket upgrade arrives as an HTTP GET, which reaches Kamailio through
# xhttp rather than through the SIP request route.
event_route[xhttp:request] {
    if ($hdr(Upgrade) =~ "websocket" && $hdr(Connection) =~ "Upgrade" && $rm =~ "GET") {
        if (ws_handle_handshake()) {
            exit;
        }
    }
    xhttp_reply("404", "Not Found", "text/html", "<html><body>no</body></html>");
}

request_route {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    if (is_method("OPTIONS")) {
        # Answer the ping with a capability list, as a real element would.
        append_to_reply("Allow: INVITE, ACK, CANCEL, BYE, OPTIONS\r\n");
        sl_send_reply("200", "OK");
        exit;
    }

    if (is_method("REGISTER")) {
        # The challenge sipx must answer.
        if (!www_authenticate("sipx.test", "subscriber")) {
            www_challenge("sipx.test", "0");
            exit;
        }
        if (!save("location")) {
            sl_reply_error();
        }
        exit;
    }

    sl_send_reply("501", "Not Implemented");
}
