name: Publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Exact existing annotated version tag to resume
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pages: read

concurrency:
  group: crates-io-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: publish and verify release
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: release
    outputs:
      release_tag: ${{ steps.release_facts.outputs.tag }}
      release_version: ${{ steps.release_facts.outputs.version }}
      release_sha: ${{ steps.release_facts.outputs.sha }}
      release_epoch: ${{ steps.release_facts.outputs.epoch }}
      release_notes: ${{ steps.release_facts.outputs.notes }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      REQUESTED_RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Check out the exact tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the approved Cargo credential
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "the release environment must provide CARGO_REGISTRY_TOKEN" >&2
            exit 1
          fi

      - name: Validate the immutable annotated tag
        id: release_facts
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != tag || "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" || "$GITHUB_REF_NAME" != "$RELEASE_TAG" ]]; then
            echo "the release workflow must run from the selected tag ref itself" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$REQUESTED_RELEASE_TAG" != "$RELEASE_TAG" ]]; then
            echo "manual confirmation $REQUESTED_RELEASE_TAG does not match selected tag $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag is not v<semver>: $RELEASE_TAG" >&2
            exit 1
          fi
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "release tag $RELEASE_TAG does not match workspace version $version" >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != tag ]]; then
            echo "$RELEASE_TAG is not an annotated tag" >&2
            exit 1
          fi
          release_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          release_epoch="$(git show -s --format=%ct "$release_sha")"
          if [[ "$(git rev-parse HEAD)" != "$release_sha" ]]; then
            echo "checkout HEAD is not the commit named by $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$GITHUB_SHA" != "$release_sha" || "$GITHUB_WORKFLOW_SHA" != "$release_sha" ]]; then
            echo "event and workflow source must both be the release commit $release_sha" >&2
            exit 1
          fi
          expected_workflow_ref="$GITHUB_REPOSITORY/.github/workflows/crates-io.yml@refs/tags/$RELEASE_TAG"
          if [[ "$GITHUB_WORKFLOW_REF" != "$expected_workflow_ref" ]]; then
            echo "workflow source is not the release tag: $GITHUB_WORKFLOW_REF" >&2
            exit 1
          fi
          mapfile -t tags < <(git tag --points-at HEAD)
          if [[ "${#tags[@]}" -ne 1 || "${tags[0]}" != "$RELEASE_TAG" ]]; then
            echo "release commit must carry only $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "release checkout is not clean" >&2
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$release_sha" origin/main; then
            echo "$RELEASE_TAG is not contained in origin/main" >&2
            exit 1
          fi
          notes="docs/releases/$version.md"
          if [[ ! -s "$notes" ]]; then
            echo "reviewed release notes are missing: $notes" >&2
            exit 1
          fi
          {
            echo "RELEASE_VERSION=$version"
            echo "RELEASE_SHA=$release_sha"
            echo "RELEASE_NOTES=$notes"
          } >>"$GITHUB_ENV"
          {
            echo "tag=$RELEASE_TAG"
            echo "version=$version"
            echo "sha=$release_sha"
            echo "epoch=$release_epoch"
            echo "notes=$notes"
          } >>"$GITHUB_OUTPUT"

      # X-93. The gate is the expensive half of a release, and it used to run before anything had
      # asked whether the evidence it depends on exists at all: beta run 30906820031 spent 12m37 in
      # a cold gate on a commit whose input was already wrong. These two API reads cost a second.
      #
      # This is an ordering change and never a substitute. It establishes that the exact-SHA `main`
      # CI run and its Pages deployment job exist and succeeded — nothing more. The complete gate
      # still runs, and the deployed page is still probed over HTTP after the registry consumer
      # proof, because a successful deployment job and a page answering are different claims.
      - name: Require exact-SHA main CI and Pages deployment evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&head_sha=$RELEASE_SHA&per_page=100" \
            --jq '.workflow_runs | map(select(.head_sha == env.RELEASE_SHA and .head_branch == "main" and .conclusion == "success")) | first | .id // empty')"
          if [[ -z "$run_id" ]]; then
            echo "no successful main CI run has head_sha $RELEASE_SHA" >&2
            exit 1
          fi
          deployment_job="$(gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
            --jq '.jobs[] | select(.name == "deploy docs site" and .conclusion == "success") | .id' \
            | head -n 1)"
          if [[ -z "$deployment_job" ]]; then
            echo "CI run $run_id has no successful deploy docs site job" >&2
            exit 1
          fi
          echo "preflight: CI run $run_id job $deployment_job is bound to $RELEASE_SHA"

      - name: Install release build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libopus-dev libssl-dev pkg-config
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          msrv="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["rust-version"])')"
          rustup toolchain install "$msrv" --profile minimal

      # The Node dependency cache. `cache: npm` keyed on the exact website lockfile, which caches
      # the npm *downloads* only. A `website/node_modules` cache was measured rather than assumed
      # (X-93) and deliberately not added: see `docs/specs/release-workflow.md` §2.1 for the
      # figures and the decision.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      # Every input that decides whether a build artifact from a previous release can be believed,
      # read from its authoritative source rather than restated here. A key that is coarser than
      # the artifacts it names is how a stale build reaches a release gate; a key derived from an
      # input nobody read is the same defect one step earlier.
      - name: Derive the release build cache key
        id: build_cache_key
        shell: bash
        run: |
          set -euo pipefail
          msrv="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["rust-version"])')"
          inputs="$RUNNER_TEMP/sipx-release-cache-inputs.txt"
          {
            echo "runner=$RUNNER_OS-$RUNNER_ARCH-${ImageOS:-unknown}"
            echo "lockfile=$(sha256sum Cargo.lock | cut -d ' ' -f 1)"
            echo "ci-flags=$(awk '/^env:/ { inside = 1; next } inside && /^[^[:space:]]/ { inside = 0 } inside' .github/workflows/ci.yml | sha256sum | cut -d ' ' -f 1)"
            echo "stable=$(rustc +stable -vV | sha256sum | cut -d ' ' -f 1)"
            echo "msrv=$msrv-$(rustc +"$msrv" -vV | sha256sum | cut -d ' ' -f 1)"
            echo "native=$(pkg-config --modversion opus openssl alsa | sha256sum | cut -d ' ' -f 1)"
          } >"$inputs"
          echo "release build cache inputs:"
          cat "$inputs"
          echo "key=sipx-release-gate-v1-$(sha256sum "$inputs" | cut -d ' ' -f 1)" >>"$GITHUB_OUTPUT"

      # Restored here and nowhere earlier: everything above this line establishes that the tag is
      # the immutable input the release claims to be, and a build directory seeded before that is
      # an input nobody authorised.
      #
      # No `restore-keys`: a near-miss restore would seed the release gate with artifacts built
      # from a different lockfile or toolchain, which is the one thing an exact key is for.
      # `continue-on-error`, because a cache is an optimisation — a missing, half-written or
      # corrupt entry leaves the gate a colder build directory and nothing else, and the gate
      # behind it runs every one of its steps either way.
      #
      # `path` is an allow-list. `release.py` gives package rehearsal, resume verification and the
      # registry consumer their own `CARGO_HOME` and `--target-dir` under the runner temp, and
      # `consumer_environment` strips any inherited one, so nothing cached here can reach them.
      # That isolation is the evidence, not incidental build work.
      - name: Restore the Actions-managed Rust artifact cache
        id: build_cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          key: ${{ steps.build_cache_key.outputs.key }}
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target

      - name: Run the complete release gate
        env:
          SIPX_DENYLIST: ${{ secrets.SIPX_DENYLIST }}
          # Step scope is deliberate: runner context does not exist while the job-level environment
          # is evaluated. The runner temporary directory also keeps the release checkout clean and
          # survives `cargo clean` inside a gate step.
          GATE_TIMINGS: ${{ runner.temp }}/sipx-gate-timings.json
        run: |
          if [[ -z "$SIPX_DENYLIST" ]]; then
            echo "the release environment must provide SIPX_DENYLIST" >&2
            exit 1
          fi
          exec ./scripts/gate.py --timings "$GATE_TIMINGS"

      # What makes the cache a decision rather than a hope. The gate's own clock records whether
      # the build directory was cold or warm and what each step cost; this puts that record on the
      # run page and keeps the JSON. Two protected runs — one that missed and one that hit — are
      # what the 60-second retention rule in `docs/specs/release-workflow.md` §2.1 is read against.
      # Nothing here gates on a duration.
      - name: Record the gate's cold or warm timings
        if: always()
        env:
          CACHE_RESTORED: ${{ steps.build_cache.outputs.cache-hit }}
          GATE_TIMINGS: ${{ runner.temp }}/sipx-gate-timings.json
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s "$GATE_TIMINGS" ]]; then
            echo "the gate wrote no timings record; nothing to report" >&2
            exit 0
          fi
          python3 - "$GATE_TIMINGS" "${CACHE_RESTORED:-}" >>"$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import pathlib
          import sys

          record = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          restored = sys.argv[2] == "true"
          cache = record.get("cache", {})
          print("### release gate timings")
          print()
          print(f"- artifact cache restored: `{restored}`")
          print(f"- build directory: `{cache.get('state', 'unknown')}` — {cache.get('why', '')}")
          print(f"- commit: `{record.get('commit', 'unknown')}`")
          print(f"- wall clock: `{record.get('wall_clock_seconds', 'unknown')}` s")
          print()
          print("| step | seconds | outcome |")
          print("|---|---|---|")
          for step in sorted(record.get("steps", []), key=lambda row: -row.get("seconds", 0.0)):
              print(f"| {step.get('name')} | {step.get('seconds')} | {step.get('outcome')} |")
          PY

      - name: Preserve the gate timings record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-timings
          path: ${{ runner.temp }}/sipx-gate-timings.json
          if-no-files-found: warn

      # Saved only from a green gate: the job stops at the first red step, so a cache entry can
      # only ever describe a build the complete gate accepted. `continue-on-error` for the same
      # reason as the restore — a cache write that fails is not a failed release.
      #
      # The one cache result this workflow is allowed to act on, and the only step it may decide:
      # `actions/cache/save` builds the archive before it discovers the key is taken, so saving
      # after an exact restore would spend minutes compressing a build directory that came back
      # byte-for-byte and make a hit slower than a miss.
      - name: Save the Actions-managed Rust artifact cache
        if: steps.build_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          key: ${{ steps.build_cache_key.outputs.key }}
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target

      - name: Rehearse the locked registry packages
        run: ./scripts/release.py --dry-run

      - name: Publish dependency-ready frontiers under a finite bound
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          public_count="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(sum(package.get("publish") != [] for package in json.load(sys.stdin)["packages"]))')"
          max_invocations=$((public_count + 1))
          report="$RUNNER_TEMP/sipx-release-frontier.txt"
          # What this publication may spend waiting on the registry's stated limits, in total
          # rather than per invocation. Twelve public crates against crates.io's stated new-crate
          # allowance — a burst of five, then one name every 600s — is 4200s of unavoidable
          # waiting on a first publication; 4800 leaves room for one restated deadline without
          # letting pacing eat the 180-minute job that also runs the complete gate. The ledger is
          # what makes it one budget instead of `max_invocations` of them: it is created here,
          # outside the loop, so every invocation reads what its predecessors spent. Exhausting it
          # stops resumably and hands the rest to crates-io-resume.yml, which is a reviewable
          # outcome; exhausting `timeout-minutes` is not.
          pacing_ledger="$RUNNER_TEMP/sipx-release-pacing.json"
          complete=false
          for ((invocation = 1; invocation <= max_invocations; invocation++)); do
            echo "release frontier invocation $invocation of $max_invocations"
            : >"$report"
            ./scripts/release.py \
              --publish \
              --confirm-publish "$RELEASE_TAG" \
              --authorize-ci-publish "$RELEASE_TAG@$RELEASE_SHA" \
              --registry-wait-seconds 300 \
              --registry-retry-budget-seconds 4800 \
              --registry-retry-ledger "$pacing_ledger" \
              --command-timeout-seconds 1800 2>&1 | tee "$report"
            if grep -Fqx "all public packages are already registry-visible" "$report"; then
              complete=true
              break
            fi
          done
          if [[ "$complete" != true ]]; then
            echo "publication did not reach the all-visible state in $max_invocations invocations" >&2
            exit 1
          fi

      - name: Verify the exact registry consumer and installed CLI
        run: |
          ./scripts/release.py \
            --verify-consumer \
            --registry-wait-seconds 300 \
            --consumer-timeout-seconds 900 \
            --command-timeout-seconds 1800

      - name: Verify Pages deployment from the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&head_sha=$RELEASE_SHA&per_page=100" \
            --jq '.workflow_runs | map(select(.head_sha == env.RELEASE_SHA and .head_branch == "main" and .conclusion == "success")) | first | .id // empty')"
          if [[ -z "$run_id" ]]; then
            echo "no successful main CI run has head_sha $RELEASE_SHA" >&2
            exit 1
          fi
          deployment_job="$(gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
            --jq '.jobs[] | select(.name == "deploy docs site" and .conclusion == "success") | .id' \
            | head -n 1)"
          if [[ -z "$deployment_job" ]]; then
            echo "CI run $run_id has no successful deploy docs site job" >&2
            exit 1
          fi
          guide="$RUNNER_TEMP/sipx-getting-started.html"
          curl --fail --silent --show-error --location \
            --retry 8 --retry-all-errors --retry-max-time 120 --connect-timeout 10 --max-time 20 \
            --output "$guide" https://codewandler.github.io/sipx/docs/getting-started
          if ! grep -Fq "$RELEASE_VERSION" "$guide"; then
            echo "the deployed getting-started guide does not name $RELEASE_VERSION" >&2
            exit 1
          fi
          curl --fail --silent --show-error --location \
            --retry 8 --retry-all-errors --retry-max-time 120 --connect-timeout 10 --max-time 20 \
            --output /dev/null https://codewandler.github.io/sipx/api/sipx_call/index.html
          echo "Pages run $run_id job $deployment_job is bound to $RELEASE_SHA"

  cli_artifacts:
    name: cli artifact (${{ matrix.target }})
    needs: release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            binary: target/x86_64-unknown-linux-musl/release/sipx
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            binary: target/aarch64-unknown-linux-musl/release/sipx
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            binary: target/x86_64-apple-darwin/release/sipx
          - target: aarch64-apple-darwin
            runner: macos-15
            binary: target/aarch64-apple-darwin/release/sipx
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            binary: target/x86_64-pc-windows-msvc/release/sipx.exe
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
      RELEASE_VERSION: ${{ needs.release.outputs.release_version }}
      RELEASE_SHA: ${{ needs.release.outputs.release_sha }}
      RELEASE_EPOCH: ${{ needs.release.outputs.release_epoch }}
      TARGET: ${{ matrix.target }}
      BINARY: ${{ matrix.binary }}
    steps:
      - name: Check out the immutable artifact source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.release_tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate artifact inputs and select the release toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]]; then
            echo "artifact checkout does not equal $RELEASE_SHA" >&2
            exit 1
          fi
          python_command=python3
          if [[ "$RUNNER_OS" == Windows ]]; then
            python_command=python
          fi
          version="$("$python_command" -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          rust_version="$("$python_command" -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["rust-version"])')"
          if [[ "$version" != "$RELEASE_VERSION" || "$RELEASE_TAG" != "v$version" ]]; then
            echo "artifact version is not bound to the release tag" >&2
            exit 1
          fi
          if [[ "$(git show -s --format=%ct HEAD)" != "$RELEASE_EPOCH" ]]; then
            echo "artifact epoch is not the release commit timestamp" >&2
            exit 1
          fi
          echo "PYTHON=$python_command" >>"$GITHUB_ENV"
          echo "RUSTUP_TOOLCHAIN=$rust_version" >>"$GITHUB_ENV"

      - name: Install native artifact prerequisites
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup target add "$TARGET" --toolchain "$RUSTUP_TOOLCHAIN"
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y musl-tools
            linker_variable="CARGO_TARGET_$(printf '%s' "$TARGET" | tr '[:lower:]-' '[:upper:]_')_LINKER"
            echo "$linker_variable=musl-gcc" >>"$GITHUB_ENV"
            echo "CC=musl-gcc" >>"$GITHUB_ENV"
          fi

      - name: Build the no-optional-feature executable once
        shell: bash
        run: cargo build --locked --release -p sipx-cli --target "$TARGET" --no-default-features

      - name: Compile-check the portable device-audio branch
        if: runner.os == 'macOS' || runner.os == 'Windows'
        shell: bash
        run: cargo check --locked -p sipx-cli --target "$TARGET" --all-targets --features device-audio

      - name: Prove and package the native artifact
        shell: bash
        run: |
          "$PYTHON" scripts/release-artifacts.py package \
            --binary "$BINARY" \
            --out "$RUNNER_TEMP/sipx-artifact" \
            --version "$RELEASE_VERSION" \
            --target "$TARGET" \
            --release-sha "$RELEASE_SHA" \
            --source-date-epoch "$RELEASE_EPOCH"

      - name: Preserve the target evidence for aggregation
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: ${{ runner.temp }}/sipx-artifact/*
          if-no-files-found: error
          retention-days: 7

  cli_artifact_set:
    name: aggregate portable cli artifacts
    needs: [release, cli_artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
      RELEASE_VERSION: ${{ needs.release.outputs.release_version }}
      RELEASE_SHA: ${{ needs.release.outputs.release_sha }}
      RELEASE_EPOCH: ${{ needs.release.outputs.release_epoch }}
    steps:
      - name: Check out the immutable artifact validator
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.release_tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download all target evidence
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: ${{ runner.temp }}/sipx-artifact-input
          merge-multiple: true

      - name: Validate and aggregate the exact target set
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]]; then
            echo "artifact validator does not equal $RELEASE_SHA" >&2
            exit 1
          fi
          python3 scripts/release-artifacts.py aggregate \
            --input "$RUNNER_TEMP/sipx-artifact-input" \
            --out "$RUNNER_TEMP/sipx-release-assets" \
            --version "$RELEASE_VERSION" \
            --release-sha "$RELEASE_SHA" \
            --source-date-epoch "$RELEASE_EPOCH"

      - name: Preserve the exact release asset set
        uses: actions/upload-artifact@v4
        with:
          name: cli-release-assets
          path: ${{ runner.temp }}/sipx-release-assets/*
          if-no-files-found: error
          retention-days: 7

  github_release:
    name: publish or verify GitHub release
    needs: [release, cli_artifact_set]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
      RELEASE_VERSION: ${{ needs.release.outputs.release_version }}
      RELEASE_SHA: ${{ needs.release.outputs.release_sha }}
      RELEASE_NOTES: ${{ needs.release.outputs.release_notes }}
    steps:
      - name: Check out the reviewed release record
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.release_tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download the verified release asset set
        uses: actions/download-artifact@v4
        with:
          name: cli-release-assets
          path: ${{ runner.temp }}/sipx-release-assets

      - name: Create or verify the GitHub release and assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected="$RUNNER_TEMP/sipx-release-assets"
          actual="$RUNNER_TEMP/sipx-existing-assets"
          verified="$RUNNER_TEMP/sipx-verified-assets"
          mkdir -p "$actual" "$verified"
          prerelease=false
          release_flag=--latest
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            prerelease=true
            release_flag=--prerelease
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            record="$RUNNER_TEMP/sipx-existing-release.json"
            gh api -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" >"$record"
            python3 - "$record" "$RELEASE_NOTES" "$RELEASE_TAG" "$RELEASE_VERSION" "$prerelease" <<'PY'
          import json
          import pathlib
          import sys

          record = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          notes = pathlib.Path(sys.argv[2]).read_text(encoding="utf-8").strip()
          tag = sys.argv[3]
          version = sys.argv[4]
          prerelease = sys.argv[5] == "true"
          problems = []
          if record.get("tag_name") != tag:
              problems.append("tag differs")
          if record.get("name") != f"sipx {version}":
              problems.append("title differs")
          if record.get("draft") is not False or record.get("prerelease") is not prerelease:
              problems.append("release kind differs")
          if str(record.get("body", "")).strip() != notes:
              problems.append("reviewed notes differ")
          if problems:
              raise SystemExit("existing GitHub Release is not the reviewed release: " + ", ".join(problems))
          PY
            if python3 - "$record" <<'PY'
          import json
          import pathlib
          import sys
          record = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          raise SystemExit(0 if record.get("assets") else 1)
          PY
            then
              gh release download "$RELEASE_TAG" --dir "$actual"
            fi
            python3 scripts/release-artifacts.py compare \
              --expected "$expected" --actual "$actual" --allow-missing
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --target "$RELEASE_SHA" \
              "$release_flag" \
              --title "sipx $RELEASE_VERSION" \
              --notes-file "$RELEASE_NOTES"
          fi

          for asset in "$expected"/*; do
            name="$(basename "$asset")"
            if [[ ! -e "$actual/$name" ]]; then
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          done
          gh release download "$RELEASE_TAG" --dir "$verified"
          python3 scripts/release-artifacts.py compare \
            --expected "$expected" --actual "$verified"
