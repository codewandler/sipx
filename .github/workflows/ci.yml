name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The soak needs minutes and would make every push slower for a failure that takes hours to
  # develop in the first place. Nightly is often enough to catch a leak while it is still one
  # commit old.
  schedule:
    - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `--all-features` turns on Opus, which links libopus, and DTLS-SRTP, which links OpenSSL.
      # Installing them means the FFI crates find the libraries through pkg-config instead of
      # building from source — which for Opus is the failure mode of the one advisory
      # `deny.toml` excepts.
      - run: sudo apt-get update && sudo apt-get install -y libopus-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libopus-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features
      # The documentation guides include these files verbatim. A sample that no longer compiles
      # is worse than no sample: it is read as working code.
      - run: cargo build --workspace --all-features --examples

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libopus-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      # --all-targets, so tests and dev-dependencies are covered too. Without it the declared
      # floor is verified for the library and nothing else, and a downstream user running
      # `cargo test` on the minimum version is the one who finds out.
      - run: cargo check --workspace --all-targets --all-features

  features:
    name: feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Every other job builds `--all-features`, which cannot see a crate that fails to compile
      # with an optional feature turned *off*. That is not a hypothetical gap: `tokio::select!`
      # cannot compile a branch out behind a `#[cfg]`, and an optional transport's branch
      # referred to a field that only existed with its feature on. Nothing here noticed.
      - run: ./scripts/check-features.sh

  soak:
    name: soak
    # Scheduled only. It takes minutes, and a suite people skip is worse than one that runs.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # A leak's own failure mode is a run that never finishes. Without a bound that costs the
    # GitHub default of six hours of runner time every night before anyone is told.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libopus-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Named explicitly rather than `--workspace -- --ignored`. The interop tests are ignored
      # too, and they need a Kamailio container that is not running here — a job that swept up
      # every ignored test would fail nightly for a reason that has nothing to do with leaks.
      #
      # `--all-features` because the transports with connection state are exactly the ones worth
      # soaking, and a default-features build never touches them.
      - run: cargo test -p sipx-call --test load --all-features -- --ignored

  docs:
    name: rfc compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The compliance table is generated from a registry and claims things about the code. This
      # fails the build if it has drifted from either — a table nobody checks becomes marketing.
      - run: ./scripts/rfc-report.py --check

  # The documentation site. Built on every push and pull request so a broken link fails review
  # rather than the deployed page; published only from `main`.
  site:
    name: docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      # Builds the site *and* the API reference, with `-D warnings` on the latter: a public
      # item with no documentation, or an intra-doc link that resolves nowhere, fails here —
      # and the site build throws on any broken link (`onBrokenLinks` in docusaurus.config.js).
      - run: ./scripts/build-docs.sh
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: website/build

  deploy-site:
    name: deploy docs site
    needs: site
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      # A short run on every push catches regressions; it is not a substitute for a long
      # campaign before a release. The RFC 4475 corpus seeds each target so the fuzzer starts
      # from real messages rather than noise.
      #
      # The first corpus directory is the one libFuzzer *writes* to; every later one is
      # read-only seed. Passing the RFC corpus first would have the fuzzer deposit thousands
      # of generated inputs into committed test data.
      - name: Fuzz the parsers
        run: |
          for target in parse_datagram parse_stream roundtrip; do
            # The writable corpus directory has to exist before libFuzzer is handed it, and
            # it is gitignored, so a clean checkout has no such directory.
            mkdir -p "fuzz/corpus/$target"
            cargo fuzz run "$target" \
              "fuzz/corpus/$target" crates/sipx-testkit/corpus/rfc4475 \
              -- -max_total_time=60 -max_len=8192
          done
          mkdir -p fuzz/corpus/parse_uri
          cargo fuzz run parse_uri fuzz/corpus/parse_uri -- -max_total_time=30 -max_len=512
      # The corpus is committed test data: prove the fuzzer did not modify it.
      - name: Verify the RFC 4475 corpus is untouched
        run: ./scripts/import-rfc4475-corpus.sh --check

  provenance:
    name: provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for prior-art references
        env:
          SIPX_DENYLIST: ${{ secrets.SIPX_DENYLIST }}
        run: ./scripts/check-provenance.sh --history
