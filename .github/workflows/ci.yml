name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The soak needs minutes and would make every push slower for a failure that takes hours to
  # develop in the first place. Nightly is often enough to catch a leak while it is still one
  # commit old.
  schedule:
    - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `--all-features` turns on Opus, which links libopus, and DTLS-SRTP, which links OpenSSL.
      # Installing them means the FFI crates find the libraries through pkg-config instead of
      # building from source — which for Opus is the failure mode of the one advisory
      # `deny.toml` excepts.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libopus-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libopus-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features
      # The documentation guides include these files verbatim. A sample that no longer compiles
      # is worse than no sample: it is read as working code.
      - run: cargo build --workspace --all-features --examples
      # P-13: run the candidate command's actual help and compare it, plus every versioned CLI JSON
      # producer, with the public reference. A parsed Rust help constant would miss dispatch/build
      # defects and is deliberately not substituted here.
      - run: ./scripts/check-cli-reference.py --check
      # P-13: cargo has executed the process evidence; this holds every vector and wider release
      # path in that evidence matrix and requires two peer profiles for each released transport.
      - run: ./scripts/diagnostic-phone-proof.py --check
      # C-5's end-to-end proof: the app contract interpreter driving a real call with no host,
      # asserted on the trace the example prints. Not a `#[test]`, so nothing else runs it.
      - run: bash crates/sipx-app-protocol/tests/canned_program.sh

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libopus-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      # --all-targets, so tests and dev-dependencies are covered too. Without it the declared
      # floor is verified for the library and nothing else, and a downstream user running
      # `cargo test` on the minimum version is the one who finds out.
      - run: cargo check --workspace --all-targets --all-features

  features:
    name: feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The matrix deliberately enables the optional live-device path. On Linux that path links
      # against ALSA, so the feature job needs the same build prerequisite as the all-feature and
      # documentation jobs; otherwise it tests runner provisioning rather than the feature graph.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Every other job builds `--all-features`, which cannot see a crate that fails to compile
      # with an optional feature turned *off*. That is not a hypothetical gap: `tokio::select!`
      # cannot compile a branch out behind a `#[cfg]`, and an optional transport's branch
      # referred to a field that only existed with its feature on. Nothing here noticed.
      - run: ./scripts/check-features.sh

  device-linux:
    name: device audio (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The file plugin is a real ALSA input device with no kernel module or physical microphone.
      # It gives both release architectures the same deterministic callback and shutdown proof.
      - run: cargo test -p sipx-cli --test cli --features device-audio dph_12_wav_and_virtual_device_carry_the_same_clip -- --exact

  device-portable:
    name: device audio compiles (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p sipx-cli --all-targets --features device-audio

  browser-audio:
    name: native browser audio proof
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libopus-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p sipx-call --example browser_audio_proof --features opus,dtls
      # M-51: native browser APIs in both SIP roles, non-silent Opus both ways, and the three
      # browser-driven fingerprint/nomination/downgrade negatives. The runner image inventories
      # its matched browser and WebDriver; an unavailable one is a red environment, never a skip.
      - run: ./tests/browser-audio/ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-audio-evidence
          path: ${{ runner.temp }}/sipx-browser-audio-evidence
          if-no-files-found: error
          retention-days: 14

  # The gate in AGENTS.md used to be a list of commands, and a list can quietly omit one: the
  # `msrv` job above was red from v0.4.0 through v0.7.0 while every documented command passed.
  # `gate.py --check` reads this file and fails if any job here is neither a gate step nor
  # declared as CI-only, so a job added to this file cannot go unnoticed the same way.
  gate:
    name: gate consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `test-maturity.py` renders the real report, and the report dates every story filing
          # from `git log -- docs/stories`. A depth-1 checkout has no such history: git reports
          # every story file as added by the grafted commit, so the count is the number of files
          # that happen to exist rather than the number of filings that happened.
          fetch-depth: 0
      - run: ./scripts/gate.py --check
      - run: python3 scripts/test-gate.py
      - run: python3 scripts/test-story-closure.py
      # The registry's schema guard has had a suite since X-15 and no job ran it. Both suites are
      # milliseconds and need nothing but a Python interpreter, so this is their home.
      - run: python3 scripts/test-rfc-report.py
      - run: python3 scripts/test-pool-key.py
      - run: python3 scripts/test-audio-claims.py
      - run: python3 scripts/test-maturity.py
      # A-11: exercise release ordering and the publication authority boundary without registry
      # credentials. Its fixtures prove that CI publication needs the tag and commit authorization.
      - run: python3 scripts/test-release.py
      # A-12: mutate each workflow authority and evidence boundary, then hold the real workflow to
      # the same tag-selected, least-privilege, finite and commit-bound structure, including the
      # resumable GitHub release and prohibition on broader publicity. Neither check performs a write.
      - run: python3 scripts/test-release-workflow.py
      - run: ./scripts/check-release-workflow.py --check
      # A-10/P-14: matrix runners prove native execution. These portable fixtures hold the archive,
      # SPDX, linkage-refusal, bounded-smoke and retry-byte logic without release authority.
      - run: python3 scripts/test-release-artifacts.py
      # X-38: the surface checker's own suite. Both bugs it had while being written reported
      # nothing, which is indistinguishable from a clean tree — so it is tested on fabricated
      # workspaces whose claims the test wrote.
      - run: python3 scripts/test-app-surface.py
      # X-23: the interop harness's own suite. It stubs the container runtime, so it runs here in
      # seconds rather than in the `interop` job that needs a peer.
      - run: python3 scripts/test-interop-run.py
      # P-13: reverse each help/schema comparison on fixtures so an incomplete checker cannot
      # report an agreeing public page merely because it observed nothing.
      - run: python3 scripts/test-cli-reference.py
      # P-13: reverse the proof runner's vector discovery, peer coverage and bounded execution
      # rules so the matrix cannot silently bless a path it stopped observing.
      - run: python3 scripts/test-diagnostic-phone-proof.py
      # M-51: reverse the native-browser harness's identity, evidence, completeness, output-cap
      # and process-group boundaries. The separate browser-audio job supplies the real native
      # browser positives and product-boundary negatives this adversarial self-test cannot.
      - run: python3 scripts/test-browser-audio-proof.py
      # X-71: the provenance gate now has an exception, and an exception is the part that rots.
      # This suite builds throwaway repositories to prove the scope admits the comparison
      # artifacts, rejects every other path, and never reaches the commit-message scan.
      - run: python3 scripts/test-provenance.py
      # X-72: the comparison checker carries the confidence ladder, the staleness limit and the
      # rule that this repository's own column is substituted rather than typed. A guard that
      # elaborate needs its own suite, and every rule in it has a reversed fixture.
      - run: python3 scripts/test-comparison-report.py
      # X-66: the coverage figure is published and acted on by nothing, which makes it the easiest
      # measurement in the tree to let rot into a lie. Every rule has a reversed fixture: a typed
      # percentage, a threshold appearing in either the checker or the job below, and an exclusion
      # the page claims that the tool never applied.
      - run: python3 scripts/test-coverage-report.py
      # P-28: the parity checker reads Rust with a text scanner, so a chain shape it stops
      # understanding makes it report agreement over nothing. Every rule is reversed on a
      # fabricated crate, and its blind spot is asserted to be counted rather than disclaimed.
      - run: python3 scripts/test-outcome-parity.py

  # X-66. A number, and deliberately nothing else built on it: no threshold, no ratchet, and no
  # failure when it drops. `docs/roadmap.md` rules out a v1 gate built on coverage — a percentage
  # would contradict the document it is supposed to serve — and `docs/maturity.md` already states
  # the limit this sits inside: nothing there measures whether the tests are good, only that they
  # pass. What this adds is the half that *is* mechanical: which lines the suite never executes.
  #
  # Here rather than in the local gate because measuring means an instrumented rebuild of the
  # workspace and a second full run of the suite. The cheap half — rendering the page from the
  # recorded counts and byte-comparing it — is a step in the `docs` job below, so a hand-edited
  # figure fails an implementor's gate rather than waiting for a runner. `gate.py` names this job
  # in NOT_RUN_LOCALLY with that reason.
  #
  # Nightly because `--branch` is unstable in the tool, which is the same argument the `fuzz` job
  # makes: the result is read, not shipped, and nothing built here reaches a release artifact.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    # An instrumented build is slower than the `test` job it mirrors, and a measurement nothing
    # gates on must never hold a runner for the GitHub default of six hours before anyone is told.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libopus-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      # Pinned the way every other tool in this workflow is pinned: `--locked`, and no version.
      - run: cargo install cargo-llvm-cov --locked
      # Measures, records the counts, and re-renders the page from them. No `--fail-under` of any
      # kind: this step is red only when the measurement could not be taken.
      - run: ./scripts/coverage-report.py --measure --out "$RUNNER_TEMP/coverage"
      # Publish the number where whoever reads the run will actually meet it, rather than only
      # inside a downloadable archive.
      - run: cat "$RUNNER_TEMP/coverage/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ${{ runner.temp }}/coverage
          if-no-files-found: error
          retention-days: 14

  # The peer list is read from the repository rather than written here, so that adding an interop
  # peer stays what `tests/interop/README.md` promises it is: adding a profile. A matrix spelled
  # out in this file would be a second place to remember, and the one that gets forgotten.
  interop-peers:
    name: interop peers
    runs-on: ubuntu-latest
    outputs:
      peers: ${{ steps.list.outputs.peers }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          peers="$(./tests/interop/run.sh --list | jq -R -s -c 'split("\n")[:-1]')"
          echo "peers=$peers" >>"$GITHUB_OUTPUT"
          echo "interop peers: $peers"

  # One job per peer, because a peer that breaks should say which peer broke. `fail-fast: false`
  # for the same reason: the interesting result when two implementations disagree with sipx is
  # *both* disagreements, and a cancelled sibling job hides the second one.
  interop:
    name: interop (${{ matrix.peer }})
    needs: interop-peers
    runs-on: ubuntu-latest
    # A peer that never comes up would otherwise hold a runner for the GitHub default of six
    # hours before anyone is told.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        peer: ${{ fromJSON(needs.interop-peers.outputs.peers) }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libopus-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The tests these run are `#[ignore]`d, which is what keeps `cargo test` free of any
      # container requirement. This job is the only thing that un-ignores them.
      - run: ./tests/interop/run.sh --peer ${{ matrix.peer }}

  soak:
    name: soak
    # Scheduled only. It takes minutes, and a suite people skip is worse than one that runs.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # A leak's own failure mode is a run that never finishes. Without a bound that costs the
    # GitHub default of six hours of runner time every night before anyone is told.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libopus-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Named explicitly rather than `--workspace -- --ignored`. The interop tests are ignored
      # too, and they need a Kamailio container that is not running here — a job that swept up
      # every ignored test would fail nightly for a reason that has nothing to do with leaks.
      #
      # `--all-features` because the transports with connection state are exactly the ones worth
      # soaking, and a default-features build never touches them.
      - run: cargo test -p sipx-call --test load --all-features -- --ignored

  docs:
    name: rfc compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `maturity.py --check` reads the story-filing history out of `git log`, which a
          # depth-1 checkout does not have. See the `gate` job above.
          fetch-depth: 0
      # The compliance table is generated from a registry and claims things about the code. This
      # fails the build if it has drifted from either — a table nobody checks becomes marketing.
      - run: ./scripts/rfc-report.py --check
      # The connection pool key was restated in three specs and one of them was wrong through two
      # changes to the type. The list is generated from `ConnectionKey`; this fails when a field
      # is added to the key and the spec still describes the key before it.
      - run: ./scripts/check-pool-key.py --check
      # `sipx-audio` advertised G.722 and resampling from the scaffolding commit until X-26 and
      # implements neither. This fails when a codec named in the crate's description, its
      # documentation summary or the website's crate table is implemented by no module.
      - run: ./scripts/check-audio-claims.py --check
      # The distance to 1.0 is generated from the registry and the board. A hand-kept maturity
      # number is the most tempting thing to let drift and the least useful when it has.
      - run: ./scripts/maturity.py --check
      # Alpha predicate 1: the reachable-from-a-call surface is defined as what the shipped
      # application uses, so this fails when a crate claims supported surface no application
      # reaches, or when the application starts selecting something still marked experimental.
      - run: ./scripts/check-app-surface.py --check
      # X-72: the comparison page is generated and checked like every other published table. An
      # unevidenced claim, or an observation that has aged past its limit, fails the build rather
      # than shipping with a note — half of what it states is about software we cannot test.
      - run: ./scripts/comparison-report.py --check
      # X-66: the coverage page is generated from recorded counts like every other published table
      # here, so a percentage edited by hand fails rather than shipping. This checks the rendering
      # and never the number — a measurement covering nothing at all passes.
      - run: ./scripts/coverage-report.py --check
      # P-28: `register` carried `aor` on two of its four outcomes, so a script matching a record
      # to the check that produced it had to branch on success first. This derives each command's
      # field set from its report builders and fails when one outcome omits a field a sibling
      # carries — the class, rather than the one instance that was noticed.
      - run: ./scripts/check-outcome-parity.py --check

  # The documentation site. Built on every push and pull request so a broken link fails review
  # rather than the deployed page; published only from `main`.
  site:
    name: docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      # Builds the site *and* the API reference, with `-D warnings` on the latter: a public
      # item with no documentation, or an intra-doc link that resolves nowhere, fails here —
      # and the site build throws on any broken link (`onBrokenLinks` in docusaurus.config.js).
      - run: ./scripts/build-docs.sh
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: website/build

  deploy-site:
    name: deploy docs site
    needs: site
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      # A short run on every push catches regressions; it is not a substitute for a long
      # campaign before a release. The RFC 4475 corpus seeds each target so the fuzzer starts
      # from real messages rather than noise.
      #
      # The first corpus directory is the one libFuzzer *writes* to; every later one is
      # read-only seed. Passing the RFC corpus first would have the fuzzer deposit thousands
      # of generated inputs into committed test data.
      - name: Fuzz the parsers
        run: |
          for target in parse_datagram parse_stream roundtrip; do
            # The writable corpus directory has to exist before libFuzzer is handed it, and
            # it is gitignored, so a clean checkout has no such directory.
            mkdir -p "fuzz/corpus/$target"
            cargo fuzz run "$target" \
              "fuzz/corpus/$target" crates/sipx-testkit/corpus/rfc4475 \
              -- -max_total_time=60 -max_len=8192
          done
          mkdir -p fuzz/corpus/parse_uri
          cargo fuzz run parse_uri fuzz/corpus/parse_uri -- -max_total_time=30 -max_len=512
      # X-19. The parser targets above cover adversarial *input*; this one covers adversarial
      # *timing*, which is the other half of the north star and had nothing. Its input decodes
      # into a program of events — messages, application requests, fired timers — so the budget
      # is spent inside the §17 state machines rather than on bytes that do not parse, and the
      # seed corpus is the scenarios the FSM table tests already walk, exactly as the RFC 4475
      # corpus seeds the parsers. Same time budget as one parser target; -max_len is smaller
      # because four bytes is an event and 512 is already a 128-step program.
      - name: Fuzz the transaction driver
        run: |
          mkdir -p fuzz/corpus/transaction_sequence
          cargo fuzz run transaction_sequence \
            fuzz/corpus/transaction_sequence crates/sipx-testkit/corpus/transaction-sequences \
            -- -max_total_time=60 -max_len=512
      # The corpora are committed test data: prove the fuzzer did not modify them.
      - name: Verify the RFC 4475 corpus is untouched
        run: ./scripts/import-rfc4475-corpus.sh --check
      - name: Verify the transaction-sequence corpus is untouched
        # `git diff` is blind to untracked files, so a seed added by hand would pass. Additions and
        # modifications are both checked (X-31), as the RFC 4475 corpus check has always done.
        run: ./scripts/check-corpus-untouched.sh

  # X-56. No corpus under crates/sipx-testkit/corpus/ was transcribed: each is recovered from its
  # own RFC by an importer, and each importer's --check re-recovers it and diffs it against the
  # tree. That is the only thing that can tell a fixture edited by hand from the RFC's own bytes,
  # because the test suites read whatever is in the directory and pass. RFC 4475's check ran solely
  # inside `fuzz`, which is in NOT_RUN_LOCALLY, so nothing an implementor runs before pushing
  # covered it; RFC 5118's ran nowhere at all.
  #
  # M-41 added RFC 7714's AES-GCM vectors as a third. That RFC embeds no archive, so its importer
  # slices the test-vector sections out of the document's text — the same provenance claim by the
  # only means available, and it matters as much: an AES-GCM transform with the wrong IV formation
  # is self-consistent, so the RFC's own numbers are what catch it and a fixture adjusted to match
  # a disagreeing implementation would erase precisely that.
  #
  # One job, one step per corpus. Several corpora with one rule between them is one place to
  # remember, and a step each is what makes a red result name which corpus drifted. The `fuzz` job
  # keeps its own RFC 4475 invocation: that one runs after the fuzzer in the tree the fuzzer wrote
  # to, and is a different claim — that a campaign deposited none of its generated inputs in the
  # seed corpus.
  corpus:
    name: RFC corpus provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the RFC 4475 corpus is still the RFC's own bytes
        run: ./scripts/import-rfc4475-corpus.sh --check
      - name: Verify the RFC 5118 corpus is still the RFC's own bytes
        run: ./scripts/import-rfc5118-corpus.sh --check
      - name: Verify the RFC 7714 vectors are still the RFC's own bytes
        run: ./scripts/import-rfc7714-corpus.sh --check

  # `docs/designs/media.md` has said since X-28 that a fixed wall-clock duration may bound a
  # failure or define silence and may not stand in for a happens-before. It was swept for twice and
  # enforced by nothing, so two fresh violations landed in the wave after the sweep that declared
  # the workspace clean — one of them in production code. This reads the shape rather than the
  # word `sleep`, over `src/` as well as `tests/`, and needs no toolchain to do it.
  wasm:
    name: wasm kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The targets and the runtime are installed explicitly rather than assumed: this job's whole
      # value is proving the kernel builds without an operating system under it, and a host that
      # happened to have them would hide the one failure it exists to catch.
      - run: rustup target add wasm32-unknown-unknown wasm32-wasip1
      - uses: taiki-e/install-action@v2
        with:
          tool: wasmtime
      - run: ./scripts/check-wasm-kernel.sh

  fixed-sleep:
    name: fixed-sleep rule
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-fixed-sleep.py --check

  provenance:
    name: provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for prior-art references
        env:
          SIPX_DENYLIST: ${{ secrets.SIPX_DENYLIST }}
        run: ./scripts/check-provenance.sh --history
