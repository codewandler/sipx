name: Replay unpublished crates.io beta.1

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: read

concurrency:
  group: crates-io-v1.0.0-beta.1
  cancel-in-progress: false

jobs:
  replay:
    name: replay and verify beta.1 publication
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment:
      name: release
    outputs:
      release_tag: ${{ steps.release_facts.outputs.tag }}
      release_version: ${{ steps.release_facts.outputs.version }}
      release_sha: ${{ steps.release_facts.outputs.sha }}
      release_tag_object: ${{ steps.release_facts.outputs.tag_object }}
      controller_sha: ${{ steps.release_facts.outputs.controller_sha }}
      release_notes: ${{ steps.release_facts.outputs.notes }}
    env:
      RELEASE_TAG: v1.0.0-beta.1
      RELEASE_VERSION: 1.0.0-beta.1
      RELEASE_SHA: 3ab81709c7a235831638c62eba5fe73ce9eb7773
      SIPX_FAILED_RELEASE_RUN_ID: 30906820031
      EXPECTED_RELEASE_TAG_OBJECT: b0bcadcc2a69a5824ec4a9549f7800c88c4f13fa
      EXPECTED_PAGES_RUN_ID: 30906258443
      EXPECTED_PAGES_ARTIFACT_ID: 8891214271
      CONTROLLER_ROOT: ${{ github.workspace }}/controller
      SIPX_RELEASE_ROOT: ${{ github.workspace }}/release
      RELEASE_NOTES: docs/releases/1.0.0-beta.1-replay.md
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - name: Check out the fixed beta.1 replay controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: controller
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the immutable beta.1 tag separately
        uses: actions/checkout@v4
        with:
          ref: refs/tags/v1.0.0-beta.1
          path: release
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the fixed controller and immutable beta.1 tag
        id: release_facts
        shell: bash
        run: |
          set -euo pipefail
          expected_workflow_ref="$GITHUB_REPOSITORY/.github/workflows/crates-io-beta1-replay.yml@refs/heads/main"
          if [[ "$GITHUB_REF" != refs/heads/main || "$GITHUB_REF_NAME" != main || "$GITHUB_REF_TYPE" != branch ]]; then
            echo "beta.1 replay must be dispatched with main selected as its ref" >&2
            exit 1
          fi
          if [[ "$GITHUB_WORKFLOW_REF" != "$expected_workflow_ref" ]]; then
            echo "beta.1 replay workflow source is not exact main: $GITHUB_WORKFLOW_REF" >&2
            exit 1
          fi
          controller_sha="$(git -C "$CONTROLLER_ROOT" rev-parse HEAD)"
          if [[ "$GITHUB_SHA" != "$GITHUB_WORKFLOW_SHA" || "$controller_sha" != "$GITHUB_SHA" ]]; then
            echo "controller checkout, event SHA and workflow SHA must be identical" >&2
            exit 1
          fi
          if [[ -n "$(git -C "$CONTROLLER_ROOT" status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "controller checkout is not clean" >&2
            exit 1
          fi
          if [[ "$(git -C "$SIPX_RELEASE_ROOT" cat-file -t "refs/tags/$RELEASE_TAG")" != tag ]]; then
            echo "$RELEASE_TAG is not an annotated tag" >&2
            exit 1
          fi
          local_tag_object="$(git -C "$SIPX_RELEASE_ROOT" rev-parse "refs/tags/$RELEASE_TAG")"
          remote_tag_object="$(git -C "$SIPX_RELEASE_ROOT" ls-remote --refs --tags origin "refs/tags/$RELEASE_TAG" | awk 'NR == 1 { print $1 } NR > 1 { exit 2 }')"
          if [[ "$local_tag_object" != "$EXPECTED_RELEASE_TAG_OBJECT" || "$remote_tag_object" != "$EXPECTED_RELEASE_TAG_OBJECT" ]]; then
            echo "local and remote beta.1 tag objects must remain pinned at $EXPECTED_RELEASE_TAG_OBJECT" >&2
            exit 1
          fi
          release_sha="$(git -C "$SIPX_RELEASE_ROOT" rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if [[ "$release_sha" != "$RELEASE_SHA" || "$(git -C "$SIPX_RELEASE_ROOT" rev-parse HEAD)" != "$RELEASE_SHA" ]]; then
            echo "beta.1 release checkout is not the pinned commit $RELEASE_SHA" >&2
            exit 1
          fi
          version="$(python3 - "$SIPX_RELEASE_ROOT/Cargo.toml" <<'PY'
          import pathlib
          import sys
          import tomllib

          manifest = pathlib.Path(sys.argv[1])
          print(tomllib.loads(manifest.read_text(encoding="utf-8"))["workspace"]["package"]["version"])
          PY
          )"
          if [[ "$version" != "$RELEASE_VERSION" || "$RELEASE_TAG" != "v$version" ]]; then
            echo "beta.1 tag, pinned version and workspace version differ" >&2
            exit 1
          fi
          mapfile -t tags < <(git -C "$SIPX_RELEASE_ROOT" tag --points-at HEAD)
          if [[ "${#tags[@]}" -ne 1 || "${tags[0]}" != "$RELEASE_TAG" ]]; then
            echo "beta.1 release commit must carry only $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ -n "$(git -C "$SIPX_RELEASE_ROOT" status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "beta.1 release checkout is not clean" >&2
            exit 1
          fi
          git -C "$SIPX_RELEASE_ROOT" fetch --no-tags origin main:refs/remotes/origin/main
          if ! git -C "$SIPX_RELEASE_ROOT" merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "$RELEASE_TAG is not contained in origin/main" >&2
            exit 1
          fi
          if [[ ! -s "$CONTROLLER_ROOT/$RELEASE_NOTES" ]]; then
            echo "reviewed beta.1 replay notes are missing: $RELEASE_NOTES" >&2
            exit 1
          fi
          {
            echo "tag=$RELEASE_TAG"
            echo "version=$RELEASE_VERSION"
            echo "sha=$RELEASE_SHA"
            echo "tag_object=$local_tag_object"
            echo "controller_sha=$controller_sha"
            echo "notes=$RELEASE_NOTES"
          } >>"$GITHUB_OUTPUT"

      - name: Authorize beta.1 replay from the failed release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_record="$RUNNER_TEMP/sipx-beta1-failed-run.json"
          jobs_record="$RUNNER_TEMP/sipx-beta1-failed-jobs.json"
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SIPX_FAILED_RELEASE_RUN_ID" >"$run_record"
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SIPX_FAILED_RELEASE_RUN_ID/jobs?filter=latest&per_page=100" \
            >"$jobs_record"
          python3 - "$run_record" "$jobs_record" "$RELEASE_TAG" "$RELEASE_SHA" "$SIPX_FAILED_RELEASE_RUN_ID" <<'PY'
          import json
          import pathlib
          import sys

          run = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          jobs = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8")).get("jobs", [])
          tag, sha, requested_id = sys.argv[3:]
          problems = []
          if str(run.get("id")) != requested_id:
              problems.append("returned run ID differs")
          if run.get("path") != ".github/workflows/crates-io.yml":
              problems.append("run is not from the ordinary release workflow")
          if run.get("head_sha") != sha or run.get("head_branch") != tag:
              problems.append("run is not bound to immutable beta.1")
          if run.get("event") != "push":
              problems.append("run was not the beta.1 tag push")
          if run.get("status") != "completed" or run.get("conclusion") != "failure":
              problems.append("run is not a completed failure")

          release_jobs = [job for job in jobs if job.get("name") == "publish and verify prerelease"]
          if len(release_jobs) != 1:
              problems.append("run does not have exactly one release job")
          else:
              job = release_jobs[0]
              if job.get("conclusion") != "failure":
                  problems.append("release job did not fail")
              steps = {step.get("name"): step for step in job.get("steps", [])}
              required = {
                  "Validate the immutable annotated tag": "success",
                  "Run the complete release gate": "failure",
                  "Rehearse the locked registry packages": "skipped",
                  "Publish dependency-ready frontiers under a finite bound": "skipped",
                  "Verify the exact registry consumer and installed CLI": "skipped",
                  "Verify Pages deployment from the release commit": "skipped",
              }
              for name, conclusion in required.items():
                  if steps.get(name, {}).get("conclusion") != conclusion:
                      problems.append(f"{name!r} was not {conclusion}")
              ordered = list(required)
              numbers = [steps.get(name, {}).get("number") for name in ordered]
              if any(not isinstance(number, int) for number in numbers) or numbers != sorted(numbers):
                  problems.append("failed release evidence is out of order")

          prerelease_jobs = [job for job in jobs if job.get("name") == "publish or verify GitHub prerelease"]
          if len(prerelease_jobs) != 1 or prerelease_jobs[0].get("conclusion") != "skipped":
              problems.append("the failed run reached or omitted the GitHub prerelease job")
          if problems:
              raise SystemExit("beta.1 failed run is not replay evidence: " + "; ".join(problems))
          PY

      - name: Install beta.1 replay build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libopus-dev libssl-dev pkg-config
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          msrv="$(python3 - "$SIPX_RELEASE_ROOT/Cargo.toml" <<'PY'
          import pathlib
          import sys
          import tomllib

          print(tomllib.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))["workspace"]["package"]["rust-version"])
          PY
          )"
          rustup toolchain install "$msrv" --profile minimal

      - name: Set up beta.1 documentation toolchain
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: release/website/package-lock.json

      - name: Rerun the complete beta.1 gate
        env:
          SIPX_DENYLIST: ${{ secrets.SIPX_DENYLIST }}
        working-directory: release
        run: |
          if [[ -z "$SIPX_DENYLIST" ]]; then
            echo "the release environment must provide SIPX_DENYLIST" >&2
            exit 1
          fi
          ./scripts/gate.py

      - name: Rehearse the immutable beta.1 packages
        working-directory: controller
        run: |
          ./scripts/release.py \
            --release-root "$SIPX_RELEASE_ROOT" \
            --dry-run \
            --command-timeout-seconds 1800

      - name: Require the approved Cargo credential for beta.1 replay
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "the release environment must provide CARGO_REGISTRY_TOKEN" >&2
            exit 1
          fi

      - name: Replay dependency-ready beta.1 frontiers under a finite bound
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        working-directory: controller
        run: |
          set -euo pipefail
          public_count="$(cargo metadata --manifest-path "$SIPX_RELEASE_ROOT/Cargo.toml" --no-deps --format-version 1 | python3 -c 'import json, sys; print(sum(package.get("publish") != [] for package in json.load(sys.stdin)["packages"]))')"
          max_invocations=$((public_count + 1))
          report="$RUNNER_TEMP/sipx-beta1-replay-frontier.txt"
          complete=false
          for ((invocation = 1; invocation <= max_invocations; invocation++)); do
            echo "beta.1 replay frontier invocation $invocation of $max_invocations"
            remote_tag_object="$(git -C "$SIPX_RELEASE_ROOT" ls-remote --refs --tags origin "refs/tags/$RELEASE_TAG" | awk 'NR == 1 { print $1 } NR > 1 { exit 2 }')"
            if [[ "$remote_tag_object" != "$EXPECTED_RELEASE_TAG_OBJECT" ]]; then
              echo "remote beta.1 tag object moved before replay invocation $invocation" >&2
              exit 1
            fi
            : >"$report"
            ./scripts/release.py \
              --release-root "$SIPX_RELEASE_ROOT" \
              --publish \
              --confirm-publish "$RELEASE_TAG" \
              --authorize-ci-beta1-replay "$RELEASE_TAG@$RELEASE_SHA@$SIPX_FAILED_RELEASE_RUN_ID" \
              --registry-wait-seconds 300 \
              --command-timeout-seconds 1800 2>&1 | tee "$report"
            if grep -Fqx "all public packages are already registry-visible" "$report"; then
              complete=true
              break
            fi
          done
          if [[ "$complete" != true ]]; then
            echo "beta.1 replay did not reach all-visible in $max_invocations invocations" >&2
            exit 1
          fi

      - name: Verify the exact beta.1 registry consumer and installed CLI
        working-directory: controller
        run: |
          ./scripts/release.py \
            --release-root "$SIPX_RELEASE_ROOT" \
            --verify-consumer \
            --registry-wait-seconds 300 \
            --consumer-timeout-seconds 900 \
            --command-timeout-seconds 1800

      - name: Verify the archived beta.1 Pages artifact and current beta.2 site
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_record="$RUNNER_TEMP/sipx-beta1-pages-run.json"
          jobs_record="$RUNNER_TEMP/sipx-beta1-pages-jobs.json"
          artifact_record="$RUNNER_TEMP/sipx-beta1-pages-artifact.json"
          artifact_zip="$RUNNER_TEMP/sipx-beta1-pages.zip"
          artifact_dir="$RUNNER_TEMP/sipx-beta1-pages"
          mkdir "$artifact_dir"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EXPECTED_PAGES_RUN_ID" >"$run_record"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$EXPECTED_PAGES_RUN_ID/jobs?per_page=100" >"$jobs_record"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$EXPECTED_PAGES_ARTIFACT_ID" >"$artifact_record"
          python3 - "$run_record" "$jobs_record" "$artifact_record" "$RELEASE_SHA" "$EXPECTED_PAGES_RUN_ID" "$EXPECTED_PAGES_ARTIFACT_ID" <<'PY'
          import json
          import pathlib
          import sys

          run = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          jobs = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8")).get("jobs", [])
          artifact = json.loads(pathlib.Path(sys.argv[3]).read_text(encoding="utf-8"))
          sha, run_id, artifact_id = sys.argv[4:]
          problems = []
          if str(run.get("id")) != run_id or run.get("head_sha") != sha:
              problems.append("Pages run identity differs")
          if run.get("path") != ".github/workflows/ci.yml" or run.get("head_branch") != "main":
              problems.append("Pages run is not exact main CI")
          if run.get("event") != "push" or run.get("conclusion") != "success":
              problems.append("Pages run is not a successful main push")
          if not any(job.get("name") == "deploy docs site" and job.get("conclusion") == "success" for job in jobs):
              problems.append("Pages deployment job is absent or failed")
          workflow_run = artifact.get("workflow_run") or {}
          if str(artifact.get("id")) != artifact_id or artifact.get("name") != "github-pages":
              problems.append("Pages artifact identity differs")
          if artifact.get("expired") is not False:
              problems.append("Pages artifact is expired")
          if str(workflow_run.get("id")) != run_id or workflow_run.get("head_sha") != sha:
              problems.append("Pages artifact is not bound to the exact CI run")
          if problems:
              raise SystemExit("beta.1 Pages evidence failed: " + "; ".join(problems))
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$EXPECTED_PAGES_ARTIFACT_ID/zip" >"$artifact_zip"
          unzip -q "$artifact_zip" -d "$artifact_dir"
          tar -xf "$artifact_dir/artifact.tar" -C "$artifact_dir" \
            ./docs/getting-started.html ./api/sipx_call/index.html
          grep -Fq "$RELEASE_VERSION" "$artifact_dir/docs/getting-started.html"
          if grep -Fq "1.0.0-beta.2" "$artifact_dir/docs/getting-started.html"; then
            echo "archived beta.1 guide unexpectedly names beta.2" >&2
            exit 1
          fi
          test -s "$artifact_dir/api/sipx_call/index.html"
          current_guide="$RUNNER_TEMP/sipx-current-getting-started.html"
          curl --fail --silent --show-error --location \
            --retry 8 --retry-all-errors --retry-max-time 120 --connect-timeout 10 --max-time 20 \
            --output "$current_guide" https://codewandler.github.io/sipx/docs/getting-started
          grep -Fq "1.0.0-beta.2" "$current_guide"
          curl --fail --silent --show-error --location \
            --retry 8 --retry-all-errors --retry-max-time 120 --connect-timeout 10 --max-time 20 \
            --output /dev/null https://codewandler.github.io/sipx/api/sipx_call/index.html
          echo "archived beta.1 Pages artifact and current beta.2 site are both verified"

  github_release:
    name: publish or verify replayed beta.1 GitHub prerelease
    needs: replay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.replay.outputs.release_tag }}
      RELEASE_VERSION: ${{ needs.replay.outputs.release_version }}
      RELEASE_SHA: ${{ needs.replay.outputs.release_sha }}
      RELEASE_TAG_OBJECT: ${{ needs.replay.outputs.release_tag_object }}
      CONTROLLER_SHA: ${{ needs.replay.outputs.controller_sha }}
      RELEASE_NOTES: ${{ needs.replay.outputs.release_notes }}
    steps:
      - name: Check out the reviewed beta.1 replay record
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.replay.outputs.controller_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create or verify the replayed beta.1 GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$CONTROLLER_SHA" || -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "beta.1 replay record checkout is not the exact clean controller" >&2
            exit 1
          fi
          local_tag_object="$(git rev-parse "refs/tags/$RELEASE_TAG")"
          remote_tag_object="$(git ls-remote --refs --tags origin "refs/tags/$RELEASE_TAG" | awk 'NR == 1 { print $1 } NR > 1 { exit 2 }')"
          if [[ "$local_tag_object" != "$RELEASE_TAG_OBJECT" || "$remote_tag_object" != "$RELEASE_TAG_OBJECT" ]]; then
            echo "beta.1 tag object moved before GitHub prerelease handling" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            record="$RUNNER_TEMP/sipx-existing-beta1-release.json"
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" >"$record"
            python3 - "$record" "$RELEASE_NOTES" "$RELEASE_TAG" "$RELEASE_VERSION" "$RELEASE_SHA" <<'PY'
          import json
          import pathlib
          import sys

          record = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          notes = pathlib.Path(sys.argv[2]).read_text(encoding="utf-8").strip()
          tag, version, sha = sys.argv[3:]
          problems = []
          if record.get("tag_name") != tag or record.get("target_commitish") != sha:
              problems.append("tag or target differs")
          if record.get("name") != f"sipx {version}":
              problems.append("title differs")
          if record.get("draft") is not False or record.get("prerelease") is not True:
              problems.append("release is not a published prerelease")
          if str(record.get("body", "")).strip() != notes:
              problems.append("reviewed replay notes differ")
          if record.get("assets"):
              problems.append("unexpected uploaded assets")
          if problems:
              raise SystemExit("existing beta.1 Release differs: " + ", ".join(problems))
          PY
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --target "$RELEASE_SHA" \
              --prerelease \
              --title "sipx $RELEASE_VERSION" \
              --notes-file "$RELEASE_NOTES"
          fi
