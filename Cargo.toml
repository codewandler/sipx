[workspace]
resolver = "3"
members = ["crates/*"]
# The fuzz crate needs a nightly toolchain and libfuzzer; it is built by its own CI job.
exclude = ["fuzz"]

[workspace.package]
version = "1.0.0-alpha.5"
edition = "2024"
# Raised from 1.85 by the DNS client needed to clear RUSTSEC-2026-0119. The alternative was
# shipping a known denial of service in a parser that eats untrusted network data.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codewandler/sipx"
authors = ["Timo Friedl <timofriedlberlin@gmail.com>"]
keywords = ["sip", "voip", "rtp", "telephony"]
categories = ["network-programming", "multimedia"]

[workspace.dependencies]
# Internal crates
sipx-sip = { path = "crates/sipx-sip", version = "1.0.0-alpha.5" }
sipx-sdp = { path = "crates/sipx-sdp", version = "1.0.0-alpha.5" }
sipx-rtp = { path = "crates/sipx-rtp", version = "1.0.0-alpha.5" }
sipx-audio = { path = "crates/sipx-audio", version = "1.0.0-alpha.5" }
sipx-media = { path = "crates/sipx-media", version = "1.0.0-alpha.5" }
sipx-transport = { path = "crates/sipx-transport", version = "1.0.0-alpha.5" }
sipx-ua = { path = "crates/sipx-ua", version = "1.0.0-alpha.5" }
sipx-call = { path = "crates/sipx-call", version = "1.0.0-alpha.5" }
sipx-app = { path = "crates/sipx-app", version = "1.0.0-alpha.5" }
sipx-app-protocol = { path = "crates/sipx-app-protocol", version = "1.0.0-alpha.5" }
sipx-testkit = { path = "crates/sipx-testkit", version = "1.0.0-alpha.5" }

# Core
bytes = "1"
thiserror = "2"
rand = "0.9"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls-pki-types = { version = "1", features = ["std"] }
rustls-native-certs = "0.8"
rcgen = "0.14"
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"] }
# WebSocket framing and the RFC 6455 handshake. No TLS features: sipx drives its own handshake
# with the `tls` module, so WSS is the TLS policy from T-7 with WebSocket framing on top rather
# than a second, subtly different certificate check.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Opus, behind a feature. The only C dependency in the workspace, and it earns its place:
# there is no pure-Rust encoder of comparable quality, and a codec that cannot encode is not a
# codec a softphone can offer.
opus = "0.3"
# DTLS-SRTP (RFC 5764), behind the `dtls` feature and off by default. The second C dependency in
# the workspace, and it earns its place the way opus does: there is no pure-Rust DTLS of
# comparable scrutiny, and a hand-rolled handshake for a security-critical protocol is a
# liability nobody asked for. OpenSSL is also where `use_srtp` and the RFC 5705 exporter have
# been exercised against every other implementation for a decade.
openssl = "0.10"
# SRTP's default transform: AES-128 in counter mode with HMAC-SHA1. RustCrypto rather than a
# bespoke implementation — the arithmetic is not the hard part of SRTP, and a hand-rolled AES is
# a liability nobody asked for. `subtle` is for comparing authentication tags without leaking
# their contents through timing.
aes = "0.8"
ctr = "0.9"
hmac = "0.12"
sha1 = "0.10"
subtle = "2"
md-5 = "0.10"
sha2 = "0.10"
p256 = "0.13"
base64 = "0.22"
serde_json = "1"
tracing = "0.1"
# The document-mode application host is the only HTTP client in the workspace. Redirects and
# serialization policy are deliberately selected by `sipx-app`, not hidden in a kernel crate.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Async runtime (never used by the sans-IO crates)
tokio = { version = "1", default-features = false }
tokio-util = "0.7"

# Test / bench
anyhow = "1"
proptest = "1"
pretty_assertions = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
# Every public item carries documentation. Enforced rather than maintained by habit: the
# published API pages are the only view most users get of these crates, and one undocumented
# `pub fn` in them reads as an oversight in all of them.
missing_docs = "warn"

[workspace.lints.rustdoc]
# A link that resolves in the editor's tooltip and 404s on the site is worse than no link.
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
invalid_codeblock_attributes = "warn"
invalid_rust_codeblocks = "warn"
bare_urls = "warn"
unescaped_backticks = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints we deliberately disable: protocol code is full of small
# numeric casts and long match arms where these fire without adding value.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Panics have no place in a stack that parses hostile network input.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
debug = true
