[workspace]
resolver = "3"
members = ["crates/*"]
# The fuzz crate needs a nightly toolchain and libfuzzer; it is built by its own CI job.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codewandler/sipx"
authors = ["Timo Friedl <timofriedlberlin@gmail.com>"]
keywords = ["sip", "voip", "rtp", "telephony"]
categories = ["network-programming", "multimedia"]

[workspace.dependencies]
# Internal crates
sipx-sip = { path = "crates/sipx-sip", version = "0.1.0" }
sipx-sdp = { path = "crates/sipx-sdp", version = "0.1.0" }
sipx-rtp = { path = "crates/sipx-rtp", version = "0.1.0" }
sipx-audio = { path = "crates/sipx-audio", version = "0.1.0" }
sipx-media = { path = "crates/sipx-media", version = "0.1.0" }
sipx-transport = { path = "crates/sipx-transport", version = "0.1.0" }
sipx-ua = { path = "crates/sipx-ua", version = "0.1.0" }
sipx-call = { path = "crates/sipx-call", version = "0.1.0" }
sipx-testkit = { path = "crates/sipx-testkit", version = "0.1.0" }

# Core
bytes = "1"
thiserror = "2"
rand = "0.9"
md-5 = "0.10"
sha2 = "0.10"
tracing = "0.1"

# Async runtime (never used by the sans-IO crates)
tokio = { version = "1", default-features = false }
tokio-util = "0.7"

# Test / bench
anyhow = "1"
proptest = "1"
pretty_assertions = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints we deliberately disable: protocol code is full of small
# numeric casts and long match arms where these fire without adding value.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Panics have no place in a stack that parses hostile network input.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
debug = true
