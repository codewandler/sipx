[package]
name = "sipx-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bytes = "1"
sipx-sip = { path = "../crates/sipx-sip" }

[[bin]]
name = "parse_datagram"
path = "fuzz_targets/parse_datagram.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_stream"
path = "fuzz_targets/parse_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_uri"
path = "fuzz_targets/parse_uri.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false
