[package]
name = "sipx-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace root, stated rather than implied. The root manifest's `exclude = ["fuzz"]`
# says the same thing only for a checkout that sits at the top of the filesystem walk; in a git
# worktree nested inside another checkout of this repo, cargo walks past the excluding manifest,
# finds the outer one, and refuses to build. Two words here make the fuzz crate buildable from
# any layout, which matters because the fuzz targets are the checks nobody runs by accident.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
bytes = "1"
sipx-sip = { path = "../crates/sipx-sip" }
# The transaction-sequence harness — its event vocabulary, decoder, driver and invariant oracle
# — lives in the workspace's test crate rather than here, so the fuzz target and the regression
# tests in `crates/sipx-sip/tests/` drive exactly the same code. A corpus entry that crashes the
# fuzzer is replayed by a test byte for byte; two copies of the driver would make that a lie.
sipx-testkit = { path = "../crates/sipx-testkit" }
# `M-122`'s harness — the program vocabulary, the octet encoder and §7.4's invariant oracle — lives
# in the crate that owns the decoder, because the oracle's last rule is checked against the two real
# callers and both are crate-private: a worker's `serve` and a stage's `pump`. Reaching them from
# here through a public door would mean publishing the decoder; reaching them from the test crate
# would mean publishing it twice.
sipx-media = { path = "../crates/sipx-media" }

[[bin]]
name = "parse_datagram"
path = "fuzz_targets/parse_datagram.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_stream"
path = "fuzz_targets/parse_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_uri"
path = "fuzz_targets/parse_uri.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "transaction_sequence"
path = "fuzz_targets/transaction_sequence.rs"
test = false
doc = false
bench = false

[[bin]]
name = "call_audio_sequence"
path = "fuzz_targets/call_audio_sequence.rs"
test = false
doc = false
bench = false

[[bin]]
name = "worker_protocol_sequence"
path = "fuzz_targets/worker_protocol_sequence.rs"
test = false
doc = false
bench = false
